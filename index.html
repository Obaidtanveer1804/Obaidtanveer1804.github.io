<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Obaid Tanveer, embedded firmware engineer (terminal)</title>
  <meta name="description" content="Obaid Tanveer's portfolio as an embedded terminal: browse projects and experience with ls, cd and cat, or blink the dev board's LEDs.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <div class="shell">
    <!-- Status bar -->
    <header class="statusbar">
      <span class="statusbar__port"><span class="statusbar__led" aria-hidden="true"></span>/dev/ttyACM0 · 115200 8N1</span>
      <span class="statusbar__title">obaid@stm32h7</span>
      <span class="statusbar__right">
        <span class="statusbar__clock" data-clock>Besançon</span>
        <a class="statusbar__site" href="site.html">Open website <span aria-hidden="true">↗</span></a>
      </span>
    </header>

    <main class="workspace">
      <!-- Terminal -->
      <section class="terminal" aria-label="Terminal">
        <div class="terminal__scroll" data-scroll>
          <div class="terminal__output" data-output role="log" aria-live="polite"></div>
          <form class="terminal__prompt" data-prompt-form autocomplete="off">
            <label class="terminal__ps1" for="command-input" data-ps1>obaid@stm32h7:~$</label>
            <input class="terminal__input" id="command-input" data-input type="text" spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="send" aria-label="Type a command">
          </form>
        </div>
      </section>

      <!-- Side panel: dev board + quick commands -->
      <aside class="panel" aria-label="Dev board and quick commands">
        <div class="board">
          <svg class="board__svg" viewBox="0 0 320 214" role="img" aria-label="STM32 development board with user LEDs">
            <defs>
              <filter id="led-glow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="3.2"/>
              </filter>
            </defs>

            <!-- PCB -->
            <rect class="pcb" x="6" y="14" width="308" height="194" rx="12"/>
            <circle class="pcb__hole" cx="20" cy="28" r="5"/>
            <circle class="pcb__hole" cx="300" cy="28" r="5"/>
            <circle class="pcb__hole" cx="20" cy="194" r="5"/>
            <circle class="pcb__hole" cx="300" cy="194" r="5"/>

            <!-- Traces -->
            <g class="trace">
              <path d="M118 92H70V60H44"/>
              <path d="M118 104H62V84H44"/>
              <path d="M118 128H70V156H44"/>
              <path d="M202 92h46V60h28"/>
              <path d="M202 116h28v20h46"/>
              <path d="M150 82V46h10V30"/>
              <path d="M170 82V46h-10"/>
              <path d="M160 152v16h-58v10"/>
              <path d="M180 152v20h20v6"/>
              <path d="M140 152v24h-62"/>
            </g>

            <!-- USB connector + TX/RX LEDs -->
            <rect class="usb" x="138" y="4" width="44" height="22" rx="3"/>
            <rect class="usb__mouth" x="146" y="8" width="28" height="6" rx="1.5"/>
            <g data-led="tx"><circle class="led__halo" cx="200" cy="34" r="7"/><rect class="led__body led--yellow" x="196" y="31" width="8" height="5" rx="1"/></g>
            <g data-led="rx"><circle class="led__halo" cx="216" cy="34" r="7"/><rect class="led__body led--green" x="212" y="31" width="8" height="5" rx="1"/></g>
            <text class="silk" x="194" y="48">TX</text>
            <text class="silk" x="210" y="48">RX</text>

            <!-- Pin headers -->
            <g class="header">
              <rect x="32" y="40" width="14" height="136" rx="2"/>
              <rect x="274" y="40" width="14" height="136" rx="2"/>
            </g>
            <g class="pins" data-pins></g>

            <!-- MCU -->
            <g class="mcu">
              <g class="mcu__legs" data-mcu-legs></g>
              <rect class="mcu__body" x="122" y="82" width="76" height="70" rx="4"/>
              <circle class="mcu__dot" cx="131" cy="91" r="2.5"/>
              <text class="mcu__label" x="160" y="113">STM32H7</text>
              <text class="mcu__sub" x="160" y="126">OBAID-FW</text>
              <text class="mcu__sub" x="160" y="138">480 MHz</text>
            </g>

            <!-- Crystal -->
            <rect class="xtal" x="222" y="96" width="26" height="12" rx="6"/>
            <text class="silk" x="222" y="120">25MHz</text>

            <!-- User LEDs -->
            <g data-led="pwr" class="is-on"><circle class="led__halo" cx="68" cy="186" r="9"/><rect class="led__body led--red" x="63" y="183" width="10" height="6" rx="1.2"/></g>
            <g data-led="1"><circle class="led__halo" cx="104" cy="186" r="9"/><rect class="led__body led--green" x="99" y="183" width="10" height="6" rx="1.2"/></g>
            <g data-led="2"><circle class="led__halo" cx="140" cy="186" r="9"/><rect class="led__body led--blue" x="135" y="183" width="10" height="6" rx="1.2"/></g>
            <g data-led="3"><circle class="led__halo" cx="176" cy="186" r="9"/><rect class="led__body led--red" x="171" y="183" width="10" height="6" rx="1.2"/></g>
            <text class="silk" x="60" y="202">PWR</text>
            <text class="silk" x="98" y="202">LD1</text>
            <text class="silk" x="134" y="202">LD2</text>
            <text class="silk" x="170" y="202">LD3</text>

            <!-- Buttons -->
            <g class="button" data-button="user" role="button" tabindex="0" aria-label="Press the USER button">
              <rect class="button__base" x="218" y="166" width="26" height="26" rx="3"/>
              <circle class="button__cap button__cap--blue" cx="231" cy="179" r="8"/>
            </g>
            <g class="button" data-button="reset" role="button" tabindex="0" aria-label="Press RESET to reboot the terminal">
              <rect class="button__base" x="254" y="166" width="26" height="26" rx="3"/>
              <circle class="button__cap" cx="267" cy="179" r="8"/>
            </g>
            <text class="silk" x="220" y="204">USER</text>
            <text class="silk" x="252" y="204">RESET</text>

            <text class="silk silk--title" x="58" y="34">OT-H747 DEV BOARD</text>
          </svg>
          <p class="board__readout" data-readout>SYSCLK 480 MHz · VDD 3.30 V · 34.0 °C</p>
        </div>

        <div class="quick">
          <h2 class="quick__title">Start here</h2>
          <ul class="quick__list">
            <li><button type="button" data-run="printf(experience);"><code>printf(experience);</code><span>Work history</span></button></li>
            <li><button type="button" data-run="ls projects/"><code>ls projects/</code><span>Projects</span></button></li>
            <li><button type="button" data-run="cat main.c"><code>cat main.c</code><span>About me, in C</span></button></li>
            <li><button type="button" data-run="printf(skills);"><code>printf(skills);</code><span>Skills</span></button></li>
            <li><button type="button" data-run="blink led"><code>blink led</code><span>Blink LD2 on the board</span></button></li>
            <li><button type="button" data-run="contact"><code>contact</code><span>Email, GitHub, LinkedIn</span></button></li>
          </ul>
          <p class="quick__hint"><code>help</code> lists every command. <kbd>Tab</kbd> completes, <kbd>↑</kbd><kbd>↓</kbd> recall history.</p>
        </div>
      </aside>
    </main>

    <footer class="footerbar">
      <span>© <span data-year></span> Obaid Tanveer</span>
      <a href="site.html">Not a terminal person? Switch to the website</a>
    </footer>
  </div>

  <script src="assets/js/portfolio-data.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
