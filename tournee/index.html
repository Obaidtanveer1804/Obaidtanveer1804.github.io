        if (key === "includeSkipped") { Nav.resetLive(); renderAll(); }
        openSettings();
      };
    });
    body.querySelectorAll("[data-profile]").forEach((b) => {
      b.onclick = () => {
        state.settings.profile = b.dataset.profile; save();
        Router.setProfile(state.settings.profile); Nav.resetLive(); refreshNav(true); openSettings();
      };
    });
    body.querySelectorAll("[data-radius]").forEach((b) => {
      b.onclick = () => { state.settings.arrivalRadius = Number(b.dataset.radius); save(); openSettings(); };
    });
    body.querySelectorAll("[data-style]").forEach((b) => { b.onclick = () => { applyStyle(b.dataset.style); openSettings(); }; });
  }

  function downloadSample() {
    const blob = new Blob(["﻿" + SAMPLE_CSV], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tournee_sample.csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- offline map ---------- */
  async function saveOfflineMap() {
    if (!Offline.supported) { Toast.show("Offline maps work in the web version opened over https"); return; }
    const plan = Offline.planTiles([state.round.start, ...state.ordered], state.settings.mapStyle);
    const html = `
      <div class="settings"><h2>Save map for offline</h2>
        <p class="foot-note" style="margin:6px 0 12px">Downloads ${plan.count} map tiles (zoom 14–19) around your round, about ${plan.megabytes} MB. Best on Wi-Fi.</p>
        <div class="sh-actions" style="margin-top:0"><button class="btn primary" data-act="go">Download</button><button class="btn" data-act="no">Cancel</button></div>
      </div>`;
    const body = Sheet.open(html, { label: "Save map for offline" });
    body.querySelector("[data-act=no]").onclick = Sheet.close;
    body.querySelector("[data-act=go]").onclick = async () => {
      Sheet.close();
      Busy.show("Saving map…", 0);
      try {
        const result = await Offline.download(plan.urls, (done, total) => Busy.show(`Saving map… ${done}/${total}`, done / total));
        Toast.show(`Map saved for offline · ${result.ok} tiles${result.failed ? ` (${result.failed} failed)` : ""}`, "", null, 6000);
      } finally {
        Busy.hide();
      }
    };
  }

  /* ---------- route order ---------- */
  async function fetchTravel(start, stops) {
    if (!state.settings.directions) return null;
    Busy.show("Getting travel times…", 0);
    const table = await Router.matrix([start, ...stops], (done, total) => Busy.show(`Getting travel times… ${done}/${total}`, done / total));
    return table ? { table } : null;
  }

  async function reoptimise(keepDone) {
    try {
      const done = doneIds();
      const doneOrder = keepDone ? state.round.order.filter((id) => done.has(id)) : [];
      const remaining = state.round.stops.filter((s) => !doneOrder.includes(s.id));
      const startPoint = keepDone && doneOrder.length && freshMe() ? freshMe() : state.round.start;
      const travel = await fetchTravel(startPoint, remaining);
      Busy.show("Optimising route…");
      const sub = { ...state.round, stops: remaining, start: startPoint, order: [] };
      await Optimizer.optimise(sub, 2500, travel && travel.table);
      state.round.order = [...doneOrder, ...sub.order];
      state.round.optimised = true;
      state.round.optimisedOn = sub.optimisedOn;
      rebuildOrder(); persist();
      state.selectedId = null; Nav.resetLive();
      renderAll(); showNext();
      Toast.show(`Route optimised${sub.optimisedOn === "bike" ? " on real travel times" : " (straight-line estimate)"}`);
    } finally {
      Busy.hide();
    }
  }

  function useListOrder({ quiet = false } = {}) {
    const listed = state.round.stops.slice().sort((a, b) => (a.listIndex ?? 0) - (b.listIndex ?? 0));
    state.round.order = listed.map((s) => s.id);
    state.round.optimised = false;
    rebuildOrder(); persist(); state.selectedId = null; Nav.resetLive(); renderAll(); showNext();
    if (!quiet) Toast.show("Following your list’s order");
  }

  function setStart(latlng, label) {
    state.round.start = { lat: latlng.lat, lon: latlng.lon ?? latlng.lng, label };
    persist(); renderAll({ scrollCards: false });
    Toast.show("Start point moved");
  }

  function askStartHere(latlng) {
    if (state.pickingPinFor) return;
    const html = `
      <div class="settings"><h2>Move start point here?</h2>
        <p class="foot-note" style="margin:6px 0 14px">The round will begin and end at this spot (e.g. the Lidl entrance / Ginko stop).</p>
        <div class="sh-actions" style="margin-top:0"><button class="btn primary" data-act="yes">Set start here</button><button class="btn" data-act="no">Cancel</button></div>
      </div>`;
    const body = Sheet.open(html, { label: "Start point" });
    body.querySelector("[data-act=yes]").onclick = () => { Sheet.close(); setStart({ lat: latlng.lat, lon: latlng.lng }, "Custom start"); };
    body.querySelector("[data-act=no]").onclick = Sheet.close;
  }

  /* ---------- first run (no round yet) ---------- */
  function showWelcome() {
    Util.$("progressTitle").textContent = "No round loaded";
    Util.$("progressSub").textContent = "Import your delivery list to start";
    Util.$("cards").innerHTML = `
      <article class="card is-next" style="flex-basis:min(92vw,440px)">
        <div class="card-head"><div class="card-title">
          <div class="addr">Import your list</div>
          <div class="who">The PDF from the email works directly (or Excel / CSV). It stays on this phone.</div></div></div>
        <div class="card-foot"><button class="btn primary grow" id="welcomeImport">Import list</button><button class="btn" id="welcomeSample">Sample</button></div>
      </article>`;
    Util.$("welcomeImport").onclick = () => Util.$("csvInput").click();
    Util.$("welcomeSample").onclick = downloadSample;
  }

  function openWelcomeSheet() {
    const html = `
      <div class="settings"><h2>Get started</h2>
        <div class="list">
          <button class="row" data-act="import"><span class="r-label">Import a list<small>PDF, Excel (.xlsx, .xls, .ods) or CSV. Addresses need internet once.</small></span><span class="r-value">›</span></button>
          <button class="row" data-act="sample"><span class="r-label">Download sample CSV<small>Shows the expected columns</small></span><span class="r-value">↓</span></button>
        </div>
        <p class="foot-note">Your list, ticks and address cache are stored only on this phone.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Get started" });
    body.querySelector("[data-act=import]").onclick = () => { Sheet.close(); Util.$("csvInput").click(); };
    body.querySelector("[data-act=sample]").onclick = downloadSample;
  }

  /* ---------- loading rounds ---------- */
  async function adoptRound(round, { optimise }) {
    applyPinnedPositions(round.stops);
    if (optimise) {
      try {
        const travel = await fetchTravel(round.start, round.stops);
        Busy.show("Optimising route…");
        await Optimizer.optimise(round, 2500, travel && travel.table);
      } finally {
        Busy.hide();
      }
    }
    Busy.hide(); // always: an import ends here whether or not it optimised
    if (Arrival.activeId) closeArrival();
    Nav.resetLive();
    state.round = round;
    state.progress = { done: {}, history: [], partial: {}, ...Store.loadProgress(round.id) };
    rebuildOrder();
    persist();
    state.selectedId = null;
    renderAll();
    if (!freshMe()) MapView.fit([round.start, ...upcomingStops().slice(0, 6)], { animate: false });
    const next = nextStop();
    if (next) Cards.scrollTo(next.id, false);
  }

  async function loadBuiltin() {
    const stops = BUILTIN_ROUND.stops.map((s, i) => ({ ...s, listIndex: i }));
    const round = Round.create({ name: BUILTIN_ROUND.name, source: "builtin", start: BUILTIN_ROUND.start || DEFAULT_START, stops });
    await adoptRound(round, { optimise: Boolean(state.settings.optimiseOrder) });
  }

  /** Step 1: read the file and show what was understood before building anything. */
  async function importFile(file) {
    Busy.show(/\.pdf$/i.test(file.name) ? "Reading PDF…" : "Reading list…");
    let parsed;
    try {
      parsed = await Importer.importFile(file);
    } catch (err) {
      Busy.hide();
      const offline = /load|fetch|network/i.test(err.message) ? " Excel and PDF reading need internet the first time." : "";
      Toast.show(`Couldn't read ${file.name}: ${err.message}.${offline}`, "", null, 10000);
      console.error(err);
      return;
    }
    Busy.hide();
    openImportReview(file, parsed);
  }

  function openImportReview(file, parsed) {
    const examples = parsed.stops.slice(0, 3).map((s) =>
      `<div class="row"><span class="r-label">${Util.escapeHtml(`${s.number} ${Util.streetCase(s.street)}`)}<small>${Util.escapeHtml(s.city)} · ${s.clients.map((c) => Util.escapeHtml(c.name)).join(", ")}</small></span></div>`).join("");
    const columns = parsed.columns.map((c) =>
      `<div class="row"><span class="r-label">${c.field}</span><span class="r-value">${Util.escapeHtml(c.from)}</span></div>`).join("");
    const cityRow = parsed.columns.some((c) => c.field === "City") ? "" :
      "<div class=\"row\"><span class=\"r-label\">City</span><span class=\"r-value\">Besançon (default)</span></div>";
    const html = `
      <div class="settings"><h2>Check the import</h2>
        <p class="foot-note" style="margin:4px 0 12px">${Util.escapeHtml(file.name)} · ${parsed.kind}${parsed.source ? ` (${Util.escapeHtml(parsed.source)})` : ""}</p>
        <div class="list">
          <div class="row"><span class="r-label">${parsed.rowCount} clients at ${parsed.stops.length} addresses${parsed.problems.length ? `<small>${parsed.problems.length} row${parsed.problems.length > 1 ? "s" : ""} skipped (no address)</small>` : ""}</span></div>
        </div>
        <div class="sh-actions"><button class="btn primary" data-act="go">Build route</button><button class="btn" data-act="cancel">Cancel</button></div>
        <div class="group-label">Columns found</div>
        <div class="list">${columns}${cityRow}</div>
        <div class="group-label">First addresses</div>
        <div class="list">${examples}</div>
        ${parsed.problems.length ? `<p class="foot-note">${parsed.problems.slice(0, 4).map(Util.escapeHtml).join("<br>")}</p>` : ""}
        <p class="foot-note">Addresses not seen before are looked up online (IGN), then remembered on this phone.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Check the import" });
    body.querySelector("[data-act=go]").onclick = () => { Sheet.close(); buildFromImport(file, parsed); };
    body.querySelector("[data-act=cancel]").onclick = Sheet.close;
  }

  /** Step 2: locate addresses, optimise, switch to the new round. */
  async function buildFromImport(file, parsed) {
    try {
      applyPinnedPositions(parsed.stops);
      const missing = parsed.stops.filter((s) => !Number.isFinite(s.lat)).length;
      if (missing) {
        Busy.show(`Finding ${missing} addresses…`, 0);
        const result = await Geocoder.locateAll(parsed.stops, (done, total) =>
          Busy.show(`Finding addresses… ${done}/${total}`, done / total));
        if (result.failed.length) {
          const fallback = state.round ? state.round.start : DEFAULT_START;
          result.failed.forEach((s, i) => {
            s.lat = fallback.lat + 0.0003 * (i + 1); s.lon = fallback.lon; s.approx = true;
            s.clients.forEach((c) => { c.notes = `${c.notes ? c.notes + " · " : ""}ADDRESS NOT FOUND`; });
          });
        }
      }
      const name = file.name.replace(/\.[^.]+$/, "");
      const start = state.round ? state.round.start : DEFAULT_START;
      const round = Round.create({ name, source: "import", start, stops: parsed.stops });
      await adoptRound(round, { optimise: Boolean(state.settings.optimiseOrder) });
      const approx = round.stops.filter((s) => s.approx).length;
      const notFound = round.stops.filter((s) => s.clients.some((c) => /ADDRESS NOT FOUND/.test(c.notes))).length;
      const detail = [notFound ? `${notFound} not found` : "", approx ? `${approx} approximate` : ""].filter(Boolean).join(", ");
      Toast.show(`${round.stops.length} stops ready${detail ? ` · ${detail}` : ""}`, "", null, 7000);
    } catch (err) {
      Busy.hide();
      const offline = err instanceof TypeError ? " Are you online? Address lookup needs internet the first time." : "";
      Toast.show(`Import failed: ${err.message}.${offline}`, "", null, 9000);
      console.error(err);
    }
  }



  /* ---------- location ---------- */
  function handleLocation(position) {
    const first = !state.me || state.me.stale;
    state.me = position;
    MapView.setFix(position);
    if (!state.round) return;
    Cards.updateDirections(position, state.byId);
    if (first && !position.stale) {
      Util.$("recenter").hidden = MapView.following;
      if (!Sheet.isOpen) setFollow(true);
      refreshNav(true);
    } else refreshNav();
    const live = Nav.live;
    if (live) MapView.setLiveLeg(Nav.remainingCoords(freshMe()), live.source === "bike");
    checkArrival();
    renderProgressSoon();
  }

  function handleLocationStatus(status) {
    const banner = Util.$("gpsBanner");
    if (status.ok) { banner.hidden = true; return; }
    banner.hidden = false;
    banner.classList.toggle("error", status.code === 1 || !window.isSecureContext);
    Util.$("gpsBannerText").textContent = status.message;
  }

  /* ---------- boot ---------- */
  function wireControls() {
    Util.$("btnSettings").onclick = openSettings;
    Util.$("btnList").onclick = () => openStopList();
    Util.$("btnLayers").onclick = openLayers;
    Util.$("btnLocate").onclick = () => {
      LiveLocation.enableCompassFromGesture();
      if (!freshMe()) { Toast.show("Waiting for GPS…"); return; }
      setFollow(!MapView.following);
    };
    Util.$("recenter").onclick = () => { if (freshMe()) setFollow(true); };
    Util.$("btnOverview").onclick = () => {
      if (!state.round) return;
      state.overview = !state.overview;
      Util.$("btnOverview").classList.toggle("on", state.overview);
      if (state.overview) MapView.fit([state.round.start, ...upcomingStops(), freshMe()].filter(Boolean), { maxZoom: 17 });
      else if (freshMe()) setFollow(true);
      else { const next = nextStop(); if (next) MapView.focus(next, { zoom: 18 }); }
    };
    Util.$("csvInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (file) importFile(file);
    });
    // iPhone only allows compass, wake lock and speech after a tap: unlock them on the first one.
    document.addEventListener("click", () => {
      LiveLocation.enableCompassFromGesture();
      LiveLocation.keepScreenOn();
      if (state.settings.voice) Voice.prime();
    }, { once: true, capture: true });
    MapView.on("stopTap", (id) => {
      if (state.pickingPinFor) return;
      openArrival(id, { auto: false });
    });
    MapView.on("followChange", onFollowChange);
    MapView.on("longPress", askStartHere);
    MapView.map.on("click", (e) => { if (state.pickingPinFor) applyPinPick(e.latlng); });
    MapView.setSnapper((lat, lon, acc) => Nav.snap(lat, lon, acc));
    Nav.on("live", () => {
      const live = Nav.live;
      MapView.setLiveLeg(live && Nav.remainingCoords(freshMe()), live && live.source === "bike");
      renderNav();
      renderProgressSoon();
    });
    Nav.on("whole", drawWhole);
    Arrival.init(Util.$("arrival"), {
      tick: toggleTick,
      done: (id) => markDone(id),
      undo: (id) => undoDone(id),
      later: postpone,
      details: openStop,
      dismissed: () => closeArrival(),
      switchTo: (id) => openArrival(id, { auto: false }),
    });
    window.addEventListener("online", () => { Nav.resetLive(); refreshNav(true); });
  }

  async function boot() {
    Sheet.init();
    Router.setEnabled(state.settings.directions);
    Router.setProfile(state.settings.profile);
    const saved = Store.loadRound();
    const start = saved ? saved.start : ((BUILTIN_ROUND && BUILTIN_ROUND.start) || DEFAULT_START);
    MapView.init(Util.$("map"), start);
    MapView.setStyle(state.settings.mapStyle);
    MapView.setHeadingUp(state.settings.headingUp);
    Cards.init(Util.$("cards"), {
      select: (id) => selectStop(id, { fly: true, fromCards: true }),
      open: (id) => openArrival(id, { auto: false }),
      done: markDone,
      undo: undoDone,
    });
    if (BUILTIN_ROUND) Geocoder.seed(BUILTIN_ROUND.stops);
    wireControls();
    Offline.register();
    if (saved && saved.stops && saved.stops.length) {
      saved.stops = saved.stops.map((s) => (s.flags && "nothingToDeliver" in s.flags ? s : Round.prepareStop(s)));
      await adoptRound(saved, { optimise: false });
      if (saved.optimised && !state.settings.optimiseOrder) useListOrder({ quiet: true });
    } else if (BUILTIN_ROUND) await loadBuiltin();
    else showWelcome();
    LiveLocation.start({ update: handleLocation, status: handleLocationStatus, compass: (h) => MapView.setCompass(h) });
  }

  return { boot, state, markDone, undoDone, openStop, importFile, openArrival, openStopList };
})();

document.addEventListener("DOMContentLoaded", () => {
  App.boot().catch((err) => {
    console.error(err);
    Toast.show(`Start-up error: ${err.message}`, "", null, 15000);
  });
});
</script>
</body>
</html>
