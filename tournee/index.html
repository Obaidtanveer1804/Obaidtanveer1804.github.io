    let best = { i: 0, t: 0, d: Infinity };
    for (let i = 1; i < coords.length; i++) {
      const ax = (coords[i - 1][1] - me.lon) * k, ay = (coords[i - 1][0] - me.lat) * 110540;
      const bx = (coords[i][1] - me.lon) * k, by = (coords[i][0] - me.lat) * 110540;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
      const d = Math.hypot(ax + t * dx, ay + t * dy);
      if (d < best.d) best = { i, t, d };
    }
    if (best.d > 40) return coords;
    const a = coords[best.i - 1], b = coords[best.i];
    const cut = [a[0] + (b[0] - a[0]) * best.t, a[1] + (b[1] - a[1]) * best.t];
    return [cut, ...coords.slice(best.i)];
  }

  /** Where to draw me: snapped onto the live leg when close to it (like car navigation), else null. */
  function snap(lat, lon, accuracy) {
    if (!liveLeg || liveLeg.source !== "bike") return null;
    const pos = project(liveLeg.leg.coords, lat, lon);
    const limit = Math.max(12, Math.min(accuracy || 15, 25));
    return pos.offset <= limit ? pos : null;
  }

  /** Short instruction for a manoeuvre, e.g. { icon: "left", text: "Turn left", street: "Rue de Dole" }. */
  function describe(step) {
    if (!step) return null;
    const m = step.modifier || "";
    const side = m.includes("left") ? "left" : (m.includes("right") ? "right" : "");
    if (step.type === "arrive") return { icon: "arrive", text: "Arrive", street: "" };
    if (step.type === "roundabout" || step.type === "rotary") {
      return { icon: "roundabout", text: step.exit ? `Roundabout, exit ${step.exit}` : "Take the roundabout", street: step.name };
    }
    if (m === "uturn") return { icon: "uturn", text: "U-turn", street: step.name };
    if (!side || m === "straight") return { icon: "straight", text: "Continue", street: step.name };
    const word = m.startsWith("sharp") ? "Sharp" : (m.startsWith("slight") ? "Bear" : "Turn");
    const icon = m.startsWith("slight") ? `slight-${side}` : (m.startsWith("sharp") ? `sharp-${side}` : side);
    return { icon, text: `${word} ${side}`, street: step.name };
  }

  function clearCache() { legs = new Map(); try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ } }

  return {
    legsFor, ensureWhole, updateLive, progress, snap, describe, project, clearCache, remainingCoords,
    on(name, fn) { listeners[name] = fn; },
    get live() { return liveLeg; },
    resetLive() { liveLeg = null; livePending = null; },
  };
})();


/* map.js — Leaflet map with rotation (leaflet-rotate): base layers, stop pins, the whole route, the live leg,
   my position marker, and the navigation camera.
   The tracker runs every animation frame: it predicts my position between GPS fixes, snaps it to the live leg,
   smooths position and heading, and (in follow mode) moves and turns the map so the road ahead is visible. */
"use strict";

const MapView = (() => {
  const IGN_WMTS = "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM" +
    "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&STYLE=normal";
  const IGN_ATTRIB = "© <a href=\"https://geoservices.ign.fr\" target=\"_blank\" rel=\"noopener\">IGN</a>";
  const CARTO_ATTRIB = "© <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OSM</a> © CARTO";
  const MAX_ZOOM = 21;
  const POS_SMOOTH_S = 0.22;         // time constant for position easing
  const HEADING_SMOOTH_S = 0.35;     // time constant for heading easing
  const MAX_PREDICT_S = 1.5;         // how far ahead of the last fix we extrapolate
  const CAMERA_INTERVAL_MS = 33;     // ~30 fps camera, marker runs at full frame rate
  const ME_SCREEN_Y = 0.78;          // where I sit in the visible area (0 = top, 1 = bottom)

  let map;
  let baseLayers = {};
  let activeLayers = [];
  let pinLayer, wholeLayer, liveLayer, startMarker;
  let callbacks = { stopTap: () => {}, followChange: () => {}, longPress: () => {} };

  // tracker state
  let fix = null;
  let compass = NaN;
  let display = null;
  let heading = NaN;
  let meMarker = null, meEl = null;
  let snapper = () => null;
  let follow = false;
  let headingUp = true;
  let followZoom = 18.25;
  let touching = 0;
  let lastFrame = 0, lastCamera = 0;
  let programmatic = false;

  /* ------------------------------------------------------------------ setup */

  function makeLayers() {
    const common = { maxZoom: MAX_ZOOM, crossOrigin: true, detectRetina: false, keepBuffer: 6, updateWhenIdle: false, updateWhenZooming: false };
    const satellite = L.tileLayer(`${IGN_WMTS}&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&FORMAT=image/jpeg`,
      { ...common, maxNativeZoom: 19, attribution: IGN_ATTRIB });
    const plan = L.tileLayer(`${IGN_WMTS}&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&FORMAT=image/png`,
      { ...common, maxNativeZoom: 19, attribution: IGN_ATTRIB });
    const labels = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
      { ...common, maxNativeZoom: 20, subdomains: "abcd", attribution: CARTO_ATTRIB, pane: "labels" });
    return { satellite: [satellite], hybrid: [satellite, labels], plan: [plan] };
  }

  function init(element, start) {
    map = L.map(element, {
      zoomControl: false, attributionControl: true, maxZoom: MAX_ZOOM, minZoom: 12,
      zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, inertia: true, bounceAtZoomLimits: false,
      rotate: true, bearing: 0, touchRotate: false, rotateControl: false, shiftKeyRotate: false, compassBearing: false,
    }).setView([start.lat, start.lon], 17);
    map.attributionControl.setPrefix(false);
    map.attributionControl.setPosition("bottomleft");
    const zoomClass = () => element.classList.toggle("z-near", map.getZoom() >= 16.6);
    map.on("zoomend", zoomClass);
    zoomClass();
    // leaflet-rotate: tiles and lines live in the rotating pane, markers in the upright one.
    const rotating = map._rotatePane || map.getPane("mapPane");
    const upright = map._norotatePane || map.getPane("mapPane");
    map.createPane("labels", rotating).style.zIndex = 450;
    map.getPane("labels").style.pointerEvents = "none";
    map.createPane("route", rotating).style.zIndex = 460;
    map.getPane("route").style.pointerEvents = "none";
    map.createPane("pins", upright).style.zIndex = 620;
    map.createPane("me", upright).style.zIndex = 640;
    baseLayers = makeLayers();
    wholeLayer = L.layerGroup().addTo(map);
    liveLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);

    map.on("dragstart", () => { if (follow) setFollow(false, true); });
    map.on("contextmenu", (e) => callbacks.longPress(e.latlng));
    map.on("zoomend", () => { if (follow && !programmatic) followZoom = map.getZoom(); });
    element.addEventListener("touchstart", (e) => { touching = e.touches.length; }, { passive: true });
    element.addEventListener("touchend", (e) => { touching = e.touches.length; }, { passive: true });
    element.addEventListener("touchcancel", () => { touching = 0; }, { passive: true });
    requestAnimationFrame(frame);
    return map;
  }

  function on(name, fn) { callbacks[name] = fn; }

  function setStyle(style) {
    for (const layer of activeLayers) map.removeLayer(layer);
    activeLayers = baseLayers[style] || baseLayers.hybrid;
    for (const layer of activeLayers) layer.addTo(map);
  }

  /** URL templates of the tile layers used by a style (for the offline downloader). */
  function layerTemplates(style) {
    return (baseLayers[style] || baseLayers.hybrid).map((layer) => ({
      url: layer._url, subdomains: layer.options.subdomains ? [...layer.options.subdomains] : [], maxNativeZoom: layer.options.maxNativeZoom || 19,
    }));
  }

  /** Pixels hidden by floating UI, used to keep targets in the visible part of the map. */
  function insets() {
    const panel = document.getElementById("arrival");
    const cards = document.getElementById("cards");
    const covering = panel && !panel.hidden ? panel : cards;
    const bottom = covering && !covering.hidden ? covering.getBoundingClientRect().height + 20 : 30;
    const banner = document.getElementById("navBanner");
    const top = banner && !banner.hidden ? banner.getBoundingClientRect().bottom + 10 : 84;
    return { top, bottom, left: 18, right: 72 };
  }

  /* ------------------------------------------------------------------- pins */

  function pinIcon(label, classes) {
    return L.divIcon({ className: `pin ${classes}`, html: `<div class="pin-body">${Util.escapeHtml(label)}</div>`, iconSize: [0, 0] });
  }

  /**
   * Draw every stop. state: { ordered, doneIds:Set, targetId, selectedId, skipIds:Set, start }
   * The current stop is large; upcoming stops are numbered (dots when zoomed out); delivered ones are small ticks.
   */
  function renderPins(state) {
    pinLayer.clearLayers();
    for (const stop of state.ordered) {
      let role, label = String(stop.seq);
      if (state.doneIds.has(stop.id)) { role = "done dot"; label = "✓"; }
      else if (state.skipIds.has(stop.id)) { role = "skip dot"; label = "–"; }
      else if (stop.id === state.targetId) role = "next";
      else role = "up dot";
      const classes = [role];
      if (stop.id === state.selectedId && role !== "next") classes.push("selected");
      if (!role.includes("done") && (stop.flags.early || stop.flags.must)) classes.push("alert");
      const marker = L.marker([stop.lat, stop.lon], {
        pane: "pins", icon: pinIcon(label, classes.join(" ")), keyboard: false,
        zIndexOffset: role === "next" ? 2000 : (stop.id === state.selectedId ? 1500 : (role.includes("done") ? -2000 : -stop.seq)),
      });
      marker.on("click", () => callbacks.stopTap(stop.id));
      marker.addTo(pinLayer);
    }
    if (startMarker) startMarker.remove();
    startMarker = L.marker([state.start.lat, state.start.lon], { pane: "pins", icon: pinIcon("Start", "start"), zIndexOffset: -1900, keyboard: false }).addTo(map);
  }

  /* ------------------------------------------------------------------ route */

  /** The rest of the round: one faint line, dashed where a leg is not downloaded yet. */
  function setWholeRoute(segments) {
    wholeLayer.clearLayers();
    const real = segments.filter((s) => s.real).map((s) => s.coords);
    const missing = segments.filter((s) => !s.real).map((s) => s.coords);
    if (real.length) {
      L.polyline(real, { pane: "route", color: "#ffffff", weight: 7, opacity: 0.55, lineJoin: "round", lineCap: "round", interactive: false }).addTo(wholeLayer);
      L.polyline(real, { pane: "route", color: "#5aa4ff", weight: 4, opacity: 0.9, lineJoin: "round", lineCap: "round", interactive: false }).addTo(wholeLayer);
    }
    if (missing.length) {
      L.polyline(missing, { pane: "route", color: "#5aa4ff", weight: 3, opacity: 0.8, dashArray: "2 8", lineCap: "round", interactive: false }).addTo(wholeLayer);
    }
  }

  /** Small arrowheads along a line, drawn as map geometry so they turn with the map. */
  function chevrons(coords, every = 45) {
    const out = [];
    let walked = 0, nextMark = every * 0.6;
    for (let i = 1; i < coords.length; i++) {
      const [la1, lo1] = coords[i - 1], [la2, lo2] = coords[i];
      const seg = Util.distanceM(la1, lo1, la2, lo2);
      while (seg > 0 && walked + seg >= nextMark) {
        const t = (nextMark - walked) / seg;
        const tip = { lat: la1 + t * (la2 - la1), lon: lo1 + t * (lo2 - lo1) };
        const b = Util.bearingDeg(la1, lo1, la2, lo2);
        const left = Util.destination(tip, b + 150, 3.2), right = Util.destination(tip, b - 150, 3.2);
        out.push([[left.lat, left.lon], [tip.lat, tip.lon], [right.lat, right.lon]]);
        nextMark += every;
      }
      walked += seg;
    }
    return out;
  }

  /** The leg I'm riding now: bold blue (dashed when it is only a straight-line guess). */
  function setLiveLeg(coords, real) {
    liveLayer.clearLayers();
    if (!coords || coords.length < 2) return;
    if (real) {
      L.polyline(coords, { pane: "route", color: "#ffffff", weight: 12, opacity: 0.95, lineJoin: "round", lineCap: "round", interactive: false }).addTo(liveLayer);
      L.polyline(coords, { pane: "route", color: "#1a73e8", weight: 8, opacity: 1, lineJoin: "round", lineCap: "round", interactive: false }).addTo(liveLayer);
      L.polyline(chevrons(coords), { pane: "route", color: "#ffffff", weight: 2.6, opacity: 0.95, lineJoin: "round", lineCap: "round", interactive: false }).addTo(liveLayer);
    } else {
      L.polyline(coords, { pane: "route", color: "#1a73e8", weight: 6, opacity: 0.9, dashArray: "1 12", lineCap: "round", interactive: false }).addTo(liveLayer);
    }
  }

  /* ---------------------------------------------------------------- tracker */

  function ensureMeMarker(latlng) {
    if (meMarker) return;
    const icon = L.divIcon({
      className: "me", iconSize: [0, 0],
      html: "<div class=\"me-acc\"></div><div class=\"me-halo\"></div><div class=\"me-arrow\"><svg viewBox=\"0 0 40 40\"><path d=\"M20 4 33 34 20 27 7 34Z\"/></svg></div><div class=\"me-dot\"></div>",
    });
    meMarker = L.marker(latlng, { pane: "me", icon, interactive: false, keyboard: false }).addTo(map);
    meEl = meMarker.getElement();
  }

  /** Geographic direction that points to the top of the screen (leaflet-rotate turns the map by -bearing). */
  function screenUp() { return map.getBearing ? (360 - map.getBearing()) % 360 : 0; }

  function metersPerPixel(lat, zoom = map.getZoom()) {
    return 40075016.686 * Math.abs(Math.cos(lat * Math.PI / 180)) / Math.pow(2, zoom + 8);
  }

  /** New GPS fix from LiveLocation. */
  function setFix(newFix) {
    fix = newFix ? { ...newFix } : null;
    if (!fix) return;
    ensureMeMarker([fix.lat, fix.lon]);
    if (meEl) meEl.classList.toggle("stale", Boolean(fix.stale));
  }

  function setCompass(value) { compass = value; }
  function setSnapper(fn) { snapper = fn; }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!fix || !meMarker || !map) { lastFrame = now; return; }
    const dt = Math.min(0.12, Math.max(0.001, (now - lastFrame) / 1000));
    lastFrame = now;

    // 1. Predict where I am now from the last fix, speed and course.
    const moving = fix.speed > 1.2 && !fix.stale;
    const snapNow = moving ? snapper(fix.lat, fix.lon, fix.accuracy) : null;
    const course = snapNow && Number.isFinite(snapNow.bearing) ? snapNow.bearing : fix.course;
    let target = { lat: fix.lat, lon: fix.lon };
    if (moving && Number.isFinite(course)) {
      const age = Math.min(MAX_PREDICT_S, Math.max(0, (Date.now() - fix.ts) / 1000));
      target = Util.destination(target, course, fix.speed * age);
    }
    // 2. Stick to the road while I'm on the route.
    const snapped = moving ? snapper(target.lat, target.lon, fix.accuracy) : null;
    if (snapped) target = { lat: snapped.lat, lon: snapped.lon };

    // 3. Ease towards it (no jumps), unless the gap is huge (first fix, tunnel exit…).
    if (!display || Util.distanceM(display.lat, display.lon, target.lat, target.lon) > 120) display = { ...target };
    else {
      const a = 1 - Math.exp(-dt / POS_SMOOTH_S);
      display.lat += (target.lat - display.lat) * a;
      display.lon += (target.lon - display.lon) * a;
    }
    meMarker.setLatLng([display.lat, display.lon]);

    // 4. Heading: road direction when snapped, GPS course when moving, compass when stopped.
    const wanted = moving ? (snapped && Number.isFinite(snapped.bearing) ? snapped.bearing : course) : compass;
    if (Number.isFinite(wanted)) {
      heading = Number.isFinite(heading) ? (heading + Util.angleDiff(heading, wanted) * (1 - Math.exp(-dt / HEADING_SMOOTH_S)) + 360) % 360 : wanted;
    }
    const up = screenUp();
    if (meEl) {
      const arrow = meEl.querySelector(".me-arrow");
      if (Number.isFinite(heading)) { arrow.style.transform = `translate(-50%, -50%) rotate(${heading - up}deg)`; meEl.classList.add("has-heading"); }
      const accPx = Math.min((fix.accuracy || 0) / metersPerPixel(display.lat), 200);
      const acc = meEl.querySelector(".me-acc");
      acc.style.width = acc.style.height = `${Math.max(0, accPx * 2)}px`;
      acc.style.opacity = accPx > 18 ? "1" : "0";
    }

    // 5. Camera.
    if (follow && !touching && now - lastCamera >= CAMERA_INTERVAL_MS) {
      lastCamera = now;
      moveCamera();
    }
  }

  function moveCamera() {
    programmatic = true;
    const wantUp = headingUp && Number.isFinite(heading) ? heading : 0;
    if (map.setBearing && Math.abs(Util.angleDiff(screenUp(), wantUp)) > 0.4) map.setBearing((360 - wantUp) % 360);
    const pad = insets();
    const h = map.getSize().y;
    // Put me low in the visible part of the screen (between the top bar and whatever covers the bottom),
    // so more of the road ahead is visible. "Ahead" is screen-up.
    const meY = pad.top + ME_SCREEN_Y * Math.max(80, h - pad.bottom - pad.top);
    const aheadPx = meY - h / 2;
    const center = Util.destination(display, screenUp(), aheadPx * metersPerPixel(display.lat, followZoom));
    map.setView([center.lat, center.lon], followZoom, { animate: false });
    programmatic = false;
  }

  function setFollow(on, byUser = false) {
    if (follow === on) return;
    follow = on;
    if (on) {
      if (map.getZoom() < 17) followZoom = 18.25;
      lastCamera = 0;
    }
    callbacks.followChange(on, byUser);
  }

  function setHeadingUp(on) {
    headingUp = on;
    if (!on && map.setBearing) map.setBearing(0);
  }

  /* ----------------------------------------------------------------- camera helpers */

  function northUp() { if (map.getBearing && map.getBearing() !== 0) map.setBearing(0); }

  /** Point that places `latlng` in the middle of the visible (un-covered) area at `zoom` (north-up). */
  function visibleCenterFor(latlng, zoom) {
    const pad = insets();
    const offset = L.point((pad.left - pad.right) / 2, (pad.top - pad.bottom) / 2);
    return map.unproject(map.project(latlng, zoom).subtract(offset), zoom);
  }

  function focus(point, { zoom, animate = true } = {}) {
    setFollow(false, true);
    northUp();
    const targetZoom = zoom ?? Math.max(map.getZoom(), 17.5);
    const center = visibleCenterFor(L.latLng(point.lat, point.lon), targetZoom);
    if (animate) map.flyTo(center, targetZoom, { duration: 0.55, easeLinearity: 0.3 });
    else map.setView(center, targetZoom, { animate: false });
  }

  function fit(points, { maxZoom = 18.5, animate = true } = {}) {
    const valid = points.filter((p) => p && Number.isFinite(p.lat));
    if (!valid.length) return;
    setFollow(false, true);
    northUp();
    if (valid.length === 1) { focus(valid[0], { zoom: Math.min(maxZoom, 18), animate }); return; }
    const pad = insets();
    map.flyToBounds(L.latLngBounds(valid.map((p) => [p.lat, p.lon])), {
      paddingTopLeft: [pad.left + 30, pad.top + 20], paddingBottomRight: [pad.right + 20, pad.bottom + 20],
      maxZoom, duration: animate ? 0.6 : 0.01,
    });
  }

  return {
    init, on, setStyle, layerTemplates, renderPins, setWholeRoute, setLiveLeg,
    setFix, setCompass, setSnapper, setFollow, setHeadingUp, focus, fit,
    get map() { return map; }, get following() { return follow; }, get screenUp() { return screenUp(); }, get displayed() { return display; }, get heading() { return heading; },
  };
})();


/* location.js — GPS fixes and compass heading, plus screen wake lock.
   This module only reports what the sensors say; smoothing, prediction between fixes and snapping to the
   route happen in the map's tracker (map.js), which runs every animation frame. */
"use strict";

const LiveLocation = (() => {
  const MOVING_MS = 1.4;           // ~5 km/h: above this the GPS course is trustworthy
  const STALE_AFTER_MS = 20000;

  const state = { lat: NaN, lon: NaN, accuracy: Infinity, speed: 0, course: NaN, compass: NaN, ts: 0, stale: true, hasFix: false };
  let lastFix = null;
  let onUpdate = () => {};
  let onStatus = () => {};
  let onCompass = () => {};
  let watchId = null;
  let wakeLock = null;
  let compassOn = false;

  function screenAngle() {
    const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    return Number(angle) || 0;
  }

  function handlePosition(pos) {
    const c = pos.coords;
    const fix = { lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, ts: pos.timestamp || Date.now() };
    let speed = Number.isFinite(c.speed) && c.speed !== null && c.speed >= 0 ? c.speed : NaN;
    let course = Number.isFinite(c.heading) && c.heading !== null ? c.heading : NaN;
    if (lastFix) {
      const dt = (fix.ts - lastFix.ts) / 1000;
      const moved = Util.distanceM(lastFix.lat, lastFix.lon, fix.lat, fix.lon);
      if (!Number.isFinite(speed) && dt > 0.3) speed = moved / dt;
      if (!Number.isFinite(course) && moved > 4 && moved > fix.accuracy * 0.5) course = Util.bearingDeg(lastFix.lat, lastFix.lon, fix.lat, fix.lon);
    }
    if (!Number.isFinite(speed)) speed = 0;
    Object.assign(state, fix, { speed, course: speed >= MOVING_MS ? course : NaN, stale: false, hasFix: true });
    lastFix = fix;
    onStatus({ ok: true, accuracy: fix.accuracy });
    onUpdate({ ...state });
  }

  function handleError(err) {
    const messages = {
      1: "Location blocked: allow it for this site (iPhone: Settings › Privacy › Location › Safari Websites)",
      2: "No GPS signal yet",
      3: "GPS is slow to respond…",
    };
    onStatus({ ok: false, code: err.code, message: messages[err.code] || "Location unavailable" });
  }

  function handleOrientation(event) {
    let heading = NaN;
    if (typeof event.webkitCompassHeading === "number") heading = event.webkitCompassHeading;
    else if (event.absolute && typeof event.alpha === "number") heading = 360 - event.alpha;
    if (!Number.isFinite(heading)) return;
    state.compass = (heading + screenAngle() + 360) % 360;
    onCompass(state.compass);
  }

  function startCompass() {
    if (compassOn) return;
    compassOn = true;
    if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", handleOrientation, true);
    else window.addEventListener("deviceorientation", handleOrientation, true);
  }

  /** iPhone needs an explicit permission request from a tap; Android just works. */
  async function enableCompassFromGesture() {
    const Orientation = window.DeviceOrientationEvent;
    if (Orientation && typeof Orientation.requestPermission === "function") {
      try {
        if ((await Orientation.requestPermission()) === "granted") { compassOn = false; startCompass(); }
      } catch (err) { /* declined or not from a gesture */ }
    }
  }

  function start(handlers) {
    onUpdate = handlers.update;
    onStatus = handlers.status;
    onCompass = handlers.compass || (() => {});
    if (!("geolocation" in navigator)) { onStatus({ ok: false, message: "This browser has no location support" }); return; }
    if (!window.isSecureContext) onStatus({ ok: false, message: "GPS needs https:// (open the github.io link)" });
    watchId = navigator.geolocation.watchPosition(handlePosition, handleError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    startCompass();
    setInterval(() => {
      if (state.hasFix && !state.stale && Date.now() - state.ts > STALE_AFTER_MS) { state.stale = true; onUpdate({ ...state }); }
    }, 5000);
  }

  async function keepScreenOn() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (err) { /* battery saver or unsupported */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepScreenOn(); });

  return { start, enableCompassFromGesture, keepScreenOn, get current() { return { ...state }; }, get watching() { return watchId !== null; } };
})();


/* cards.js — horizontal, snap-scrolling stop cards. Swiping selects a stop; buttons mark it delivered. */
"use strict";

const Cards = (() => {
  const ICON_ARROW = "<svg viewBox=\"0 0 24 24\"><path d=\"M12 2 20 21 12 16.5 4 21Z\"/></svg>";
  const ICON_CHECK = "<svg viewBox=\"0 0 24 24\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/></svg>";
  const ICON_INFO = "<svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/></svg>";
  const ICON_UNDO = "<svg viewBox=\"0 0 24 24\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>";

  let container;
  let handlers = { select: () => {}, open: () => {}, done: () => {}, undo: () => {} };
  let programmaticScroll = false;
  let selectedId = null;

  function chipsFor(stop) {
    const chips = [];
    if (stop.flags.early) chips.push("<span class=\"chip alert\">Before 7:00</span>");
    if (stop.flags.must) chips.push("<span class=\"chip warnc\">Not received yesterday</span>");
    const counts = Round.paperCounts([stop]);
    for (const p of Round.PAPERS.slice().reverse()) {
      if (!counts[p.key]) continue;
      const label = p.key === "est" ? "L'Est" : p.label.replace("Paris ", "");
      chips.push(`<span class="chip"><i class="p-${p.key}"></i>${label}${counts[p.key] > 1 ? ` ×${counts[p.key]}` : ""}</span>`);
    }
    const code = stop.clients.find((c) => c.code);
    if (code) chips.push(`<span class="chip code">#${Util.escapeHtml(code.code)}</span>`);
    if (stop.flags.suspended) chips.push("<span class=\"chip\">Suspended client</span>");
    if (stop.flags.isNew) chips.push("<span class=\"chip okc\">New</span>");
    return chips.join("");
  }

  function whoLine(stop) {
    const names = stop.clients.map((c) => c.name);
    const shown = names.slice(0, 2).join(", ");
    return names.length > 2 ? `${shown} +${names.length - 2}` : shown;
  }

  function cardHtml(stop, isDone, isNext) {
    const foot = isDone
      ? `<button class="btn success grow" data-act="open">${ICON_CHECK}Delivered</button><button class="btn" data-act="undo" aria-label="Mark not delivered">${ICON_UNDO}</button>`
      : `<button class="btn primary grow" data-act="done">${ICON_CHECK}Delivered</button><button class="btn" data-act="open" aria-label="Details">${ICON_INFO}</button>`;
    return `
      <article class="card${isDone ? " is-done" : ""}${isNext ? " is-next" : ""}" data-id="${stop.id}" tabindex="0">
        <div class="card-head" data-act="open">
          <div class="seq">${stop.seq}</div>
          <div class="card-title">
            <div class="addr">${Util.escapeHtml(Round.stopAddress(stop))}</div>
            <div class="who">${Util.escapeHtml(whoLine(stop))}</div>
          </div>
          <div class="dir"><div class="dir-arrow">${ICON_ARROW}</div><div class="dir-dist">–</div></div>
        </div>
        <div class="card-mid" data-act="open">${chipsFor(stop)}</div>
        <div class="card-foot">${foot}</div>
      </article>`;
  }

  function nearestCardId() {
    const mid = container.scrollLeft + container.clientWidth / 2;
    let best = null, bestDist = Infinity;
    for (const card of container.children) {
      const center = card.offsetLeft + card.offsetWidth / 2;
      const d = Math.abs(center - mid);
      if (d < bestDist) { bestDist = d; best = card.dataset.id; }
    }
    return best;
  }

  function init(element, eventHandlers) {
    container = element;
    handlers = { ...handlers, ...eventHandlers };
    const settle = Util.debounce(() => {
      if (programmaticScroll) { programmaticScroll = false; return; }
      const id = nearestCardId();
      if (id && id !== selectedId) { selectedId = id; Util.haptic(6); handlers.select(id); }
    }, 140);
    container.addEventListener("scroll", settle, { passive: true });
    container.addEventListener("click", (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      const action = event.target.closest("[data-act]")?.dataset.act || "open";
      const id = card.dataset.id;
      if (action === "done") handlers.done(id);
      else if (action === "undo") handlers.undo(id);
      else handlers.open(id);
    });
    container.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.classList.contains("card")) handlers.open(event.target.dataset.id);
    });
  }

  function render(ordered, doneIds, nextId) {
    container.innerHTML = ordered.map((s) => cardHtml(s, doneIds.has(s.id), s.id === nextId)).join("");
  }

  function scrollTo(id, smooth = true) {
    const card = container.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!card) return;
    selectedId = id;
    const left = card.offsetLeft - (container.clientWidth - card.offsetWidth) / 2;
    if (Math.abs(container.scrollLeft - left) < 2) return;
    programmaticScroll = true;
    container.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
  }

  /** Update distance + arrow on the cards near the current one (cheap, runs on every GPS tick). */
  function updateDirections(me, byId) {
    if (!me || !Number.isFinite(me.lat)) return;
    const cards = [...container.children];
    const index = cards.findIndex((c) => c.dataset.id === selectedId);
    const from = Math.max(0, index - 2), to = Math.min(cards.length, index + 4);
    for (const card of cards.slice(from, to)) {
      const stop = byId.get(card.dataset.id);
      if (!stop) continue;
      const meters = Util.distanceM(me.lat, me.lon, stop.lat, stop.lon) * 1.25;
      const bearing = Util.bearingDeg(me.lat, me.lon, stop.lat, stop.lon);
      const heading = MapView.heading;
      const relative = Number.isFinite(heading) ? bearing - heading : bearing;
      card.querySelector(".dir-dist").textContent = Util.formatDistance(meters);
      card.querySelector(".dir-arrow svg").style.transform = `rotate(${relative}deg)`;
    }
  }

  return { init, render, scrollTo, updateDirections, get selectedId() { return selectedId; } };
})();


/* sheets.js — bottom sheet host (open/close, drag-to-dismiss) and the toast. */
"use strict";

const Sheet = (() => {
  let sheet, body, scrim, grabber;
  let onClose = null;
  let dragStartY = null;
  let dragDelta = 0;

  function init() {
    sheet = Util.$("sheet");
    body = Util.$("sheetBody");
    scrim = Util.$("scrim");
    grabber = Util.$("sheetGrabber");
    scrim.addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheet.hidden) close(); });

    const startDrag = (y) => { dragStartY = y; dragDelta = 0; sheet.style.transition = "none"; };
    const moveDrag = (y) => {
      if (dragStartY === null) return;
      dragDelta = Math.max(0, y - dragStartY);
      sheet.style.transform = `translateY(${dragDelta}px)`;
    };
    const endDrag = () => {
      if (dragStartY === null) return;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (dragDelta > 90) close();
      dragStartY = null;
    };
    grabber.addEventListener("pointerdown", (e) => { grabber.setPointerCapture(e.pointerId); startDrag(e.clientY); });
    grabber.addEventListener("pointermove", (e) => moveDrag(e.clientY));
    grabber.addEventListener("pointerup", endDrag);
    grabber.addEventListener("pointercancel", endDrag);
    // Pull down from the top of the scrolled content also dismisses.
    body.addEventListener("touchstart", (e) => { if (body.scrollTop <= 0) startDrag(e.touches[0].clientY); }, { passive: true });
    body.addEventListener("touchmove", (e) => { if (dragStartY !== null && body.scrollTop <= 0) moveDrag(e.touches[0].clientY); }, { passive: true });
    body.addEventListener("touchend", endDrag);
  }

  let closeTimer = 0;

  function open(html, { onClose: closeHandler, label, tall = false } = {}) {
    clearTimeout(closeTimer); // a sheet closed a moment ago must not hide this one
    if (typeof Toast !== "undefined") Toast.hide();
    body.innerHTML = html;
    body.scrollTop = 0;
    onClose = closeHandler || null;
    sheet.setAttribute("aria-label", label || "Details");
    sheet.classList.toggle("tall", tall);
    scrim.hidden = false;
    sheet.hidden = false;
    sheet.classList.remove("closing");
    sheet.classList.add("opening");
    setTimeout(() => sheet.classList.remove("opening"), 320);
    return body;
  }

  function close() {
    if (sheet.hidden) return;
    sheet.classList.add("closing");
    scrim.hidden = true;
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => { sheet.hidden = true; sheet.classList.remove("closing"); body.innerHTML = ""; }, 260);
    const handler = onClose;
    onClose = null;
    if (handler) handler();
  }

  return { init, open, close, get isOpen() { return !sheet.hidden; }, get body() { return body; } };
})();

const Toast = (() => {
  let timer = 0;
  function show(text, actionLabel, action, ms = 4500) {
    const el = Util.$("toast");
    const button = Util.$("toastAction");
    Util.$("toastText").textContent = text;
    button.textContent = actionLabel || "";
    button.onclick = () => { hide(); if (action) action(); };
    el.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(hide, ms);
  }
  function hide() { Util.$("toast").hidden = true; }
  return { show, hide };
})();

const Busy = (() => {
  function show(text, fraction) {
    Util.$("busy").hidden = false;
    Util.$("busyText").textContent = text;
    Util.$("busyBar").parentElement.hidden = fraction === undefined;
    if (fraction !== undefined) Util.$("busyBar").style.width = `${Math.round(fraction * 100)}%`;
  }
  function hide() { Util.$("busy").hidden = true; }
  return { show, hide, get visible() { return !Util.$("busy").hidden; } };
})();


/* arrival.js — automatic "you are here" panel.
   When my position comes within the arrival radius of an upcoming stop, a panel slides up with every client,
   paper, code and note. It stays until I dismiss it, mark the stop, or ride away; the next stop pops on arrival.
   Detection is pure (decide); the panel is plain DOM (show/hide). */
"use strict";

const Arrival = (() => {
  const EXIT_MARGIN_M = 20;          // hysteresis so GPS jitter at the edge doesn't flicker the panel
  const MAX_ACCURACY_BONUS_M = 40;
  const ICON_CHECK = "<svg viewBox=\"0 0 24 24\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/></svg>";
  const ICON_LATER = "<svg viewBox=\"0 0 24 24\"><path d=\"M12 7v5l3 2\"/><circle cx=\"12\" cy=\"12\" r=\"8.5\"/></svg>";
  const ICON_CLOSE = "<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>";
  const ICON_INFO = "<svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/></svg>";

  let el;
  let activeId = null;
  let enteredAt = 0;
  let manual = false;                // opened by hand (no auto-close on leaving)
  const dismissed = new Set();
  let handlers = {};

  function radiusFor(me, settings) {
    return Math.max(settings.arrivalRadius, Math.min((me.accuracy || 0) * 0.7, MAX_ACCURACY_BONUS_M));
  }

  /**
   * Decide what the panel should show for this position.
   * candidates: upcoming (not delivered) stops in route order. Returns { enter, exit } stop ids (or null).
   */
  function decide(me, candidates, settings) {
    if (!me || me.stale || !candidates.length) return { enter: null, exit: null };
    const radius = radiusFor(me, settings);
    const dist = (s) => Util.distanceM(me.lat, me.lon, s.lat, s.lon);
    for (const id of [...dismissed]) {
      const stop = candidates.find((s) => s.id === id);
      if (!stop || dist(stop) > radius + EXIT_MARGIN_M) dismissed.delete(id);
    }
    let exit = null;
    if (activeId && !manual) {
      const active = candidates.find((s) => s.id === activeId);
      if (!active || dist(active) > radius + EXIT_MARGIN_M) exit = activeId;
    }
    if (activeId && !exit && !manual) return { enter: null, exit: null };
    const inside = candidates.slice(0, 25).filter((s) => !dismissed.has(s.id) && dist(s) <= radius);
    if (!inside.length) return { enter: null, exit };
    const next = candidates[0];
    const pick = inside.includes(next) ? next : inside.sort((a, b) => dist(a) - dist(b))[0];
    if (pick.id === activeId) return { enter: null, exit };
    return { enter: pick.id, exit };
  }

  function chip(key, label, count) {
    return `<span class="chip"><i class="p-${key}"></i>${label}${count > 1 ? ` ×${count}` : ""}</span>`;
  }

  function render(stop, ctx) {
    const ticked = new Set(ctx.ticked || []);
    const counts = Round.paperCounts([stop]);
    const paperChips = Round.PAPERS.slice().reverse().filter((p) => counts[p.key])
      .map((p) => chip(p.key, p.key === "est" ? "L'Est" : p.label, counts[p.key])).join("");
    const codes = [...new Set(stop.clients.map((c) => c.code).filter(Boolean))];
    const alerts = [
      stop.flags.early ? "<div class=\"alert-row crit\">⏰ Before 7:00</div>" : "",
      stop.flags.must ? "<div class=\"alert-row warn\">⚠️ Not received yesterday — make sure</div>" : "",
    ].join("");
    const clients = stop.clients.map((c, i) => {
      const on = ticked.has(i);
      const papers = c.papers.map((k) => `<span class="chip sm"><i class="p-${k}"></i>${Round.paperLabel(k)}</span>`).join("");
      const meta = [
        papers,
        c.appt ? `<span class="chip sm">Appt ${Util.escapeHtml(c.appt)}</span>` : "",
        c.code && codes.length > 1 ? `<span class="chip sm code">#${Util.escapeHtml(c.code)}</span>` : "",
        c.flags.suspended ? "<span class=\"chip sm\">Suspended</span>" : "",
        c.flags.isNew ? "<span class=\"chip sm okc\">New</span>" : "",
      ].join("");
      return `
        <li class="arr-client${on ? " on" : ""}${c.flags.suspended ? " susp" : ""}">
          <button class="tick" data-tick="${i}" aria-pressed="${on}" aria-label="Delivered to ${Util.escapeHtml(c.name)}">${ICON_CHECK}</button>
          <div class="arr-client-body">
            <div class="arr-name">${Util.escapeHtml(c.name)}</div>
            <div class="arr-meta">${meta}</div>
            ${c.notes ? `<div class="arr-note">${Util.escapeHtml(c.notes)}</div>` : ""}
          </div>
        </li>`;
    }).join("");
    const nearby = (ctx.nearby || []).map((s) =>
      `<button class="chip nearby" data-switch="${s.id}">${s.seq} · ${Util.escapeHtml(Round.stopAddress(s))}</button>`).join("");
    const deliverable = stop.clients.filter((c) => !c.flags.suspended).length;
    return `
      <div class="arr-grab"><span></span></div>
      <div class="arr-top">
        <span class="arr-badge${ctx.auto ? "" : " manual"}${ctx.isDone ? " done" : ""}"><i></i>${ctx.isDone ? "Delivered" : (ctx.auto ? "You've arrived" : (ctx.isNext ? "Next stop" : "Stop details"))}</span>
        <span class="arr-seq">Stop ${stop.seq} of ${ctx.total}</span>
        <button class="arr-icon" data-act="details" aria-label="Full details">${ICON_INFO}</button>
        <button class="arr-icon" data-act="close" aria-label="Hide">${ICON_CLOSE}</button>
      </div>
      <h2 class="arr-addr">${Util.escapeHtml(Round.stopAddress(stop))}</h2>
      ${ctx.note ? `<div class="arr-mynote">📝 ${Util.escapeHtml(ctx.note)}</div>` : ""}
      <div class="arr-summary">${paperChips}${codes.length === 1 ? `<span class="chip code big">Code ${Util.escapeHtml(codes[0])}</span>` : ""}</div>
      ${alerts ? `<div class="alerts">${alerts}</div>` : ""}
      <ul class="arr-clients">${clients}</ul>
      ${nearby ? `<div class="arr-nearby"><span>Also here:</span>${nearby}</div>` : ""}
      <div class="arr-foot">
        ${ctx.isDone
          ? `<button class="btn grow" data-act="undo">↩︎ Not delivered</button>`
          : `<button class="btn" data-act="later">${ICON_LATER}Later</button>
        <button class="btn success grow" data-act="done">${ICON_CHECK}${deliverable > 1 ? `Delivered (${deliverable})` : "Delivered"}</button>`}
      </div>`;
  }

  function wire() {
    el.onclick = (event) => {
      const tick = event.target.closest("[data-tick]");
      if (tick) { Util.haptic(10); handlers.tick(activeId, Number(tick.dataset.tick)); return; }
      const sw = event.target.closest("[data-switch]");
      if (sw) { handlers.switchTo(sw.dataset.switch); return; }
      const act = event.target.closest("[data-act]")?.dataset.act;
      if (!act) return;
      const id = activeId;
      if (act === "close") { dismiss(); handlers.dismissed(id); }
      else if (act === "done") handlers.done(id);
      else if (act === "later") handlers.later(id);
      else if (act === "details") handlers.details(id);
      else if (act === "undo") handlers.undo(id);
    };
    // Swipe the panel down to hide it.
    let startY = null, delta = 0;
    el.addEventListener("touchstart", (e) => {
      if (!e.target.closest(".arr-grab, .arr-top, .arr-addr") || e.target.closest("button")) return;
      startY = e.touches[0].clientY; delta = 0;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (startY === null) return;
      delta = Math.max(0, e.touches[0].clientY - startY);
      if (delta > 6) { el.style.transition = "none"; el.style.transform = `translateY(${delta}px)`; }
    }, { passive: true });
    el.addEventListener("touchend", () => {
      if (startY === null) return;
      el.style.transition = ""; el.style.transform = "";
      if (delta > 80) { const id = activeId; dismiss(); handlers.dismissed(id); }
      startY = null;
    });
  }

  function init(element, eventHandlers) {
    el = element;
    handlers = eventHandlers;
    wire();
  }

  /** Show (or refresh) the panel for a stop. ctx: { auto, total, ticked:[], nearby:[stops] } */
  function show(stop, ctx) {
    const isNew = activeId !== stop.id || el.hidden;
    activeId = stop.id;
    manual = !ctx.auto;
    if (isNew) enteredAt = Date.now();
    el.innerHTML = render(stop, ctx);
    const wasLeaving = el.classList.contains("leaving");
    el.classList.remove("leaving");
    if (el.hidden || wasLeaving) {
      el.hidden = false;
      el.classList.add("entering");
      setTimeout(() => el.classList.remove("entering"), 380);
    }
  }

  function hide() {
    if (el.hidden) { activeId = null; return; }
    activeId = null;
    el.classList.add("leaving");
    setTimeout(() => { if (!activeId) { el.hidden = true; el.classList.remove("leaving"); } }, 240);
  }

  function dismiss() {
    if (activeId) dismissed.add(activeId);
    hide();
  }

  return {
    init, decide, show, hide, dismiss,
    get activeId() { return activeId; },
    get stayedMs() { return activeId ? Date.now() - enteredAt : 0; },
    get isManual() { return manual; },
    forget(id) { dismissed.delete(id); },
  };
})();

/* Spoken announcements (French voice so street names sound right). */
const Voice = (() => {
  let voice = null;
  function pickVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    voice = voices.find((v) => /^fr(-|_)FR/i.test(v.lang)) || voices.find((v) => /^fr/i.test(v.lang)) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function say(text) {
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      if (voice) u.voice = voice;
      u.rate = 1.05;
      speechSynthesis.speak(u);
    } catch (err) { /* speech unavailable */ }
  }

  /** "Arrêt 12. 26 rue Xavier Marmier. 4 clients. L'Est, 3. Paris Match, 1. Code 1234." */
  function announceStop(stop) {
    const counts = Round.paperCounts([stop]);
    const papers = Round.PAPERS.slice().reverse().filter((p) => counts[p.key]).map((p) => `${p.label}, ${counts[p.key]}`).join(". ");
    const code = stop.clients.find((c) => c.code)?.code;
    const n = stop.clients.length;
    say(`Arrêt ${stop.seq}. ${Round.stopAddress(stop)}. ${n} client${n > 1 ? "s" : ""}. ${papers}.${code ? ` Code ${code.split("").join(" ")}.` : ""}`);
  }

  /** iPhone only speaks after a tap has spoken once: call from a tap handler. */
  function prime() {
    if (!window.speechSynthesis) return;
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (err) { /* ignore */ }
  }

  return { say, announceStop, prime, get supported() { return Boolean(window.speechSynthesis); } };
})();


/* offline.js — service-worker registration and "save map for offline": pre-downloads the map tiles around the
   round so the satellite map still shows with no signal. The service worker (sw.js) stores them. */
"use strict";

const Offline = (() => {
  const MIN_ZOOM = 14;
  const MAX_ZOOM = 19;
  const PAD_M = 200;
  const CONCURRENCY = 6;
  const KB_PER_TILE = { jpeg: 28, png: 9 };

  const supported = "serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:";

  function register() {
    if (!supported) return;
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("Service worker not registered", err));
  }

  function lonToX(lon, z) { return Math.floor(((lon + 180) / 360) * 2 ** z); }
  function latToY(lat, z) {
    const r = lat * Math.PI / 180;
    return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z);
  }

  /** Every tile URL for the round's area at zooms 14..19, using the same URLs the map requests. */
  function planTiles(points, style) {
    const lats = points.map((p) => p.lat), lons = points.map((p) => p.lon);
    const padLat = PAD_M / 110540;
    const padLon = PAD_M / (111320 * Math.cos((lats[0] || 47) * Math.PI / 180));
    const box = { n: Math.max(...lats) + padLat, s: Math.min(...lats) - padLat, e: Math.max(...lons) + padLon, w: Math.min(...lons) - padLon };
    const urls = [];
    let kb = 0;
    for (const layer of MapView.layerTemplates(style)) {
      for (let z = MIN_ZOOM; z <= Math.min(MAX_ZOOM, layer.maxNativeZoom); z++) {
        for (let x = lonToX(box.w, z); x <= lonToX(box.e, z); x++) {
          for (let y = latToY(box.n, z); y <= latToY(box.s, z); y++) {
            const s = layer.subdomains.length ? layer.subdomains[Math.abs(x + y) % layer.subdomains.length] : "";
            urls.push(L.Util.template(layer.url, { s, x, y, z, r: L.Browser.retina ? "@2x" : "" }));
            kb += /jpeg/.test(layer.url) ? KB_PER_TILE.jpeg : KB_PER_TILE.png;
          }
        }
      }
    }
    return { urls, count: urls.length, megabytes: Math.max(1, Math.round(kb / 1024)) };
  }

  /** Fetch every URL once; the service worker caches tile responses as they pass. */
  async function download(urls, onProgress) {
    let cursor = 0, ok = 0, failed = 0;
    async function worker() {
      while (cursor < urls.length) {
        const url = urls[cursor++];
        try {
          const response = await fetch(url, { mode: "cors" });
          if (response.ok) ok++; else failed++;
        } catch (err) {
          failed++;
        }
        onProgress(ok + failed, urls.length);
      }
    }
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    return { ok, failed };
  }

  return { supported, register, planTiles, download };
})();


/* main.js — app controller: state, and the wiring between map, navigation, arrival panel, cards, sheets,
   location and import.
   Rule of the round: the current stop only changes when you tap "Delivered" (or "Later"). Nothing advances
   by itself. */
"use strict";

const App = (() => {
  const DEFAULT_START = { label: "Lidl · av. du 60e RI", lat: 47.2409, lon: 6.0060 };
  const DEFAULT_DWELL_S = 40;
  const AUTO_RECENTER_MS = 15000;
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const ICONS = {
    nav: "<svg viewBox=\"0 0 24 24\"><path d=\"M3 11 21 3l-8 18-2-8-8-2Z\"/></svg>",
    check: "<svg viewBox=\"0 0 24 24\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/></svg>",
    undo: "<svg viewBox=\"0 0 24 24\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>",
    close: "<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>",
    pin: "<svg viewBox=\"0 0 24 24\"><path d=\"M12 21s6-5.2 6-10.5A6 6 0 0 0 6 10.5C6 15.8 12 21 12 21Z\"/><circle cx=\"12\" cy=\"10.5\" r=\"2\"/></svg>",
    later: "<svg viewBox=\"0 0 24 24\"><path d=\"M12 7v5l3 2\"/><circle cx=\"12\" cy=\"12\" r=\"8.5\"/></svg>",
  };
  /* Manoeuvre arrows for the turn banner (24x24, stroked). */
  const TURN_ICONS = {
    straight: "M12 20V5M6 11l6-6 6 6",
    left: "M17 20v-7a4 4 0 0 0-4-4H5M10 4 5 9l5 5",
    right: "M7 20v-7a4 4 0 0 1 4-4h8M14 4l5 5-5 5",
    "slight-left": "M15 20v-6L8 7M8 13V7h6",
    "slight-right": "M9 20v-6l7-7M16 13V7h-6",
    "sharp-left": "M16 4v9l-8 7M8 13v7h7",
    "sharp-right": "M8 4v9l8 7M16 13v7H9",
    uturn: "M8 20V9a4 4 0 0 1 8 0v4M12 10l4 4 4-4",
    roundabout: "M12 20v-5M12 15a4 4 0 1 0-4-4M8 11H4M6 9l-2 2 2 2",
    arrive: "M12 21s6-5.2 6-10.5A6 6 0 0 0 6 10.5C6 15.8 12 21 12 21ZM12 12.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z",
  };

  const state = {
    round: null,
    ordered: [],
    byId: new Map(),
    progress: { done: {}, history: [], partial: {} },
    settings: Store.loadSettings(),
    notes: Store.loadNotes(),
    pins: Store.loadPins(),
    selectedId: null,
    me: null,
    overview: false,
    pickingPinFor: null,
  };
  let recenterTimer = 0;

  /* ---------- derived state ---------- */
  const doneIds = () => new Set(Object.keys(state.progress.done));
  const skipIds = () => new Set(state.settings.includeSkipped ? [] : state.ordered.filter((s) => s.flags.nothingToDeliver).map((s) => s.id));
  const activeStops = () => { const skip = skipIds(); return state.ordered.filter((s) => !skip.has(s.id)); };
  const upcomingStops = () => { const d = doneIds(); return activeStops().filter((s) => !d.has(s.id)); };
  const nextStop = () => upcomingStops()[0] || null;
  const freshMe = () => (state.me && !state.me.stale ? state.me : null);
  const addrKey = (stop) => Util.addressKey(stop.number, stop.street);

  function rebuildOrder() {
    state.ordered = Round.orderedStops(state.round);
    state.byId = new Map(state.ordered.map((s) => [s.id, s]));
  }

  function persist() {
    Store.saveRound(state.round);
    Store.saveProgress(state.round.id, state.progress);
  }

  function clockIn(seconds) {
    const d = new Date(Date.now() + seconds * 1000);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function formatDuration(seconds) {
    const min = Math.max(1, Math.round(seconds / 60));
    return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")}`;
  }

  /* ---------- estimates ---------- */
  /** Points of the rest of the round after my position: target, following stops, back to the start. */
  function wholePoints() {
    const up = upcomingStops();
    const lead = !freshMe() && !doneIds().size ? [state.round.start] : [];
    return up.length ? [...lead, ...up, state.round.start] : [];
  }

  /** Average seconds per stop measured today (riding + delivering), once a few stops are done. */
  function measuredPace() {
    const times = Object.values(state.progress.done).sort((a, b) => a - b);
    if (times.length < 4) return null;
    const gaps = [];
    for (let i = 1; i < times.length; i++) { const g = (times[i] - times[i - 1]) / 1000; if (g > 5 && g < 1200) gaps.push(g); }
    if (gaps.length < 3) return null;
    gaps.sort((a, b) => a - b);
    return gaps[Math.floor(gaps.length / 2)];
  }

  function remainingEstimate() {
    const points = wholePoints();
    const legs = Nav.legsFor(points);
    let meters = 0, seconds = 0;
    legs.forEach((leg, i) => {
      if (leg) { meters += leg.distance; seconds += leg.duration; return; }
      const m = Util.distanceM(points[i].lat, points[i].lon, points[i + 1].lat, points[i + 1].lon) * 1.35;
      meters += m; seconds += m / 4.2;
    });
    const p = Nav.progress(freshMe());
    if (p) { meters += p.left; seconds += p.timeLeft; }
    const count = upcomingStops().length;
    const pace = measuredPace();
    const total = pace ? pace * count : seconds + DEFAULT_DWELL_S * count;
    return { meters, seconds: total, count };
  }

  /* ---------- rendering ---------- */
  function renderProgress() {
    if (!state.round) return;
    const total = activeStops().length;
    const est = remainingEstimate();
    const count = total - est.count;
    const papersLeft = Object.values(Round.paperCounts(upcomingStops())).reduce((a, b) => a + b, 0);
    if (count === total && total) {
      Util.$("progressTitle").textContent = "Round complete";
      Util.$("progressSub").textContent = "Head back to the start";
    } else {
      Util.$("progressTitle").textContent = `${count} of ${total} stops`;
      Util.$("progressSub").textContent = `${Util.formatDistance(est.meters)} · ${papersLeft} papers · back ≈ ${clockIn(est.seconds)}`;
    }
    Util.$("ringFill").style.strokeDashoffset = String(97.4 * (1 - (total ? count / total : 0)));
  }
  const renderProgressSoon = Util.debounce(renderProgress, 800);

  function renderPins() {
    if (!state.round) return;
    MapView.renderPins({
      ordered: state.ordered, doneIds: doneIds(), skipIds: skipIds(), targetId: nextStop()?.id,
      selectedId: state.selectedId, start: state.round.start,
    });
  }

  function renderAll({ scrollCards = true } = {}) {
    const next = nextStop();
    const skip = skipIds();
    Cards.render(state.ordered.filter((s) => !skip.has(s.id)), doneIds(), next?.id);
    if (!state.selectedId || !state.byId.has(state.selectedId) || skip.has(state.selectedId)) state.selectedId = next?.id || null;
    if (scrollCards && state.selectedId) requestAnimationFrame(() => Cards.scrollTo(state.selectedId, false));
    renderProgress();
    renderPins();
    refreshNav(true);
    if (state.me) Cards.updateDirections(state.me, state.byId);
  }

  /* ---------- navigation (whole route + live leg + turn banner) ---------- */
  function drawWhole() {
    if (!state.round) return;
    const points = wholePoints();
    const legs = Nav.legsFor(points);
    MapView.setWholeRoute(legs.map((leg, i) => (leg
      ? { coords: leg.coords, real: true }
      : { coords: [[points[i].lat, points[i].lon], [points[i + 1].lat, points[i + 1].lon]], real: false })));
    renderProgressSoon();
  }

  function refreshNav(force = false) {
    if (!state.round) return;
    const target = nextStop();
    Nav.updateLive(freshMe(), target, { force });
    if (force) {
      drawWhole();
      if (state.settings.directions) Nav.ensureWhole(wholePoints());
    }
    renderNav();
  }

  function turnIcon(name, rotate = 0) {
    const d = TURN_ICONS[name] || TURN_ICONS.straight;
    return `<svg viewBox="0 0 24 24" style="transform:rotate(${rotate}deg)"><path d="${d}"/></svg>`;
  }

  function renderNav() {
    const banner = Util.$("navBanner");
    const me = freshMe();
    const target = nextStop();
    const p = state.round && target ? Nav.progress(me) : null;
    const arrived = Arrival.activeId && !Arrival.isManual;
    if (!p || !me || arrived || p.targetId !== target.id) { banner.hidden = true; return; }
    const addr = Round.stopAddress(target);
    let icon, dist, instr;
    if (p.source === "bike") {
      const d = Nav.describe(p.next);
      const arriving = d.icon === "arrive";
      icon = turnIcon(d.icon);
      dist = Util.formatDistance(arriving ? p.left : p.toTurn);
      instr = arriving ? `${target.seq} · ${addr}` : `${d.text}${d.street ? ` · ${d.street}` : ""}`;
    } else {
      const bearing = Util.bearingDeg(me.lat, me.lon, target.lat, target.lon);
      const h = MapView.heading;
      icon = turnIcon("straight", Number.isFinite(h) ? bearing - h : bearing);
      dist = Util.formatDistance(Util.distanceM(me.lat, me.lon, target.lat, target.lon));
      instr = `${target.seq} · ${addr}`;
    }
    banner.classList.toggle("straight", p.source !== "bike");
    Util.$("navArrow").innerHTML = icon;
    Util.$("navDist").textContent = dist;
    Util.$("navInstr").textContent = instr;
    Util.$("navEta").innerHTML = `<b>${formatDuration(p.timeLeft)}</b>stop ${target.seq}`;
    banner.hidden = false;
  }

  /* ---------- camera ---------- */
  function setFollow(on) {
    MapView.setFollow(on);
  }

  function onFollowChange(on, byUser) {
    Util.$("btnLocate").classList.toggle("on", on);
    Util.$("recenter").hidden = on || !freshMe();
    clearTimeout(recenterTimer);
    if (!on && byUser && nextStop()) recenterTimer = setTimeout(() => { if (freshMe() && !Sheet.isOpen) setFollow(true); }, AUTO_RECENTER_MS);
    if (on) { state.overview = false; Util.$("btnOverview").classList.remove("on"); }
  }

  function selectStop(id, { fly = true, fromCards = false } = {}) {
    if (!state.byId.has(id)) return;
    state.selectedId = id;
    if (fly) MapView.focus(state.byId.get(id), { zoom: Math.max(MapView.map.getZoom(), 18) });
    if (!fromCards) Cards.scrollTo(id);
    renderPins();
    if (state.me) Cards.updateDirections(state.me, state.byId);
  }

  function showNext() {
    const next = nextStop();
    if (!next) return;
    state.selectedId = next.id;
    Cards.scrollTo(next.id);
    if (freshMe()) setFollow(true);
    else MapView.focus(next, { zoom: Math.max(MapView.map.getZoom(), 18) });
  }

  /* ---------- arrival panel ---------- */
  function panelContext(stop, auto) {
    const me = freshMe();
    const nearby = auto && me ? upcomingStops().filter((s) => s.id !== stop.id &&
      Util.distanceM(me.lat, me.lon, s.lat, s.lon) <= state.settings.arrivalRadius + 10).slice(0, 3) : [];
    return {
      auto, total: activeStops().length, ticked: state.progress.partial[stop.id] || [], nearby,
      note: state.notes[addrKey(stop)] || "", isNext: stop.id === nextStop()?.id, isDone: doneIds().has(stop.id),
    };
  }

  function openArrival(id, { auto }) {
    const stop = state.byId.get(id);
    if (!stop) return;
    const wasActive = Arrival.activeId === id;
    Arrival.show(stop, panelContext(stop, auto));
    Util.$("cards").hidden = true;
    document.body.classList.add("arrived");
    state.selectedId = id;
    renderPins();
    renderNav();
    if (!wasActive) {
      if (auto) {
        Util.haptic([40, 70, 40]);
        if (state.settings.voice) Voice.announceStop(stop);
      } else if (!MapView.following) MapView.focus(stop, { zoom: Math.max(MapView.map.getZoom(), 18.5) });
    }
  }

  function closeArrival() {
    Arrival.hide();
    Util.$("cards").hidden = false;
    document.body.classList.remove("arrived");
    if (state.selectedId) requestAnimationFrame(() => Cards.scrollTo(state.selectedId, false));
    renderNav();
  }

  function refreshArrival() {
    const id = Arrival.activeId;
    if (id && state.byId.has(id)) Arrival.show(state.byId.get(id), panelContext(state.byId.get(id), !Arrival.isManual));
  }

  /** Ticks are a personal checklist inside a building; they never complete the stop on their own. */
  function toggleTick(id, index) {
    const set = new Set(state.progress.partial[id] || []);
    if (set.has(index)) set.delete(index); else set.add(index);
    state.progress.partial[id] = [...set];
    persist();
    refreshArrival();
  }

  /** Only the current stop pops up by itself, and only while I'm near it. */
  function checkArrival() {
    if (!state.round) return;
    const target = nextStop();
    const { enter, exit } = Arrival.decide(freshMe(), target ? [target] : [], state.settings);
    if (exit) closeArrival();
    if (enter && enter !== Arrival.activeId) openArrival(enter, { auto: true });
  }

  /* ---------- delivery actions ---------- */
  function markDone(id) {
    if (state.progress.done[id]) return;
    state.progress.done[id] = Date.now();
    state.progress.history.push(id);
    delete state.progress.partial[id];
    persist();
    Util.haptic([14, 40, 14]);
    const stop = state.byId.get(id);
    if (Sheet.isOpen) Sheet.close();
    if (Arrival.activeId === id) closeArrival();
    state.selectedId = null;
    Nav.resetLive();
    renderAll({ scrollCards: false });
    showNext();
    const next = nextStop();
    if (!next) { openSummary(); return; }
    Toast.show(`Stop ${stop.seq} delivered · next ${next.seq}`, "Undo", () => undoDone(id));
  }

  function undoDone(id) {
    const target = id || state.progress.history[state.progress.history.length - 1];
    if (!target || !state.progress.done[target]) return;
    delete state.progress.done[target];
    state.progress.history = state.progress.history.filter((x) => x !== target);
    persist();
    Arrival.forget(target);
    state.selectedId = target;
    if (Sheet.isOpen) Sheet.close();
    Nav.resetLive();
    renderAll({ scrollCards: false });
    selectStop(target, { fly: false });
    if (freshMe()) setFollow(true);
    Toast.show(`Stop ${state.byId.get(target).seq} back to do`);
  }

  /** Move a stop to the end of the round (door closed, come back later). */
  function postpone(id) {
    const before = state.round.order.slice();
    state.round.order = [...before.filter((x) => x !== id), id];
    rebuildOrder();
    persist();
    if (Arrival.activeId === id) { Arrival.dismiss(); closeArrival(); }
    state.selectedId = null;
    Nav.resetLive();
    renderAll({ scrollCards: false });
    showNext();
    Toast.show(`Moved to the end · now stop ${state.byId.get(id).seq}`, "Undo", () => {
      state.round.order = before; rebuildOrder(); persist(); state.selectedId = id; Nav.resetLive(); renderAll();
    });
  }

  /* ---------- notes & pins ---------- */
  function saveNote(stop, text) {
    const key = addrKey(stop);
    if (text.trim()) state.notes[key] = text.trim(); else delete state.notes[key];
    Store.saveNotes(state.notes);
    refreshArrival();
  }

  function startPinPick(id) {
    Sheet.close();
    closeArrival();
    state.pickingPinFor = id;
    const stop = state.byId.get(id);
    MapView.focus(stop, { zoom: 19.5 });
    document.body.classList.add("picking");
    Toast.show(`Tap the map at the right door for ${Round.stopAddress(stop)}`, "Cancel", cancelPinPick, 20000);
  }

  function cancelPinPick() {
    state.pickingPinFor = null;
    document.body.classList.remove("picking");
  }

  function applyPinPick(latlng) {
    const id = state.pickingPinFor;
    cancelPinPick();
    const stop = state.round.stops.find((s) => s.id === id);
    if (!stop) return;
    const old = { lat: stop.lat, lon: stop.lon, approx: stop.approx };
    stop.lat = latlng.lat; stop.lon = latlng.lng; stop.approx = false;
    state.pins[addrKey(stop)] = { lat: stop.lat, lon: stop.lon };
    Store.savePins(state.pins);
    rebuildOrder(); persist(); Nav.resetLive(); renderAll({ scrollCards: false });
    Toast.show("Pin moved · remembered for every day", "Undo", () => {
      Object.assign(stop, old); delete state.pins[addrKey(stop)]; Store.savePins(state.pins);
      rebuildOrder(); persist(); Nav.resetLive(); renderAll({ scrollCards: false });
    }, 6000);
  }

  /** Corrected pins override geocoded positions for the same address (on import and on load). */
  function applyPinnedPositions(stops) {
    for (const stop of stops) {
      const pin = state.pins[Util.addressKey(stop.number, stop.street)];
      if (pin) { stop.lat = pin.lat; stop.lon = pin.lon; stop.approx = false; }
    }
  }

  /* ---------- detail sheet ---------- */
  function navigateUrl(stop) {
    return IS_IOS
      ? `https://maps.apple.com/?daddr=${stop.lat},${stop.lon}&dirflg=w`
      : `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lon}&travelmode=bicycling`;
  }

  function clientHtml(client) {
    const papers = client.papers.map((k) => `<span class="chip"><i class="p-${k}"></i>${Round.paperLabel(k)}</span>`).join("");
    const meta = [
      papers,
      client.code ? `<span class="chip code">Code <span class="code-big">${Util.escapeHtml(client.code)}</span></span>` : "",
      client.appt ? `<span class="chip">Appt ${Util.escapeHtml(client.appt)}</span>` : "",
      client.flags.suspended ? "<span class=\"chip\">Don't deliver</span>" : "",
      client.flags.isNew ? "<span class=\"chip okc\">New</span>" : "",
      client.flags.must ? "<span class=\"chip warnc\">Not received</span>" : "",
      client.flags.early ? "<span class=\"chip alert\">Before 7:00</span>" : "",
    ].join("");
    return `
      <div class="client${client.flags.suspended ? " is-skip" : ""}">
        <div class="client-top"><span class="paper-bar p-${client.papers[0]}"></span>
          <span class="client-name${client.flags.suspended ? " suspended" : ""}">${Util.escapeHtml(client.name)}</span></div>
        <div class="client-meta">${meta}</div>
        ${client.notes ? `<div class="client-note">${Util.escapeHtml(client.notes)}</div>` : ""}
      </div>`;
  }

  function openStop(id) {
    const stop = state.byId.get(id);
    if (!stop) return;
    const isDone = doneIds().has(id);
    const isSkip = skipIds().has(id);
    const me = freshMe();
    const distance = me ? Util.formatDistance(Util.distanceM(me.lat, me.lon, stop.lat, stop.lon) * 1.25) : "";
    const note = state.notes[addrKey(stop)] || "";
    const alerts = [
      isSkip ? "<div class=\"alert-row info\">Nothing to deliver here today (grey on the list)</div>" : "",
      stop.flags.early ? "<div class=\"alert-row crit\">⏰ Deliver before 7:00</div>" : "",
      stop.flags.must ? "<div class=\"alert-row warn\">⚠️ Reported not received — make sure it's delivered</div>" : "",
      stop.approx ? "<div class=\"alert-row info\">📍 Pin position is approximate — use “Fix pin” to correct it once</div>" : "",
    ].join("");
    const html = `
      <div class="sh-head">
        <div class="seq" style="${isDone ? "background:var(--ok);color:#fff" : (stop.id === nextStop()?.id ? "background:var(--accent);color:#fff" : "")}">${stop.seq}</div>
        <div class="sh-title">
          <h2 id="sheetTitle">${Util.escapeHtml(Round.stopAddress(stop))}</h2>
          <p>${stop.clients.length} client${stop.clients.length > 1 ? "s" : ""}${distance ? ` · ${distance} away` : ""}</p>
        </div>
        <button class="close-x" data-act="close" aria-label="Close">${ICONS.close}</button>
      </div>
      ${alerts ? `<div class="alerts">${alerts}</div>` : ""}
      <div class="sh-actions">
        ${isDone
          ? `<button class="btn" data-act="undo">${ICONS.undo}Not delivered</button>`
          : `<button class="btn success" data-act="done">${ICONS.check}Delivered</button>`}
        <a class="btn" href="${navigateUrl(stop)}" target="_blank" rel="noopener">${ICONS.nav}${IS_IOS ? "Apple Maps" : "Google Maps"}</a>
      </div>
      <div class="sh-actions" style="margin-top:0">
        <button class="btn" data-act="pin">${ICONS.pin}Fix pin</button>
        ${isDone ? "" : `<button class="btn" data-act="later">${ICONS.later}Later</button>`}
      </div>
      <div class="group-label">Papers</div>
      <div class="list">${stop.clients.map(clientHtml).join("")}</div>
      <div class="group-label">My note for this address</div>
      <textarea class="note-input" id="noteInput" rows="2" placeholder="e.g. mailbox behind the gate, code changed…">${Util.escapeHtml(note)}</textarea>
      <button class="btn" data-act="savenote" style="width:100%;margin-top:8px">Save note</button>`;
    const body = Sheet.open(html, { label: Round.stopAddress(stop) });
    const on = (act, fn) => { const el = body.querySelector(`[data-act=${act}]`); if (el) el.onclick = fn; };
    on("close", Sheet.close);
    on("done", () => markDone(id));
    on("undo", () => undoDone(id));
    on("later", () => { Sheet.close(); postpone(id); });
    on("pin", () => startPinPick(id));
    on("savenote", () => { saveNote(stop, body.querySelector("#noteInput").value); Toast.show("Note saved for this address"); Sheet.close(); });
  }

  /* ---------- stop list with search ---------- */
  function openStopList(filter = "todo", query = "") {
    if (!state.round) { openWelcomeSheet(); return; }
    const done = doneIds(), skip = skipIds();
    const status = (s) => (done.has(s.id) ? "done" : (skip.has(s.id) ? "skip" : "todo"));
    const q = Util.stripAccents(query).toLowerCase().trim();
    const match = (s) => !q || Util.stripAccents(`${s.seq} ${Round.stopAddress(s)} ${s.clients.map((c) => `${c.name} ${c.paper} ${c.code}`).join(" ")}`).toLowerCase().includes(q);
    const rows = state.ordered.filter((s) => (filter === "all" || status(s) === filter) && match(s));
    const counts = Round.paperCounts(upcomingStops());
    const chips = Round.PAPERS.slice().reverse().filter((p) => counts[p.key])
      .map((p) => `<span class="chip"><i class="p-${p.key}"></i>${p.label} × ${counts[p.key]}</span>`).join("");
    const html = `
      <div class="settings">
        <h2>Stops</h2>
        <input class="search" id="stopSearch" type="search" placeholder="Search name, street, code…" value="${Util.escapeHtml(query)}" autocomplete="off">
        <div class="seg" role="group" aria-label="Filter">${[["todo", "To do"], ["done", "Delivered"], ["skip", "Nothing today"], ["all", "All"]].map(([k, l]) =>
          `<button data-filter="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
        ${filter === "todo" && chips ? `<div class="paper-left">${chips}</div>` : ""}
        <div class="list stop-list">${rows.length ? rows.map((s) => `
          <button class="row stop-row ${status(s)}" data-stop="${s.id}">
            <span class="seq sm">${s.seq}</span>
            <span class="r-label">${Util.escapeHtml(Round.stopAddress(s))}<small>${Util.escapeHtml(s.clients.map((c) => c.name).join(", "))}</small></span>
            <span class="r-value">${status(s) === "done" ? "✓" : (status(s) === "skip" ? "–" : s.clients.length)}</span>
          </button>`).join("") : "<div class=\"row\"><span class=\"r-label\">No stops match</span></div>"}</div>
      </div>`;
    const body = Sheet.open(html, { label: "Stops", tall: true });
    const search = body.querySelector("#stopSearch");
    search.oninput = Util.debounce(() => openStopList(filter, search.value), 250);
    if (query) { search.focus(); search.setSelectionRange(query.length, query.length); }
    body.querySelectorAll("[data-filter]").forEach((b) => { b.onclick = () => openStopList(b.dataset.filter, search.value); });
    body.querySelectorAll("[data-stop]").forEach((b) => {
      b.onclick = () => { const id = b.dataset.stop; Sheet.close(); selectStop(id); openArrival(id, { auto: false }); };
    });
  }

  /* ---------- end of round ---------- */
  function openSummary() {
    const times = Object.values(state.progress.done).sort((a, b) => a - b);
    const stops = activeStops();
    const clients = stops.reduce((n, s) => n + s.clients.filter((c) => !c.flags.suspended).length, 0);
    const papers = Object.values(Round.paperCounts(stops)).reduce((a, b) => a + b, 0);
    const span = times.length > 1 ? (times[times.length - 1] - times[0]) / 1000 : 0;
    const html = `
      <div class="settings"><h2>Round complete 🎉</h2>
        <p class="foot-note" style="margin:4px 0 0">Every stop is ticked. Head back to the start.</p>
        <div class="stats-grid">
          <div class="stat-tile"><b>${stops.length}</b><span>stops</span></div>
          <div class="stat-tile"><b>${papers}</b><span>papers · ${clients} clients</span></div>
          <div class="stat-tile"><b>${span ? formatDuration(span) : "–"}</b><span>first to last delivery</span></div>
          <div class="stat-tile"><b>${span && times.length > 1 ? `${Math.round(span / (times.length - 1))} s` : "–"}</b><span>average per stop</span></div>
        </div>
        <div class="sh-actions"><button class="btn primary" data-act="ok">Done</button><button class="btn" data-act="newday">New day</button></div>
      </div>`;
    const body = Sheet.open(html, { label: "Round complete" });
    body.querySelector("[data-act=ok]").onclick = Sheet.close;
    body.querySelector("[data-act=newday]").onclick = () => { Sheet.close(); resetDay(); };
  }

  function resetDay() {
    state.progress = { done: {}, history: [], partial: {} };
    persist(); state.selectedId = null; Nav.resetLive(); renderAll(); showNext();
    Toast.show("New day started");
  }

  /* ---------- map style ---------- */
  function applyStyle(style) {
    state.settings.mapStyle = style;
    Store.saveSettings(state.settings);
    MapView.setStyle(style);
  }

  function openLayers() {
    const opts = [["satellite", "Satellite", "sw-sat"], ["hybrid", "Satellite + streets", "sw-hyb"], ["plan", "Street map", "sw-plan"]];
    const html = `
      <div class="settings"><h2>Map style</h2>
        <div class="layer-grid">${opts.map(([key, label, sw]) =>
          `<button class="layer-opt${state.settings.mapStyle === key ? " on" : ""}" data-style="${key}"><span class="layer-swatch ${sw}"></span>${label}</button>`).join("")}
        </div>
        <p class="foot-note">Imagery and street map: IGN. Street names: OpenStreetMap / CARTO. Routes: OpenStreetMap via FOSSGIS.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Map style" });
    body.querySelectorAll("[data-style]").forEach((btn) => {
      btn.onclick = () => { applyStyle(btn.dataset.style); Sheet.close(); };
    });
  }

  /* ---------- settings ---------- */
  function switchRow(key, label, hint) {
    return `<button class="row" data-toggle="${key}" role="switch" aria-checked="${Boolean(state.settings[key])}">
      <span class="r-label">${label}<small>${hint}</small></span><span class="switch${state.settings[key] ? " on" : ""}"></span></button>`;
  }

  function openSettings() {
    if (!state.round) { openWelcomeSheet(); return; }
    const r = state.round;
    const html = `
      <div class="settings">
        <h2>Settings</h2>
        <div class="list">
          <div class="row"><span class="r-label">${Util.escapeHtml(r.name)}<small>${activeStops().length} stops to deliver · ${state.ordered.length - activeStops().length} with nothing today</small></span></div>
          <button class="row" data-act="import"><span class="r-label">Import a new list<small>PDF, Excel or CSV. Columns are detected automatically.</small></span><span class="r-value">›</span></button>
        </div>

        <div class="group-label">Riding</div>
        <div class="list">
          ${switchRow("directions", "Street directions", "Real route on the streets + turn banner (needs data)")}
          ${switchRow("headingUp", "Map turns with me", "Like Google Maps: the road ahead is always up")}
          ${switchRow("voice", "Spoken arrivals", "Reads the address, papers and code aloud when you arrive")}
          ${switchRow("includeSkipped", "Include grey stops", "Stops with nothing to deliver today stay in the route")}
        </div>
        <div class="group-label">Route type · “On foot” allows shortcuts and one-way streets both ways</div>
        <div class="seg" role="group" aria-label="Route type">${[["bike", "Bike"], ["foot", "On foot"]].map(([k, l]) =>
          `<button data-profile="${k}" class="${state.settings.profile === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <div class="group-label">Pop-up distance at a stop</div>
        <div class="seg" role="group" aria-label="Arrival distance">${[15, 25, 40].map((n) =>
          `<button data-radius="${n}" class="${state.settings.arrivalRadius === n ? "on" : ""}">${n} m</button>`).join("")}</div>

        <div class="group-label">Route order</div>
        <div class="list">
          <button class="row" data-act="orderSwitch" role="switch" aria-checked="${Boolean(r.optimised)}">
            <span class="r-label">Optimise route order<small>${r.optimised ? "On: fastest loop by bike, delivered stops kept" : "Off: exactly the order of your list"}</small></span>
            <span class="switch${r.optimised ? " on" : ""}"></span></button>
        </div>

        <div class="group-label">Start &amp; finish</div>
        <div class="list">
          <div class="row"><span class="r-label">${Util.escapeHtml(r.start.label)}<small>Long-press anywhere on the map to move it</small></span></div>
          <button class="row" data-act="startHere"><span class="r-label">Use my current position</span><span class="r-value">⌖</span></button>
        </div>

        <div class="group-label">Map</div>
        <div class="seg" role="group" aria-label="Map style">${[["satellite", "Satellite"], ["hybrid", "Hybrid"], ["plan", "Plan"]].map(([k, l]) =>
          `<button data-style="${k}" class="${state.settings.mapStyle === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <div class="list" style="margin-top:8px">
          <button class="row" data-act="offline"><span class="r-label">Save map for offline<small>${Offline.supported ? "Downloads the imagery around your round (Wi-Fi recommended)" : "Needs the web version (https)"}</small></span><span class="r-value">↓</span></button>
          <button class="row" data-act="routes"><span class="r-label">Refresh saved routes<small>Re-download street routes between stops</small></span><span class="r-value">↻</span></button>
        </div>

        <div class="group-label">Today</div>
        <div class="list" id="resetBox">
          <button class="row danger" data-act="reset"><span class="r-label">Start a new day<small>Clears every “delivered” tick</small></span></button>
          <button class="row" data-act="sample"><span class="r-label">Download sample CSV<small>Shows the columns the importer understands</small></span><span class="r-value">↓</span></button>
          ${BUILTIN_ROUND ? "<button class=\"row\" data-act=\"builtin\"><span class=\"r-label\">Load the built-in round</span><span class=\"r-value\">›</span></button>" : ""}
        </div>
        <p class="foot-note">Lists, ticks, notes and fixed pins stay on this phone. Routes © OpenStreetMap contributors (FOSSGIS).</p>
      </div>`;
    const body = Sheet.open(html, { label: "Settings" });
    const on = (act, fn) => { const el = body.querySelector(`[data-act=${act}]`); if (el) el.onclick = fn; };
    const save = () => Store.saveSettings(state.settings);
    on("import", () => { Sheet.close(); Util.$("csvInput").click(); });
    on("sample", downloadSample);
    on("orderSwitch", async () => {
      Sheet.close();
      state.settings.optimiseOrder = !state.round.optimised;
      save();
      if (state.settings.optimiseOrder) await reoptimise(true); else useListOrder();
    });
    on("startHere", () => {
      const me = freshMe();
      if (!me) { Toast.show("No GPS fix yet"); return; }
      Sheet.close(); setStart({ lat: me.lat, lon: me.lon }, "My position");
    });
    on("offline", () => { Sheet.close(); saveOfflineMap(); });
    on("routes", () => { Sheet.close(); Nav.clearCache(); Nav.resetLive(); renderAll({ scrollCards: false }); Toast.show("Downloading routes again…"); });
    on("reset", () => {
      const box = body.querySelector("#resetBox");
      box.innerHTML = `<div class="row"><span class="r-label">Clear all ticks for this round?</span></div>
        <div class="row" style="gap:8px"><button class="btn danger grow" data-act="confirmReset">Clear ticks</button><button class="btn grow" data-act="cancelReset">Cancel</button></div>`;
      box.querySelector("[data-act=confirmReset]").onclick = () => { Sheet.close(); resetDay(); };
      box.querySelector("[data-act=cancelReset]").onclick = openSettings;
    });
    on("builtin", async () => { Sheet.close(); await loadBuiltin(); });
    body.querySelectorAll("[data-toggle]").forEach((b) => {
      b.onclick = () => {
        const key = b.dataset.toggle;
        state.settings[key] = !state.settings[key];
        save();
        if (key === "directions") { Router.setEnabled(state.settings.directions); Nav.resetLive(); refreshNav(true); }
        if (key === "headingUp") MapView.setHeadingUp(state.settings.headingUp);
        if (key === "voice" && state.settings.voice) Voice.say("Annonces vocales activées");
