<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}

	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}
.leaflet-container a {

}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}

	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;

	}

.leaflet-overlay-pane svg {

	}

	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {

	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,

.leaflet-top {

.leaflet-right {

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-right .leaflet-control {

.leaflet-bottom .leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-animated {

	}

}

.leaflet-zoom-anim .leaflet-zoom-animated {

/* attribution and scale controls */

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-popup-tip {

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;

<style>/* Tournée — full-bleed map, floating glass controls, swipeable stop cards, bottom sheets.
   Tokens: light by default, dark via prefers-color-scheme. */
:root {
  --bg: #eef0f3;
  --glass: rgba(250, 251, 252, 0.80);
  --glass-strong: rgba(255, 255, 255, 0.94);
  --solid: #ffffff;
  --fg: #0e1116;
  --fg-2: #5b6370;
  --fg-3: #8a929e;
  --hairline: rgba(20, 30, 45, 0.10);
  --fill: rgba(118, 128, 145, 0.12);
  --accent: #0a72ef;
  --accent-ink: #ffffff;
  --route: #2f8cff;
  --route-casing: #ffffff;
  --ok: #1fa95a;
  --warn: #e07b00;
  --crit: #e5383b;
  --shadow: 0 8px 28px rgba(10, 20, 35, 0.18), 0 1px 3px rgba(10, 20, 35, 0.10);
  --paper-est: #9aa3ae;
  --paper-monde: #22b45a;
  --paper-match: #ff8a00;
  --paper-elle: #ff4f9a;
  --paper-marianne: #2f7cf6;
  --paper-t7j: #8b5cf6;
  --paper-tcs: #0fb5a6;
  --paper-maxi: #e8a000;
  --radius-l: 22px;
  --radius-m: 14px;
  --radius-s: 9px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto Flex", Roboto, "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto Flex", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --cards-h: 176px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d10;
    --glass: rgba(22, 25, 30, 0.78);
    --glass-strong: rgba(26, 29, 35, 0.96);
    --solid: #16191e;
    --fg: #f3f5f8;
    --fg-2: #a3abb7;
    --fg-3: #737b87;
    --hairline: rgba(255, 255, 255, 0.10);
    --fill: rgba(140, 150, 165, 0.16);
    --accent: #3b93ff;
    --route: #4aa0ff;
    --route-casing: #0b2340;
    --ok: #34d273;
    --warn: #ffa53a;
    --crit: #ff5a5f;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button, .btn, .row, .card, .chip { touch-action: manipulation; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(22px);
  backdrop-filter: saturate(180%) blur(22px);
  box-shadow: var(--shadow);
}

/* ---------- Map ---------- */
#map { position: fixed; inset: 0; background: #1d2228; z-index: 0; }
.leaflet-container { font-family: var(--font); background: #1d2228; }
.leaflet-control-attribution {
  font-size: 9px !important; background: rgba(0, 0, 0, 0.35) !important; color: #e8e8e8 !important;
  border-radius: 0 6px 0 0; padding: 1px 6px !important; margin: 0 !important;
}
.leaflet-control-attribution a { color: #fff !important; }
.leaflet-bottom { bottom: calc(var(--cards-h) + var(--safe-bottom) + 8px); transition: bottom .25s; }

/* ---------- Top bar ---------- */
.topbar {
  position: fixed; z-index: 500; top: calc(var(--safe-top) + 10px); left: 12px; right: 12px;
  height: 56px; border-radius: 18px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 10px;
}
.ring { width: 38px; height: 38px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring-track { stroke: var(--fill); }
.ring-fill { stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 97.4; stroke-dashoffset: 97.4; transition: stroke-dashoffset .4s ease; }
.topbar-text { flex: 1; min-width: 0; }
.topbar-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.15; }
.topbar-sub { font-size: 13px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.icon-btn:active { background: var(--fill); }
.icon-btn svg, .fab svg { width: 22px; height: 22px; fill: none; stroke: var(--fg); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.gps-banner {
  position: fixed; z-index: 500; top: calc(var(--safe-top) + 74px); left: 50%; transform: translateX(-50%);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center;
  white-space: nowrap;
}
.gps-banner.error { color: var(--crit); }
.nav-banner:not([hidden]) ~ .gps-banner { top: calc(var(--safe-top) + 150px); }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
.gps-banner.error .dot-pulse { background: var(--crit); animation: none; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }

/* ---------- Floating buttons ---------- */
.fab-col {
  position: fixed; z-index: 500; right: 12px;
  bottom: calc(var(--cards-h) + var(--safe-bottom) + 18px);
  display: flex; flex-direction: column; gap: 10px; transition: bottom .25s;
}
.fab { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; }
.fab:active { transform: scale(.94); }
.fab.on { background: var(--accent); }
.fab.on svg { stroke: var(--accent-ink); }
.ico-locate path { fill: none; }
#btnLocate.on .ico-locate path { fill: var(--accent-ink); }

/* ---------- Stop cards ---------- */
.cards {
  position: fixed; z-index: 600; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 10px);
  height: var(--cards-h); display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; padding: 0 9vw; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.cards::-webkit-scrollbar { display: none; }
.card {
  flex: 0 0 82vw; max-width: 420px; scroll-snap-align: center; border-radius: var(--radius-l);
  background: var(--glass-strong); box-shadow: var(--shadow); padding: 14px 14px 12px;
  display: grid; grid-template-rows: auto 1fr auto; gap: 8px; position: relative; overflow: hidden;
  transition: transform .2s ease, opacity .2s;
}
.card.is-done { opacity: .72; }
.card-head { display: flex; gap: 11px; align-items: flex-start; min-width: 0; }
.seq {
  flex: none; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 18px; background: var(--fill); color: var(--fg);
}
.card.is-next .seq { background: var(--accent); color: var(--accent-ink); }
.card.is-done .seq { background: var(--ok); color: #fff; }
.card-title { min-width: 0; flex: 1; }
.addr { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.015em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { font-size: 13.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dir { flex: none; text-align: right; display: grid; justify-items: end; gap: 2px; }
.dir-arrow { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.dir-arrow svg { width: 16px; height: 16px; fill: var(--accent); transition: transform .3s ease; }
.dir-dist { font-size: 13px; font-weight: 700; color: var(--fg); }
.card-mid { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-width: 0; overflow: hidden; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 8px;
  background: var(--fill); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--paper-est); flex: none; }
.chip.code { font-family: var(--mono); letter-spacing: .02em; }
.chip.alert { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
.chip.warnc { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.okc { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.p-monde { background: var(--paper-monde) !important; }
.p-match { background: var(--paper-match) !important; }
.p-elle { background: var(--paper-elle) !important; }
.p-marianne { background: var(--paper-marianne) !important; }
.p-t7j { background: var(--paper-t7j) !important; }
.p-tcs { background: var(--paper-tcs) !important; }
.p-maxi { background: var(--paper-maxi) !important; }
.card-foot { display: flex; gap: 8px; }
.btn {
  height: 44px; border-radius: 13px; padding: 0 16px; font-weight: 700; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--fill); color: var(--fg);
  text-decoration: none;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.success { background: var(--ok); color: #fff; }
.btn.grow { flex: 1; }
.btn.danger { color: var(--crit); }

/* ---------- Map markers ---------- */
.pin { position: relative; width: 0; height: 0; }
.pin-body {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  min-width: 28px; height: 28px; padding: 0 5px; border-radius: 14px; display: grid; place-items: center;
  background: #fff; color: #111; font: 800 13px/1 var(--font-display); border: 2.5px solid var(--route);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: transform .2s;
}
.pin.next .pin-body {
  min-width: 40px; height: 40px; border-radius: 20px; font-size: 17px; background: var(--accent); color: #fff; border: 3px solid #fff;
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent), 0 4px 12px rgba(0, 0, 0, .4);
}
.pin.selected .pin-body { transform: translate(-50%, -50%) scale(1.22); border-color: #ffd60a; }
.pin.done .pin-body { background: var(--ok); color: #fff; border-color: #fff; min-width: 20px; height: 20px; font-size: 10px; opacity: .85; }
.pin.dim .pin-body { min-width: 22px; height: 22px; font-size: 10.5px; border-width: 2px; opacity: .9; }
.pin.alert .pin-body::after {
  content: "!"; position: absolute; right: -6px; top: -6px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--crit); color: #fff; font: 900 11px/16px var(--font); text-align: center; border: 1.5px solid #fff;
}
/* Overview dots: tiny, numbered only when zoomed in. */
.pin.skip .pin-body { background: #8a929e !important; opacity: .7; }
.z-near .pin.skip .pin-body { color: #fff; border-color: #fff; }
.pin.up .pin-body { cursor: pointer; }
.pin.dot .pin-body { min-width: 12px; width: 12px; height: 12px; padding: 0; font-size: 0; border-width: 2px; background: #2f8cff; border-color: #fff; }
.pin.dot.done .pin-body { background: var(--ok); }
.pin.dot.alert .pin-body { background: var(--crit); }
.pin.dot.alert .pin-body::after { display: none; }
.z-near .pin.dot .pin-body { width: auto; min-width: 24px; height: 24px; font-size: 11px; padding: 0 4px; background: #fff; color: #111; border-color: #2f8cff; }
.z-near .pin.dot.done .pin-body { background: var(--ok); color: #fff; border-color: #fff; }
.z-near .pin.dot.alert .pin-body { border-color: var(--crit); }
.pin.start .pin-body { background: #111; color: #fff; border-color: #fff; border-radius: 8px; font-size: 11px; padding: 0 7px; }

.me { position: relative; width: 0; height: 0; }
.me-acc { position: absolute; left: 0; top: 0; border-radius: 50%; background: color-mix(in srgb, #1a73e8 14%, transparent);
  border: 1px solid color-mix(in srgb, #1a73e8 35%, transparent); transform: translate(-50%, -50%); transition: opacity .3s; }
.me-halo { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(26, 115, 232, .28), rgba(26, 115, 232, 0) 70%); }
.me-dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff;
  transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0, 0, 0, .45); }
.me-arrow { position: absolute; left: 0; top: 0; width: 40px; height: 40px; transform: translate(-50%, -50%); display: none; will-change: transform; }
.me-arrow svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5)); }
.me-arrow path { fill: #1a73e8; stroke: #fff; stroke-width: 3; stroke-linejoin: round; }
.me.has-heading .me-arrow { display: block; }
.me.has-heading .me-dot { display: none; }
.me.stale .me-dot, .me.stale .me-arrow path { fill: #8a929e; background: #8a929e; }

/* Re-centre pill (shown when the map stopped following you) */
.recenter {
  position: fixed; z-index: 610; left: 50%; transform: translateX(-50%); bottom: calc(var(--cards-h) + var(--safe-bottom) + 22px);
  height: 46px; padding: 0 18px; border-radius: 23px; display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 16px; color: #1a73e8;
}
.recenter svg { width: 18px; height: 18px; fill: #1a73e8; }
.arrived .recenter { bottom: calc(min(66dvh, 620px) + var(--safe-bottom) + 20px); }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 900; background: rgba(0, 0, 0, .28); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; z-index: 950; left: 0; right: 0; bottom: 0; max-height: 86dvh;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .3);
  display: flex; flex-direction: column; transform: translateY(0); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: var(--safe-bottom); max-width: 640px; margin: 0 auto;
}
.sheet.closing { transform: translateY(105%); }
.sheet.tall { height: 86dvh; }
.sheet.opening { animation: rise .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(100%); } }
.grabber { padding: 9px 0 4px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grabber span { width: 40px; height: 5px; border-radius: 3px; background: var(--fg-3); opacity: .5; }
.sheet-body { overflow-y: auto; padding: 4px 18px calc(18px + var(--safe-bottom)); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

.sh-head { display: flex; gap: 12px; align-items: flex-start; }
.sh-head .seq { min-width: 46px; height: 46px; font-size: 21px; border-radius: 14px; }
.sh-title { flex: 1; min-width: 0; }
.sh-title h2 { margin: 0; font: 800 25px/1.12 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.sh-title p { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; }
.close-x { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; flex: none; }
.close-x svg { width: 14px; height: 14px; stroke: var(--fg-2); stroke-width: 2.6; stroke-linecap: round; }
.sh-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 6px; }
.alerts { display: grid; gap: 8px; margin-top: 14px; }
.alert-row { border-radius: 12px; padding: 10px 12px; font-weight: 650; font-size: 14.5px; display: flex; gap: 9px; align-items: flex-start; }
.alert-row.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
.alert-row.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.alert-row.info { background: var(--fill); color: var(--fg-2); }
.group-label { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); margin: 20px 4px 8px; }
.list { background: var(--solid); border-radius: 16px; overflow: hidden; }
.client { padding: 12px 14px; display: grid; gap: 6px; border-top: 1px solid var(--hairline); }
.client:first-child { border-top: 0; }
.client-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.paper-bar { width: 5px; align-self: stretch; border-radius: 3px; background: var(--paper-est); flex: none; }
.client-name { font-weight: 700; font-size: 16.5px; flex: 1; min-width: 0; text-transform: capitalize; }
.client-name.suspended { color: var(--fg-3); text-decoration: line-through; }
.client-meta { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 15px; }
.client-note { padding-left: 15px; font-size: 14px; color: var(--fg-2); }
.code-big { font-family: var(--mono); font-weight: 800; font-size: 15px; }

/* Settings */
.settings h2 { margin: 2px 0 6px; font: 800 26px/1.1 var(--font-display); letter-spacing: -0.02em; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--hairline); min-height: 52px; width: 100%; text-align: left; }
.row:first-child { border-top: 0; }
.row:active { background: var(--fill); }
.row .r-label { flex: 1; min-width: 0; font-weight: 600; }
.row .r-label small { display: block; font-weight: 400; color: var(--fg-2); font-size: 13px; margin-top: 2px; }
.row .r-value { color: var(--fg-2); font-size: 14.5px; }
.row.danger .r-label { color: var(--crit); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 11px; padding: 3px; gap: 3px; margin: 4px 0; }
.seg button { height: 36px; border-radius: 9px; font-weight: 650; font-size: 14px; color: var(--fg-2); }
.seg button.on { background: var(--solid); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.foot-note { color: var(--fg-3); font-size: 12.5px; margin: 14px 4px 0; line-height: 1.45; }

/* Toast: top of the screen so it never covers the buttons you need to tap */
.toast {
  position: fixed; z-index: 980; left: 50%; transform: translateX(-50%);
  top: calc(var(--safe-top) + 76px); border-radius: 16px; padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 15px; width: max-content; max-width: calc(100vw - 24px);
  animation: toastIn .25s cubic-bezier(.2, .8, .2, 1); pointer-events: none;
}
.toast .toast-action { pointer-events: auto; }
.nav-banner:not([hidden]) ~ .toast { top: calc(var(--safe-top) + 156px); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } }
.toast-action { color: var(--accent); font-weight: 800; padding: 8px 10px; border-radius: 10px; }
.toast-action:empty { display: none; }

/* Busy overlay */
.busy { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgba(0, 0, 0, .35); }
.busy-card { border-radius: 20px; padding: 22px 26px; min-width: 240px; display: grid; gap: 12px; justify-items: center; font-weight: 650; text-align: center; }
.spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--fill); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy-bar { width: 100%; height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.busy-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* Layer picker */
.layer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.layer-opt { border-radius: 14px; padding: 8px; background: var(--solid); display: grid; gap: 6px; justify-items: center; font-weight: 650; font-size: 13.5px; border: 2px solid transparent; }
.layer-opt.on { border-color: var(--accent); }
.layer-swatch { width: 100%; aspect-ratio: 1.4; border-radius: 9px; max-width: 100%; }
.sw-sat { background: linear-gradient(135deg, #39492f, #6b7457 40%, #a7a08b 60%, #3c4a35); }
.sw-hyb { background: linear-gradient(135deg, #39492f, #6b7457 40%, #a7a08b 60%, #3c4a35); position: relative; }
.sw-hyb::after { content: "Rue"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; text-shadow: 0 1px 2px #000; }
.sw-plan { background: linear-gradient(135deg, #f2efe6, #e3e0d6 45%, #ffffff 50%, #d9e7c8); }

/* While the arrival panel is up, it owns the bottom of the screen. */
.arrived .fab-col { opacity: 0; pointer-events: none; }
.arrived .leaflet-bottom { bottom: 12px; }
.fab-col { transition: bottom .25s, opacity .2s; }

/* ---------- Turn-by-turn banner ---------- */
.nav-banner {
  position: fixed; z-index: 520; top: calc(var(--safe-top) + 74px); left: 12px; right: 12px;
  min-height: 66px; border-radius: 18px; padding: 10px 14px 10px 10px; display: flex; align-items: center; gap: 12px;
  background: #0f5ed7; color: #fff; box-shadow: var(--shadow); animation: dropIn .3s cubic-bezier(.2, .8, .2, 1);
}
.nav-banner.straight { background: #3a4452; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } }
.nav-arrow { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 13px; background: rgba(255, 255, 255, .16); }
.nav-arrow svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s; }
.nav-text { flex: 1; min-width: 0; }
.nav-dist { font: 800 24px/1.05 var(--font-display); letter-spacing: -0.02em; }
.nav-instr { font-size: 15px; font-weight: 600; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.nav-eta { flex: none; text-align: right; font-size: 12.5px; font-weight: 700; line-height: 1.3; opacity: .92; }
.nav-eta b { display: block; font: 800 17px/1.1 var(--font-display); }

/* Direction chevrons along the route */
.chev i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; display: block; }
.chev i::before { content: ""; position: absolute; inset: 1px; border: solid #fff; border-width: 2.5px 2.5px 0 0; transform: rotate(-45deg) translate(-1px, 1px); opacity: .95; }

/* ---------- Arrival panel ---------- */
.arrival {
  position: fixed; z-index: 700; left: 8px; right: 8px; bottom: calc(var(--safe-bottom) + 8px);
  max-width: 560px; margin: 0 auto; max-height: min(66dvh, 620px); display: flex; flex-direction: column;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  border-radius: 26px; box-shadow: 0 -6px 40px rgba(0, 0, 0, .32); padding: 4px 14px 12px;
  transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .25s;
}
.arrival.entering { animation: arriveIn .38s cubic-bezier(.2, .9, .25, 1.15); }
.arrival.leaving { transform: translateY(110%); opacity: 0; }
@keyframes arriveIn { from { transform: translateY(105%); } }
.arr-grab { display: grid; place-items: center; padding: 6px 0 2px; }
.arr-grab span { width: 38px; height: 5px; border-radius: 3px; background: var(--fg-3); opacity: .45; }
.arr-top { display: flex; align-items: center; gap: 8px; }
.arr-badge { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; color: var(--ok);
  background: color-mix(in srgb, var(--ok) 15%, transparent); padding: 5px 10px; border-radius: 999px; }
.arr-badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }
.arr-badge.manual { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.arr-badge.manual i { background: var(--accent); animation: none; }
.arr-seq { flex: 1; font-size: 13px; color: var(--fg-2); font-weight: 650; }
.arr-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.arr-icon svg { width: 16px; height: 16px; fill: none; stroke: var(--fg-2); stroke-width: 2.4; stroke-linecap: round; }
.arr-mynote { margin: -2px 2px 8px; padding: 8px 10px; border-radius: 12px; background: color-mix(in srgb, #e8a000 16%, transparent); font-weight: 650; font-size: 14.5px; }
.arr-badge.done { color: var(--ok); }
.arr-addr { margin: 8px 2px 8px; font: 800 26px/1.08 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.arr-summary { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.big { height: 32px; font-size: 16px; padding: 0 12px; }
.chip.sm { height: 23px; font-size: 12px; padding: 0 7px; gap: 5px; }
.chip.sm i { width: 8px; height: 8px; }
.arrival .alerts { margin-top: 10px; }
.arr-clients { list-style: none; margin: 10px 0 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 6px; min-height: 0; flex: 1 1 auto; }
.arr-client { display: flex; gap: 11px; align-items: flex-start; padding: 10px 10px; border-radius: 14px; background: var(--solid); transition: background .2s, opacity .2s; }
.arr-client.on { opacity: .55; }
.arr-client.on .arr-name { text-decoration: line-through; }
.arr-client.susp .arr-name { color: var(--fg-3); }
.tick { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2.5px solid var(--hairline); display: grid; place-items: center; background: transparent; }
.tick svg { width: 18px; height: 18px; fill: none; stroke: transparent; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.arr-client.on .tick { background: var(--ok); border-color: var(--ok); }
.arr-client.on .tick svg { stroke: #fff; }
.arr-client-body { flex: 1; min-width: 0; display: grid; gap: 5px; }
.arr-name { font-weight: 750; font-size: 17px; line-height: 1.2; }
.arr-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.arr-note { font-size: 13.5px; color: var(--fg-2); }
.arr-nearby { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--fg-2); font-weight: 600; }
.chip.nearby { color: var(--accent); }
.arr-foot { display: flex; gap: 8px; margin-top: 12px; }
.arr-foot .btn { height: 54px; font-size: 17px; border-radius: 16px; }

/* Stop list */
.search { width: 100%; height: 46px; border-radius: 13px; border: 0; padding: 0 14px; font: inherit; font-size: 16px;
  background: var(--fill); color: var(--fg); margin: 6px 0 10px; -webkit-user-select: text; user-select: text; }
.search:focus { outline: 2px solid var(--accent); }
.paper-left { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.stop-list { margin-top: 10px; }
.stop-row .r-label small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-row.done { opacity: .55; }
.stop-row.skip { opacity: .5; }
.seq.sm { min-width: 34px; height: 34px; font-size: 15px; border-radius: 10px; }
.note-input { width: 100%; border: 0; border-radius: 13px; padding: 12px; font: inherit; font-size: 16px; background: var(--solid); color: var(--fg);
  resize: vertical; -webkit-user-select: text; user-select: text; }
.client.is-skip { opacity: .6; }
.picking #map { cursor: crosshair; }
.picking .cards, .picking .fab-col { opacity: .35; pointer-events: none; }

/* Toggle switch for settings */
.switch { position: relative; width: 50px; height: 30px; flex: none; border-radius: 15px; background: var(--fill); transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(20px); }

/* Round summary */
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat-tile { background: var(--solid); border-radius: 14px; padding: 12px; }
.stat-tile b { display: block; font: 800 24px/1.1 var(--font-display); }
.stat-tile span { font-size: 12.5px; color: var(--fg-2); font-weight: 600; }

@media (min-width: 700px) {
  .card { flex-basis: 380px; }
  .cards { padding: 0 calc(50vw - 190px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<header class="topbar glass" id="topbar">
  <div class="ring" aria-hidden="true">
    <svg viewBox="0 0 36 36"><circle class="ring-track" cx="18" cy="18" r="15.5"/><circle class="ring-fill" id="ringFill" cx="18" cy="18" r="15.5"/></svg>
  </div>
  <div class="topbar-text">
    <div class="topbar-title" id="progressTitle">0 / 0</div>
    <div class="topbar-sub" id="progressSub">—</div>
  </div>
  <button class="icon-btn" id="btnList" aria-label="Stop list">
    <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
  </button>
  <button class="icon-btn" id="btnSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<div class="nav-banner" id="navBanner" hidden aria-live="polite">
  <div class="nav-arrow" id="navArrow"></div>
  <div class="nav-text">
    <div class="nav-dist" id="navDist"></div>
    <div class="nav-instr" id="navInstr"></div>
  </div>
  <div class="nav-eta" id="navEta"></div>
</div>

<div class="gps-banner glass" id="gpsBanner" hidden>
  <span class="dot-pulse"></span><span id="gpsBannerText">Finding GPS…</span>
</div>

<nav class="fab-col" aria-label="Map controls">
  <button class="fab glass" id="btnLayers" aria-label="Map style">
    <svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
  </button>
  <button class="fab glass" id="btnOverview" aria-label="Overview">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="fab glass" id="btnLocate" aria-label="Follow me">
    <svg viewBox="0 0 24 24" class="ico-locate"><path d="M12 2.8 19.5 20 12 16.2 4.5 20Z"/></svg>
  </button>
</nav>

<button class="recenter glass" id="recenter" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 2.8 19.5 20 12 16.2 4.5 20Z"/></svg>Re-centre
</button>

<section class="cards" id="cards" aria-label="Stops"></section>

<section class="arrival" id="arrival" hidden aria-live="polite" aria-label="Current stop"></section>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber" id="sheetGrabber"><span></span></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast glass" id="toast" role="status" hidden>
  <span id="toastText"></span><button id="toastAction" class="toast-action"></button>
</div>

<div class="busy" id="busy" hidden>
  <div class="busy-card glass"><div class="spinner"></div><div id="busyText">Loading…</div>
    <div class="busy-bar"><i id="busyBar"></i></div></div>
</div>

<input type="file" id="csvInput" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls,.ods,.pdf,text/csv,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.oasis.opendocument.spreadsheet" hidden>

const SAMPLE_CSV = "Spoke;Client;Paper;No.;Street;Code / complement;Notes;Status\n1;M EXEMPLE JEAN;L'Est;1;RUE DE DOLE;Code 1234A;;\n1;MME TEST MARIE;Paris Match + L'Est;1;RUE DE DOLE;Appt 12;;\n2;M DEMO PAUL;Le Monde;10;AVENUE GEORGES CLEMENCEAU;;NOT RECEIVED 07/10;\nNEW;MME ESSAI LUCIE;Elle;5;RUE VOIRIN;;avant 7h;\n3;M SUSPENDU ANDRE;L'Est;2;RUE PERCY;;;suspended\n";

<script>/* util.js — small shared helpers (geometry, text, DOM). */
"use strict";

const Util = (() => {
  const EARTH_RADIUS_M = 6371000;
  const DEG = Math.PI / 180;

  function distanceM(latA, lonA, latB, lonB) {
    const dLat = (latB - latA) * DEG;
    const dLon = (lonB - lonA) * DEG;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(latA * DEG) * Math.cos(latB * DEG) * Math.sin(dLon / 2) ** 2;
    return 2 * EARTH_RADIUS_M * Math.asin(Math.sqrt(h));
  }

  /** Initial bearing from A to B in degrees, 0 = north, clockwise. */
  function bearingDeg(latA, lonA, latB, lonB) {
    const y = Math.sin((lonB - lonA) * DEG) * Math.cos(latB * DEG);
    const x = Math.cos(latA * DEG) * Math.sin(latB * DEG) -
      Math.sin(latA * DEG) * Math.cos(latB * DEG) * Math.cos((lonB - lonA) * DEG);
    return (Math.atan2(y, x) / DEG + 360) % 360;
  }

  /** Point reached from `from` after `meters` towards `bearing` (degrees). Good enough for short distances. */
  function destination(from, bearing, meters) {
    const b = bearing * DEG;
    return {
      lat: from.lat + (meters * Math.cos(b)) / 110540,
      lon: from.lon + (meters * Math.sin(b)) / (111320 * Math.cos(from.lat * DEG)),
    };
  }

  /** Shortest signed difference b - a between two angles, in (-180, 180]. */
  function angleDiff(a, b) {
    return ((b - a + 540) % 360) - 180;
  }

  function formatDistance(meters) {
    if (!Number.isFinite(meters)) return "–";
    if (meters < 950) return `${Math.max(5, Math.round(meters / 5) * 5)} m`;
    return `${(meters / 1000).toFixed(meters < 9950 ? 1 : 0)} km`;
  }

  function stripAccents(text) {
    return String(text).normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  /** Canonical key for an address so different spellings match ("AV DU 60E" == "avenue du 60e"). */
  function addressKey(number, street) {
    let s = stripAccents(`${number} ${street}`).toLowerCase();
    s = s.replace(/['’.,]/g, " ");
    s = s.replace(/\bav\b|\bave\b/g, "avenue").replace(/\bbd\b|\bbld\b/g, "boulevard")
      .replace(/\bch\b|\bchem\b/g, "chemin").replace(/\bpl\b/g, "place").replace(/\bpas\b|\bpass\b/g, "passage")
      .replace(/\bregiment d infanterie\b/g, "ri").replace(/\bregiment\b/g, "ri").replace(/\b60eme\b/g, "60e");
    return s.replace(/\s+/g, " ").trim();
  }

  const SMALL_WORDS = new Set(["de", "du", "des", "la", "le", "les", "d", "l", "et", "en"]);
  /** "RUE XAVIER MARMIER" -> "rue Xavier Marmier". */
  function streetCase(text) {
    return String(text).toLowerCase().split(/(\s+|-)/).map((word, i) => {
      if (i === 0 || SMALL_WORDS.has(word) || /^\s+$|^-$/.test(word)) return word;
      if (/^(rue|avenue|boulevard|chemin|place|quai|passage|impasse|allee|allée|route)$/.test(word)) return word;
      return word.charAt(0).toUpperCase() + word.slice(1);
    }).join("");
  }

  /** "MME JEANNE EXEMPLE" -> "Mme Jeanne Exemple". */
  function nameCase(text) {
    return String(text).toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase());
  }

  function escapeHtml(text) {
    return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }

  function $(id) { return document.getElementById(id); }

  function haptic(pattern = 12) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (err) { /* not supported */ }
  }

  function debounce(fn, waitMs) {
    let timer = 0;
    return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), waitMs); };
  }

  return { distanceM, bearingDeg, destination, angleDiff, formatDistance, stripAccents, addressKey, streetCase, nameCase, escapeHtml, $, haptic, debounce };
})();


/* store.js — persistence in localStorage. Every access is guarded: storage can be absent or full. */
"use strict";

const Store = (() => {
  const KEYS = {
    round: "tournee.round.v1",
    progress: "tournee.progress.v1",
    settings: "tournee.settings.v1",
    geocache: "tournee.geocache.v1",
    notes: "tournee.notes.v1",
    pins: "tournee.pins.v1",
  };
  const DEFAULT_SETTINGS = {
    mapStyle: "hybrid", arrivalRadius: 25, voice: false, directions: true, optimiseOrder: false,
    profile: "bike", headingUp: true, includeSkipped: false,
  };

  function read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (err) {
      return fallback;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      console.warn("Storage write failed", key, err);
      return false;
    }
  }

  return {
    loadRound: () => read(KEYS.round, null),
    saveRound: (round) => write(KEYS.round, round),

    /** Progress is keyed by round id so a new import never inherits old ticks. */
    loadProgress(roundId) {
      const all = read(KEYS.progress, {});
      return all[roundId] || { done: {}, history: [] };
    },
    saveProgress(roundId, progress) {
      write(KEYS.progress, { [roundId]: progress });
    },

    loadSettings: () => ({ ...DEFAULT_SETTINGS, ...read(KEYS.settings, {}) }),
    saveSettings: (settings) => write(KEYS.settings, settings),

    /** Your own notes per address ("mailbox behind the gate"), kept across days and imports. */
    loadNotes: () => read(KEYS.notes, {}),
    saveNotes: (notes) => write(KEYS.notes, notes),
    /** Pin positions you corrected by hand, per address; they win over the geocoder forever. */
    loadPins: () => read(KEYS.pins, {}),
    savePins: (pins) => write(KEYS.pins, pins),

    loadGeocache: () => read(KEYS.geocache, {}),
    saveGeocache: (cache) => write(KEYS.geocache, cache),
  };
})();


/* round.js — the round data model: stops, papers, flags and progress. */
"use strict";

const Round = (() => {
  const PAPERS = [
    { key: "monde", label: "Le Monde", test: /monde/i },
    { key: "match", label: "Paris Match", test: /match/i },
    { key: "elle", label: "Elle", test: /\belle\b/i },
    { key: "marianne", label: "Marianne", test: /marianne/i },
    { key: "t7j", label: "Télé 7 Jours", test: /t[ée]l[ée]\s*7|7\s*jours/i },
    { key: "tcs", label: "Télé Câble Sat", test: /c[aâ]ble\s*sat|t[ée]l[ée]\s*c[aâ]ble/i },
    { key: "maxi", label: "Maxi", test: /\bmaxi\b/i },
    { key: "est", label: "L'Est", test: /est\b|republicain|républicain|\bsdl\b/i },
  ];
  const PAPER_BY_KEY = Object.fromEntries(PAPERS.map((p) => [p.key, p]));

  /** "L'Est + Paris Match" -> ["est", "match"]; empty -> ["est"]. */
  function paperKeys(text) {
    const parts = String(text || "").split(/\+|,|\//).map((s) => s.trim()).filter(Boolean);
    const keys = [];
    for (const part of parts) {
      const found = PAPERS.find((p) => p.test.test(part));
      const key = found ? found.key : "est";
      if (!keys.includes(key)) keys.push(key);
    }
    return keys.length ? keys : ["est"];
  }

  function paperLabel(key) { return (PAPER_BY_KEY[key] || PAPER_BY_KEY.est).label; }

  function clientFlags(client) {
    const text = `${client.notes || ""} ${client.code || ""}`;
    return {
      early: /avant\s*7|before\s*7/i.test(text),
      must: /not\s*received|non\s*re[çc]u/i.test(text),
      suspended: /suspend|grey|gris|skip/i.test(client.status || ""),
      isNew: Boolean(client.isNew) || /\bnew\b|nouveau/i.test(text),
      check: /\bcheck\b|v[ée]rifier|\?/i.test(client.notes || ""),
    };
  }

  /** Normalise a stop: display address, per-client paper keys and flags, stop-level flags. */
  function prepareStop(raw) {
    const clients = raw.clients.map((c) => {
      const client = { ...c, papers: paperKeys(c.paper) };
      client.flags = clientFlags(client);
      return client;
    });
    const any = (flag) => clients.some((c) => c.flags[flag]);
    return {
      id: raw.id,
      number: String(raw.number || "").trim(),
      street: Util.streetCase(raw.street || ""),
      lat: raw.lat,
      lon: raw.lon,
      approx: Boolean(raw.approx),
      listIndex: raw.listIndex ?? 0,
      clients,
      flags: { early: any("early"), must: any("must"), suspended: any("suspended"), isNew: any("isNew"), check: any("check"),
        nothingToDeliver: clients.every((c) => c.flags.suspended) },
    };
  }

  function stopAddress(stop) { return `${stop.number} ${stop.street}`.trim(); }

  /** Count papers per type across a list of stops (suspended clients excluded). */
  function paperCounts(stops) {
    const counts = {};
    for (const stop of stops) {
      for (const client of stop.clients) {
        if (client.flags.suspended) continue;
        for (const key of client.papers) counts[key] = (counts[key] || 0) + 1;
      }
    }
    return counts;
  }

  function create({ name, source, start, stops, order }) {
    const prepared = stops.map(prepareStop);
    return {
      id: `r${Date.now().toString(36)}`,
      name,
      source,
      createdAt: new Date().toISOString(),
      start,
      stops: prepared,
      order: order || prepared.map((s) => s.id),
      optimised: false,
    };
  }

  /** Ordered stop objects with their 1-based sequence number. */
  function orderedStops(round) {
    const byId = new Map(round.stops.map((s) => [s.id, s]));
    return round.order.map((id, i) => ({ ...byId.get(id), seq: i + 1 })).filter((s) => s.id);
  }

  /** Riding distance estimate along the order (straight line x detour), from start back to start. */
  function routeLengthM(round, detour = 1.35) {
    const pts = [round.start, ...orderedStops(round), round.start];
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += Util.distanceM(pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon);
    return total * detour;
  }

  return { paperKeys, paperLabel, PAPERS, create, prepareStop, orderedStops, stopAddress, paperCounts, routeLengthM };
})();

/* importer.js — turn a delivery list (CSV, Excel, ODS or PDF) into stops.
   1. Read the file into a table of text cells (format specific).
   2. Find the header row (it may not be the first row) and map columns by name, French or English.
   3. Columns without a recognisable header are guessed from their content (house numbers, streets, city...).
   4. Rows sharing house number + street + city become one stop. */
"use strict";

const Importer = (() => {
  const DEFAULT_CITY = "Besançon";
  const DEFAULT_POSTCODE = "25000";
  const LIBS = {
    xlsx: ["lib/xlsx.full.min.js", "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"],
    pdf: ["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"],

  };

  /* Exact header names (normalised: lower case, no accents, no ° or trailing dot). */
  const HEADER_ALIASES = {
    seq: ["spoke", "ordre", "order", "seq", "sequence", "tournee", "rang", "#", "ordre de passage", "position", "arret", "n arret", "stop"],
    client: ["client", "clients", "nom", "name", "abonne", "abonnes", "destinataire", "nom client", "nom du client", "customer", "nom prenom", "nom et prenom"],
    number: ["no", "n", "num", "numero", "number", "nr", "house number", "house no", "street number", "numero de rue",
      "n de rue", "n rue", "num rue", "numero voie", "n voie", "num voie", "numero de voie", "no rue"],
    street: ["street", "rue", "voie", "adresse", "address", "addr", "street name", "nom de rue", "nom de la rue", "nom de voie",
      "libelle voie", "libelle de voie", "adresse 1", "adresse1", "ligne adresse", "address line 1", "rue / voie"],
    city: ["city", "ville", "commune", "localite", "town"],
    postcode: ["postcode", "cp", "code postal", "zip", "zip code", "postal code"],
    code: ["code / complement", "code/complement", "code", "complement", "digicode", "acces", "code acces", "code porte",
      "complement d adresse", "complement adresse", "adresse 2", "address line 2", "batiment"],
    notes: ["notes", "note", "remarque", "remarques", "commentaire", "commentaires", "comment", "comments", "info", "infos", "observations"],
    paper: ["paper", "papers", "journal", "journaux", "titre", "titres", "publication", "produit", "produits", "magazine"],
    status: ["status", "statut", "etat"],
    lat: ["lat", "latitude"],
    lon: ["lon", "lng", "long", "longitude"],
  };
  const FIELD_LABELS = { client: "Client", number: "House no.", street: "Street", city: "City", postcode: "Postcode",
    code: "Code / complement", notes: "Notes", paper: "Paper", seq: "Order", status: "Status", lat: "Latitude", lon: "Longitude" };

  const STREET_WORDS = /\b(rue|avenue|av|bd|boulevard|chemin|ch|place|pl|quai|passage|impasse|imp|allee|route|rte|square|cours|faubourg|fg|sentier|rond[- ]point|cite|residence|chaussee|promenade|esplanade|voie|montee|ruelle|lotissement)\b/i;
  const NUMBER_RE = /^\d{1,4}\s?(bis|ter|quater|[a-h])?$/i;
  const LEADING_NUMBER_RE = /^(\d{1,4}(?:\s?(?:bis|ter|quater|[a-h]))?)\b[\s,]+(.+)$/i;

  /* ------------------------------------------------------------------ readers */

  function loadScript(urls) {

    return list.reduce((chain, url) => chain.catch(() => new Promise((resolve, reject) => {
      const el = document.createElement("script");

      el.onload = resolve;

  function detectDelimiter(text) {

  }

  /** RFC 4180-style CSV parser (quotes, escaped quotes, newlines inside quotes). */
  function parseCsv(text) {

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === "\"") { if (text[i + 1] === "\"") { field += "\""; i++; } else inQuotes = false; } else field += ch;

  async function readSpreadsheet(buffer) {
    if (!window.XLSX) await loadScript(LIBS.xlsx);

      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, raw: false, defval: "", blankrows: false })
        .map((r) => r.map((c) => String(c ?? "")));

      if (!best || score > best.score) best = { name, rows, score };

    return { rows: best.rows, source: `sheet “${best.name}”` };

  async function readPdf(buffer) {
    if (!window.pdfjsLib) await loadScript(LIBS.pdf);
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const viewport = page.getViewport({ scale: 1 });
      const content = await page.getTextContent();
      const items = content.items.filter((it) => it.str && it.str.trim()).map((it) => ({
        str: it.str, x: it.transform[4], y: viewport.height - it.transform[5],
        w: it.width, h: Math.abs(it.transform[3]) || it.height || 8,

  /**
   * Rebuild table rows from positioned PDF text.
   * pages: [{ items: [{ str, x, y (top-down), w, h }] }]
   * The header line fixes the column start positions. A table row is anchored on the line that holds the client
   * name; wrapped cell text printed just above or below it (vertically centred cells) is attached to the nearest
   * anchor line, so "Code (1234A) - SERVICE DES / ARCHIVES" stays with its client.
   */
  function pdfPagesToRows(pages) {
    const rows = [];
    let anchors = null;
    let headerKey = "";

    for (const page of pages) {
      const lines = [];
      for (const { y, items } of groupLines(page.items)) {
        const chunks = mergeChunks(items);
        const headerScore = chunks.filter((c) => fieldForHeader(c.str)).length;
        if (headerScore >= 3) {
          const key = chunks.map((c) => normaliseHeader(c.str)).join("|");
          if (!anchors || key !== headerKey) {
            anchors = chunks.map((c) => ({ x: c.x, str: c.str.trim() }));
            headerKey = key;
            const fields = anchors.map((a) => fieldForHeader(a.str));
            keyCol = fields.indexOf("client") >= 0 ? fields.indexOf("client") : fields.indexOf("street");
            rows.push(anchors.map((a) => a.str));
          }
          continue;
        }
        if (!anchors) continue; // title, legend… before the table
        if (/\bpage\s*\d+\s*(\/|of|sur)\s*\d+\b/i.test(items.map((it) => it.str).join(" "))) continue; // page footer
        const cells = anchors.map(() => []);
        for (const item of items) {
          let col = 0;
          for (let i = 0; i < anchors.length; i++) if (item.x + 4 >= anchors[i].x) col = i;
          // Right-aligned house numbers ("50D") can start left of the "N°" header: use their right edge.
          const next = anchors[col + 1];
          if (next && NUMBER_RE.test(item.str.trim()) && fieldForHeader(next.str) === "number" && item.x + item.w > next.x) col += 1;

        }

      }
      const groups = keyCol >= 0 ? lines.filter((l) => l.cells[keyCol]).map((l) => ({ y: l.y, lines: [l] })) : [];
      if (!groups.length) { for (const l of lines) rows.push(l.cells); continue; }
      for (const line of lines) {

      for (const g of groups) {

  function groupLines(items) {

    for (const item of sorted) {

      if (line && Math.abs(item.y - line.y) <= tolerance) line.items.push(item);

  /* ------------------------------------------------------------- interpretation */

  function normaliseHeader(text) {

  /** True for cells that are clearly values, not column titles ("RUE DE DOLE", "M JEAN X", "26", long notes). */

    return !/^(nom|libelle|adresse|numero|n)\b/.test(h) && /\b(rue|avenue|boulevard|chemin|quai|place|impasse|allee|route)\s+(de |du |des |d )?[a-z]{3,}/.test(h);
  }

  function fieldForHeader(raw) {

    for (const [field, aliases] of Object.entries(HEADER_ALIASES)) if (aliases.includes(h)) return field;
    if (looksLikeData(h)) return null;

    if (/^code|digicode|complement|batiment/.test(h)) return "code";
    if (/ville|city|commune|localite/.test(h)) return "city";
    if (/rue|street|voie|adresse|address/.test(h)) return "street";
    if (/^note|remarq|comment|observ/.test(h)) return "notes";
    if (/client|abonn|destinataire|^nom\b|name|customer/.test(h)) return "client";

      if (field && columns[field] === undefined) columns[field] = index;
    });

  }

  const CONTENT_TESTS = {
    number: (v) => NUMBER_RE.test(v),
    street: (v) => STREET_WORDS.test(v) && /[a-z]{3}/i.test(v),
    city: (v) => /besan[cç]on/i.test(v),
    postcode: (v) => /^\d{5}$/.test(v),
    client: (v) => /^(m|mme|mlle|mle|mr|mrs|ms|monsieur|madame|dr|ste|sarl|sas)\.?\s+\S/i.test(v),
  };

  /** Guess columns with no recognisable header from what their cells look like. */
  function inferColumns(rows, columns) {
    const width = Math.max(0, ...rows.map((r) => r.length));
    const used = new Set(Object.values(columns));
    const sample = rows.slice(0, 300);
    for (const field of ["street", "number", "client", "postcode", "city"]) {
      if (columns[field] !== undefined) continue;
      let best = { col: -1, ratio: 0 };
      for (let col = 0; col < width; col++) {
        if (used.has(col)) continue;
        const values = sample.map((r) => String(r[col] ?? "").trim()).filter(Boolean);
        if (values.length < Math.min(3, sample.length)) continue;
        const ratio = values.filter(CONTENT_TESTS[field]).length / values.length;
        if (ratio > best.ratio) best = { col, ratio };
      }
      if (best.ratio >= 0.45) { columns[field] = best.col; used.add(best.col); columns[`${field}Guessed`] = true; }
    }
    return columns;
  }

  /** Paper label written after the client's name, e.g. "M PAUL EXEMPLE   Monde". */
  function paperFromName(name) {
    const found = Round.PAPERS.find((p) => p.key !== "est" && p.test.test(name));
    if (!found) return { name, paper: "" };
    const cleaned = name.replace(/\s*(paris\s*match|le\s*monde|monde|elle|marianne)(\s*\+\s*l.est)?\s*$/i, "").trim();
    return { name: cleaned || name, paper: found.label };

  /** "Code 1234+entrée, Appt 12" -> { code: "1234+entrée", appt: "12", extra: "" }. */
  function splitCode(text) {
    let rest = String(text || "").trim();
    const apptMatch = rest.match(/\b(?:appt?|apt|appartement)\.?\s*([0-9]+[a-z]?)/i);
    const appt = apptMatch ? apptMatch[1] : "";
    if (apptMatch) rest = rest.replace(apptMatch[0], "");
    rest = rest.replace(/^[\s,;\-·]+|[\s,;\-·]+$/g, "");
    const codeMatch = rest.match(/\b(?:code|digicode)\s*:?\s*\(?\s*#?\s*(\d{3,6}[a-z]?(?:\s*\+\s*entr[ée]e)?(?:\s*\/\s*\d{3,6}[a-z]?)?)\s*\)?/i);
    if (codeMatch) {
      const extra = [rest.slice(0, codeMatch.index), rest.slice(codeMatch.index + codeMatch[0].length)]
        .map((x) => x.replace(/^[\s,;\-·]+|[\s,;\-·]+$/g, "")).filter(Boolean).join(", ");
      return { code: codeMatch[1].trim(), appt, extra };
    }
    if (/^#?\d{3,5}[A-Z]?$/i.test(rest)) return { code: rest.replace("#", ""), appt, extra: "" };
    return { code: "", appt, extra: rest };
  }

  /** Normalise one row's address parts. Handles a full address in one cell and city/postcode glued to the street. */
  function addressParts(numberCell, streetCell, cityCell, postcodeCell) {
    let number = String(numberCell || "").trim().replace(/^(\d+)\.0+$/, "$1");
    let street = String(streetCell || "").trim();
    let city = String(cityCell || "").trim();
    let postcode = String(postcodeCell || "").trim().replace(/\.0+$/, "");

    // "26 rue X" typed in the number column, street column empty.
    if (!street && LEADING_NUMBER_RE.test(number)) { street = number; number = ""; }
    // City/postcode at the end of the street: "rue X, 25000 Besançon" / "rue X BESANCON".
    const cityMatch = street.match(/[,\s]+(\d{5})?\s*(besan[cç]on)\s*$/i);
    if (cityMatch) { if (!postcode && cityMatch[1]) postcode = cityMatch[1]; if (!city) city = cityMatch[2]; street = street.slice(0, cityMatch.index); }
    const pcMatch = street.match(/[,\s]+(\d{5})\s*$/);
    if (pcMatch) { if (!postcode) postcode = pcMatch[1]; street = street.slice(0, pcMatch.index); }
    // Number at the start of the street when there is no separate number.
    if (!number) {
      const lead = street.match(LEADING_NUMBER_RE);
      if (lead) { number = lead[1]; street = lead[2]; }
    } else if (street.startsWith(`${number} `)) {
      street = street.slice(number.length + 1);
    }
    number = number.replace(/\s+/g, " ").toUpperCase().replace(/^(\d+) ([A-H])$/, "$1$2");
    street = street.replace(/^[,\s]+|[,\s]+$/g, "");
    if (!city || /besan[cç]on/i.test(city)) { city = DEFAULT_CITY; if (!postcode) postcode = DEFAULT_POSTCODE; }

  const SKIP_RE = /^\s*skip\b|ne pas livrer|^\s*suspendu|^\s*suspended|\bgris\b/i;
  const ALSO_RE = /re[çc]oit aussi\s*:[^·]*/gi;

  /** "M PAUL EXEMPLE Monde" -> "M PAUL EXEMPLE" (paper label printed after the name). */
  function stripPaperSuffix(name) {
    return String(name).replace(/\s+(le\s+)?(monde|paris\s*match|elle|marianne|maxi)\s*$/i, "").trim() || name;
  }

  /** Same person on two rows at one address (L'Est + a magazine): one client with both papers. */
  function addClient(stop, client) {
    // Merge only different publications; the same paper twice means two copies (e.g. two departments).
    const same = stop.clients.find((c) => c.name === client.name && (c.status === "skip") === (client.status === "skip") &&
      Round.paperKeys(c.paper).every((k) => !Round.paperKeys(client.paper).includes(k)));
    if (!same) { stop.clients.push(client); return; }
    if (!same.paper.toLowerCase().includes(client.paper.toLowerCase())) same.paper = `${same.paper} + ${client.paper}`;
    same.code = same.code || client.code;
    same.appt = same.appt || client.appt;
    const notes = [same.notes, client.notes].map((n) => n.replace(ALSO_RE, "").replace(/^[\s·]+|[\s·]+$/g, ""));
    same.notes = [...new Set(notes.filter(Boolean))].join(" · ");
    same.isNew = same.isNew || client.isNew;
  }

  /**
   * Interpret a table. Returns { stops, rowCount, problems, columns, headerIndex }.
   * Stops are in list order; each has { id, key, number, street, city, postcode, lat, lon, clients[] }.
   */
  function interpret(rows) {
    const header = findHeader(rows);
    const headerRow = header.index >= 0 ? rows[header.index] : null;
    const dataRows = rows.slice(header.index + 1);
    const columns = inferColumns(dataRows, mapColumns(headerRow));
    if (columns.street === undefined) {
      throw new Error("Couldn't find the street/address column. Check the file has a header like “Street”, “Rue” or “Adresse”.");
    }
    const headerNorm = headerRow ? headerRow.map(normaliseHeader).join("|") : "";
    const cell = (row, field) => (columns[field] === undefined ? "" : String(row[columns[field]] ?? "").replace(/\s+/g, " ").trim());

    const byKey = new Map();
    const problems = [];
    let rowCount = 0;
    let lastClient = null;

    dataRows.forEach((row, i) => {
      if (headerRow && row.map(normaliseHeader).join("|") === headerNorm) return; // header repeated on a new page
      const parts = addressParts(cell(row, "number"), cell(row, "street"), cell(row, "city"), cell(row, "postcode"));
      const rawName = cell(row, "client");

      if (!parts.street || (!rawName && !parts.number && !STREET_WORDS.test(parts.street))) {
        // A wrapped line from a PDF: extra notes or code for the previous client.
        const extra = [cell(row, "code"), cell(row, "notes")].filter(Boolean).join(" ");
        if (lastClient && extra && !rawName) lastClient.notes = `${lastClient.notes} ${extra}`.trim();
        else if (rawName) problems.push(`Row ${header.index + i + 2}: no address for ${rawName}`);
        return;
      }
      rowCount += 1;
      const named = cell(row, "paper") ? { name: stripPaperSuffix(rawName), paper: cell(row, "paper") } : paperFromName(rawName);
      const seqText = cell(row, "seq");
      const codeParts = splitCode(cell(row, "code"));
      const noteParts = splitCode(cell(row, "notes"));
      if (!codeParts.appt && noteParts.appt) codeParts.appt = noteParts.appt;
      const notesText = noteParts.appt ? noteParts.extra : cell(row, "notes");
      const skip = SKIP_RE.test(notesText) || SKIP_RE.test(cell(row, "status")) || row.some((c) => /^[—–-]$/.test(String(c).trim()));
      const client = {
        name: Util.nameCase(named.name || "(no name)"),
        paper: named.paper || "L'Est",
        code: codeParts.code,
        appt: codeParts.appt,
        notes: [codeParts.extra, notesText].filter(Boolean).join(" · "),
        status: skip ? "skip" : cell(row, "status"),
        isNew: /^new$/i.test(seqText) || /\bnew stop\b/i.test(notesText),
      };
      lastClient = client;

      const baseKey = Util.addressKey(parts.number, parts.street);
      const key = parts.city === DEFAULT_CITY ? baseKey : `${baseKey}|${Util.addressKey("", parts.city)}`;
      if (!byKey.has(key)) {
        const lat = parseFloat(cell(row, "lat").replace(",", "."));
        const lon = parseFloat(cell(row, "lon").replace(",", "."));
        byKey.set(key, {
          id: `s${byKey.size + 1}`, key, number: parts.number, street: parts.street, city: parts.city, postcode: parts.postcode,
          lat: Number.isFinite(lat) ? lat : NaN, lon: Number.isFinite(lon) ? lon : NaN,
          approx: false, clients: [], listIndex: byKey.size,
        });
      }
      addClient(byKey.get(key), client);
    });

    if (!byKey.size) throw new Error("No addresses found in the file.");
    const found = Object.keys(FIELD_LABELS).filter((f) => columns[f] !== undefined).map((f) => ({
      field: FIELD_LABELS[f],
      from: headerRow && !columns[`${f}Guessed`] ? String(headerRow[columns[f]]).trim() : "guessed from content",
    }));
    return { stops: [...byKey.values()], rowCount, problems, columns: found, headerIndex: header.index };
  }

  /** Read and interpret a file in one go. */
  async function importFile(file) {
    const table = await readTable(file);
    if (!table.rows.length) throw new Error("The file is empty.");
    return { ...interpret(table.rows), kind: table.kind, source: table.source };
  }

  return { importFile, readTable, interpret, parseCsv, pdfPagesToRows, splitCode, addressParts, fieldForHeader };
})();


/* geocode.js — address -> coordinates with the IGN Géoplateforme geocoder (free, no key),
   cached on the phone so a repeat list needs no network. */
"use strict";

const Geocoder = (() => {
  const ENDPOINT = "https://data.geopf.fr/geocodage/search";
  const CONCURRENCY = 4;
  const GOOD_SCORE = 0.75;

  let cache = Store.loadGeocache();

  function remember(key, entry) {
    cache[key] = entry;
  }

  /** Seed the cache with stops whose coordinates we already know (built-in round). */
  function seed(stops) {
    let added = 0;
    for (const stop of stops) {
      const key = Util.addressKey(stop.number, stop.street);
      if (!cache[key] && Number.isFinite(stop.lat)) { cache[key] = { lat: stop.lat, lon: stop.lon, approx: stop.approx, score: 1 }; added++; }
    }
    if (added) Store.saveGeocache(cache);
  }

  async function query(text, postcode) {
    const params = new URLSearchParams({ q: text, index: "address", limit: "1" });
    if (postcode) params.set("postcode", postcode);
    const response = await fetch(`${ENDPOINT}?${params}`, { headers: { Accept: "application/json" } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    const feature = json.features && json.features[0];
    if (!feature) return null;
    const [lon, lat] = feature.geometry.coordinates;
    return { lat, lon, score: feature.properties.score, type: feature.properties.type, label: feature.properties.label };
  }

  async function locate(stop) {
    const key = stop.key || Util.addressKey(stop.number, stop.street);
    if (cache[key]) return { ...cache[key], cached: true };
    const postcode = stop.postcode || "";
    const place = `${postcode} ${stop.city || "Besançon"}`.trim();
    let hit = await query(`${stop.number} ${stop.street} ${place}`, postcode);
    if (!hit || hit.score < 0.5) {
      const streetOnly = await query(`${stop.street} ${place}`, postcode);
      if (streetOnly) hit = { ...streetOnly, score: Math.min(streetOnly.score, 0.5) };
    }
    if (!hit) return null;
    const entry = { lat: hit.lat, lon: hit.lon, approx: hit.score < GOOD_SCORE || hit.type !== "housenumber", score: hit.score };
    remember(key, entry);
    return entry;
  }

  /**
   * Fill lat/lon on every stop that lacks them. onProgress(done, total).
   * Returns { located, approx, failed: [stops] }.
   */
  async function locateAll(stops, onProgress) {
    const todo = stops.filter((s) => !Number.isFinite(s.lat));
    let done = 0, approx = 0;
    const failed = [];
    let cursor = 0;
    async function worker() {
      while (cursor < todo.length) {
        const stop = todo[cursor++];
        try {
          const found = await locate(stop);
          if (found) { stop.lat = found.lat; stop.lon = found.lon; stop.approx = found.approx; if (found.approx) approx++; }
          else failed.push(stop);
        } catch (err) {
          failed.push(stop);
        }
        done++;
        onProgress(done, todo.length);
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, todo.length) }, worker));
    Store.saveGeocache(cache);
    return { located: todo.length - failed.length, approx, failed };
  }

  return { seed, locateAll };
})();


/* router.js — street routing for a bike, from the FOSSGIS OSRM server (OpenStreetMap data, free, CORS enabled).
   route(): directions through a list of points, with turn steps.
   matrix(): bike travel times between many points, fetched in chunks, used by the optimiser.
   Every call falls back gracefully: callers get `null` (matrix) or a straight-line route (route). */
"use strict";

const Router = (() => {
  const HOST = "https://routing.openstreetmap.de";
  let profile = "bike";               // "bike" or "foot" (FOSSGIS servers: routed-bike / routed-foot)
  const base = () => `${HOST}/routed-${profile}`;
  const ROUTE_TIMEOUT_MS = 9000;
  const TABLE_TIMEOUT_MS = 15000;
  const TABLE_CHUNKS = [100, 40];     // coordinates per table request; smaller retry if the server refuses big ones
  const STRAIGHT_DETOUR = 1.35;
  const BIKE_MS = 15 / 3.6;           // fallback speed when no router

  let enabled = true;                 // user setting: street directions on/off
  let available = true;               // flips off after repeated failures, back on after a while
  let failures = 0;
  let retryAt = 0;

  const coordString = (points) => points.map((p) => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(";");

  async function fetchJson(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const json = await response.json();
      if (json.code !== "Ok") throw new Error(json.message || json.code);
      failures = 0;
      return json;
    } catch (err) {
      failures += 1;
      if (failures >= 3) { available = false; retryAt = Date.now() + 60000; }
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function usable() {
    if (!enabled) return false;
    if (!available && Date.now() > retryAt) { available = true; failures = 0; }
    return available && navigator.onLine !== false;
  }

  /** Straight-line stand-in with the same shape as a real route. */
  function straightRoute(points) {
    const legs = [];
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const distance = Util.distanceM(a.lat, a.lon, b.lat, b.lon) * STRAIGHT_DETOUR;
      legs.push({
        distance, duration: distance / BIKE_MS, coords: [[a.lat, a.lon], [b.lat, b.lon]],
        steps: [{ type: "arrive", modifier: "", name: "", distance: 0, cum: distance, location: [b.lat, b.lon] }],
      });
    }
    return finish(legs, "straight");
  }

  function finish(legs, source) {
    return {
      source, legs,
      distance: legs.reduce((s, l) => s + l.distance, 0),
      duration: legs.reduce((s, l) => s + l.duration, 0),
      createdAt: Date.now(),
    };
  }

  /** Directions through points (first = start). Always resolves. */
  async function route(points) {
    if (points.length < 2) return finish([], "none");
    if (!usable()) return straightRoute(points);
    try {
      const url = `${base()}/route/v1/driving/${coordString(points)}?overview=false&geometries=geojson&steps=true&continue_straight=false`;
      const json = await fetchJson(url, ROUTE_TIMEOUT_MS);
      const legs = json.routes[0].legs.map((leg) => {
        const coords = [];
        const steps = [];
        let cum = 0;
        for (const step of leg.steps) {
          const line = step.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
          if (coords.length && line.length) line.shift();
          coords.push(...line);
          const [lon, lat] = step.maneuver.location;
          steps.push({ type: step.maneuver.type, modifier: step.maneuver.modifier || "", name: step.name || "",
            distance: step.distance, cum, location: [lat, lon], exit: step.maneuver.exit });
          cum += step.distance;
        }
        return { distance: leg.distance, duration: leg.duration, coords, steps };
      });
      return finish(legs, "bike");
    } catch (err) {
      console.warn("Routing failed, using straight lines", err);
      return straightRoute(points);
    }
  }

  /**
   * Bike travel times (s) and distances (m) between all points, or null when the router is unreachable.
   * Returned as flat Float64Arrays of size n*n (row = from, col = to).
   */
  async function matrix(points, onProgress = () => {}) {
    const n = points.length;
    if (n < 2 || !usable()) return null;
    for (const chunk of TABLE_CHUNKS) {
      try {
        return await matrixInChunks(points, chunk, onProgress);
      } catch (err) {
        console.warn(`Travel-time table failed with ${chunk}-point requests`, err);
        failures = 0;
        available = true;
      }
    }
    return null;
  }

  async function matrixInChunks(points, chunk, onProgress) {
    const n = points.length;
    const durations = new Float64Array(n * n);
    const distances = new Float64Array(n * n);
    const half = n <= chunk ? n : Math.floor(chunk / 2);
    const blocks = [];
    for (let i = 0; i < n; i += half) blocks.push([i, Math.min(n, i + half)]);
    const jobs = [];
    for (const src of blocks) for (const dst of blocks) jobs.push([src, dst]);
    let done = 0;
    for (const [[s0, s1], [d0, d1]] of jobs) {
      const same = s0 === d0;
      const pts = same ? points.slice(s0, s1) : [...points.slice(s0, s1), ...points.slice(d0, d1)];
      const srcIdx = Array.from({ length: s1 - s0 }, (_, k) => k);
      const dstIdx = same ? srcIdx : Array.from({ length: d1 - d0 }, (_, k) => s1 - s0 + k);
      const url = `${base()}/table/v1/driving/${coordString(pts)}?annotations=duration,distance` +
        `&sources=${srcIdx.join(";")}&destinations=${dstIdx.join(";")}`;
      const json = await fetchJson(url, TABLE_TIMEOUT_MS);
      for (let a = 0; a < srcIdx.length; a++) {
        for (let b = 0; b < dstIdx.length; b++) {
          const from = s0 + a, to = d0 + b;
          const fallback = Util.distanceM(points[from].lat, points[from].lon, points[to].lat, points[to].lon) * STRAIGHT_DETOUR;
          const dur = json.durations[a][b];
          const dist = json.distances ? json.distances[a][b] : null;
          durations[from * n + to] = Number.isFinite(dur) ? dur : fallback / BIKE_MS;
          distances[from * n + to] = Number.isFinite(dist) ? dist : fallback;
        }
      }
      done += 1;
      onProgress(done, jobs.length);
    }
    return { n, durations, distances };
  }

  return {
    route, matrix, straightRoute,
    setEnabled(on) { enabled = Boolean(on); },
    setProfile(p) { profile = p === "foot" ? "foot" : "bike"; },
    get profile() { return profile; },
    get online() { return usable(); },
  };
})();


/* nav.js — navigation state.
   1. Whole route: real street legs between every consecutive pair of remaining stops (and back to the start),
      fetched in batches and cached on the phone per leg, so the full round is always on the map. Daily rounds
      repeat the same addresses, so after the first day almost nothing is downloaded.
   2. Live leg: from my position to the current stop, with turn steps, re-routed when I leave it.
   3. Progress and snapping: distance/time left, next turn, and the closest point on the live leg. */
"use strict";

const Nav = (() => {
  const STORE_KEY = "tournee.legs.v2";
  const BATCH_POINTS = 25;             // waypoints per routing request
  const MAX_CACHED_LEGS = 900;
  const OFF_ROUTE_M = 30;
  const OFF_ROUTE_FIXES = 2;
  const MIN_REROUTE_MS = 8000;

  let legs = loadLegs();               // key -> { c: [[lat,lon]...], d: metres, t: seconds }
  let liveLeg = null;                  // { targetId, from, leg, source, at }
  let livePending = null;
  let lastLiveRequest = 0;
  let offRouteCount = 0;
  let wholeBusy = false;
  let listeners = { live: () => {}, whole: () => {} };

  function loadLegs() {
    try { return new Map(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (err) { return new Map(); }
  }
  const saveLegs = Util.debounce(() => {
    try {
      const entries = [...legs.entries()];
      localStorage.setItem(STORE_KEY, JSON.stringify(entries.slice(-MAX_CACHED_LEGS)));
    } catch (err) { /* storage full: keep in memory only */ }
  }, 800);

  const pt = (p) => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`;
  const legKey = (a, b) => `${Router.profile}:${pt(a)}>${pt(b)}`;

  function simplify(coords) {
    return coords.map(([la, lo]) => [Math.round(la * 1e5) / 1e5, Math.round(lo * 1e5) / 1e5]);
  }

  /** Legs for consecutive points; missing ones come back as null. */
  function legsFor(points) {
    const out = [];
    for (let i = 1; i < points.length; i++) {
      const hit = legs.get(legKey(points[i - 1], points[i]));
      out.push(hit ? { coords: hit.c, distance: hit.d, duration: hit.t, cached: true } : null);
    }
    return out;
  }

  /** Download every missing leg along the points, in batches of consecutive waypoints. */
  async function ensureWhole(points) {
    if (wholeBusy || points.length < 2 || !Router.online) return;
    wholeBusy = true;
    try {
      let i = 1;
      while (i < points.length) {
        if (legs.has(legKey(points[i - 1], points[i]))) { i++; continue; }
        const startIdx = i - 1;
        let endIdx = i;
        while (endIdx < points.length - 1 && endIdx - startIdx < BATCH_POINTS - 1 && !legs.has(legKey(points[endIdx], points[endIdx + 1]))) endIdx++;
        const batch = points.slice(startIdx, endIdx + 1);
        const route = await Router.route(batch);
        if (route.source !== "bike") break;          // offline or router down: try again later
        route.legs.forEach((leg, k) => {
          legs.set(legKey(batch[k], batch[k + 1]), { c: simplify(leg.coords), d: Math.round(leg.distance), t: Math.round(leg.duration) });
        });
        saveLegs();
        listeners.whole();
        i = endIdx + 1;
      }
    } finally {
      wholeBusy = false;
    }
  }

  /** Closest point on a polyline: { along, offset, lat, lon, bearing } (metres / degrees). */
  function project(coords, lat, lon) {
    const k = Math.cos(lat * Math.PI / 180) * 111320;
    const toXY = ([la, lo]) => [(lo - lon) * k, (la - lat) * 110540];
    let best = { along: 0, offset: Infinity, lat, lon, bearing: NaN };
    let walked = 0;
    for (let i = 1; i < coords.length; i++) {
      const [ax, ay] = toXY(coords[i - 1]);
      const [bx, by] = toXY(coords[i]);
      const dx = bx - ax, dy = by - ay;
      const segLen = Math.hypot(dx, dy);
      const t = segLen ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (segLen * segLen))) : 0;
      const px = ax + t * dx, py = ay + t * dy;
      const offset = Math.hypot(px, py);
      if (offset < best.offset) {
        best = {
          along: walked + t * segLen, offset,
          lat: lat + py / 110540, lon: lon + px / k,
          bearing: segLen > 0.5 ? (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360 : best.bearing,
        };
      }
      walked += segLen;
    }
    return best;
  }

  /**
   * Keep the live leg (me -> target) current. Re-routes when the target changes or when I am off the leg
   * for two fixes in a row. Always resolves; falls back to a straight line when routing is unavailable.
   */
  async function updateLive(me, target, { force = false } = {}) {
    if (!me || !target) { liveLeg = null; listeners.live(); return; }
    const now = Date.now();
    const sameTarget = liveLeg && liveLeg.targetId === target.id;
    if (sameTarget && !force) {
      const pos = project(liveLeg.leg.coords, me.lat, me.lon);
      const tolerance = OFF_ROUTE_M + Math.min(me.accuracy || 0, 40) / 2;
      offRouteCount = pos.offset > tolerance ? offRouteCount + 1 : 0;
      const stale = liveLeg.source !== "bike" && Router.online && now - lastLiveRequest > 20000;
      if (!(offRouteCount >= OFF_ROUTE_FIXES && now - lastLiveRequest > MIN_REROUTE_MS) && !stale) return;
    }
    if (livePending === target.id && !force) return;
    livePending = target.id;
    lastLiveRequest = now;
    offRouteCount = 0;
    if (!sameTarget) {
      // Show something immediately: a straight line until the real route arrives.
      liveLeg = { targetId: target.id, leg: Router.straightRoute([me, target]).legs[0], source: "straight", at: now };
      listeners.live();
    }
    const route = await Router.route([{ lat: me.lat, lon: me.lon }, { lat: target.lat, lon: target.lon }]);
    if (livePending !== target.id) return;
    livePending = null;
    if (route.legs.length) {
      liveLeg = { targetId: target.id, leg: route.legs[0], source: route.source, at: Date.now() };
      listeners.live();
    }
  }

  /** Live progress: distance and time left to the stop, the next manoeuvre, my snapped position. */
  function progress(me) {
    if (!liveLeg || !me) return null;
    const leg = liveLeg.leg;
    const pos = project(leg.coords, me.lat, me.lon);
    const along = Math.min(pos.along, leg.distance);
    const left = Math.max(0, leg.distance - along);
    const timeLeft = leg.distance ? leg.duration * (left / leg.distance) : left / 4.2;
    const next = leg.steps.find((s) => s.type !== "depart" && s.cum > along + 3) || leg.steps[leg.steps.length - 1];
    const toTurn = next ? Math.max(0, next.cum - along) : left;
    return { targetId: liveLeg.targetId, source: liveLeg.source, left, timeLeft, next, toTurn, offset: pos.offset };
  }

  /** The part of the live leg still ahead of me (the ridden part disappears, like car navigation). */
  function remainingCoords(me) {
    if (!liveLeg) return null;
    const coords = liveLeg.leg.coords;
    if (!me || coords.length < 2) return coords;
    const k = Math.cos(me.lat * Math.PI / 180) * 111320;
