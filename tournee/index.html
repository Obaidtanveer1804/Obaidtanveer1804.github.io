            const gain = D(prev, first) + D(last, next) - D(prev, next);
            for (let p = 0; p < t.length - 1; p++) {
              if (p >= i - 1 && p <= i + len - 1) continue;
              const u = t[p], v = t[p + 1];
              const fwd = D(u, first) + D(last, v) - D(u, v);
              const rev = D(u, last) + D(first, v) - D(u, v);
              const add = Math.min(fwd, rev);
              if (add - gain < -1e-7) {
                let seg = t.splice(i, len);
                if (rev < fwd) seg = seg.reverse();
                const insertAt = p < i ? p + 1 : p + 1 - len;
                t.splice(insertAt, 0, ...seg);
                improved = true;
                break outer;
              }
            }
          }
        }
      }
    }

    function localSearch(t) {
      for (;;) {
        const before = tourLength(t);
        twoOpt(t); orOpt(t);
        if (tourLength(t) >= before - 1e-6) return t;
      }
    }

    function doubleBridge(t) {
      const inner = t.slice(1, -1);
      const m = inner.length;
      if (m < 8) return t.slice();
      const cuts = [];
      while (cuts.length < 3) { const c = 1 + Math.floor(rand() * (m - 1)); if (!cuts.includes(c)) cuts.push(c); }
      cuts.sort((a, b) => a - b);
      const [a, b, c] = cuts;
      return [0, ...inner.slice(0, a), ...inner.slice(c), ...inner.slice(b, c), ...inner.slice(a, b), 0];
    }

    const deadline = Date.now() + budgetMs;
    let best = localSearch(nearestNeighbour());
    let bestLen = tourLength(best);
    let current = best.slice(), currentLen = bestLen, sinceRestart = 0;
    while (Date.now() < deadline) {
      const cand = localSearch(doubleBridge(current));
      const candLen = tourLength(cand);
      if (candLen < currentLen - 1e-6) { current = cand; currentLen = candLen; sinceRestart = 0; } else { sinceRestart++; }
      if (currentLen < bestLen - 1e-6) { best = current.slice(); bestLen = currentLen; }
      if (sinceRestart > 400) { current = localSearch(nearestNeighbour()); currentLen = tourLength(current); sinceRestart = 0; }
    }
    return best.slice(1, -1);
  }

  function runInWorker(coords, budgetMs, seed) {
    return new Promise((resolve, reject) => {
      let worker;
      try {
        const source = `${solveTour.toString()}\nonmessage = (e) => postMessage(solveTour(e.data.coords, e.data.budgetMs, e.data.seed));`;
        const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        worker = new Worker(url);
        URL.revokeObjectURL(url);
      } catch (err) {
        reject(err);
        return;
      }
      const timer = setTimeout(() => { worker.terminate(); reject(new Error("worker timeout")); }, budgetMs + 15000);
      worker.onmessage = (e) => { clearTimeout(timer); worker.terminate(); resolve(e.data); };
      worker.onerror = (e) => { clearTimeout(timer); worker.terminate(); reject(e); };
      worker.postMessage({ coords, budgetMs, seed });
    });
  }

  /** Optimise the round's order in place. Stops flagged "before 7:00" are pulled toward the start
      by choosing the travel direction that reaches them sooner. */
  async function optimise(round, budgetMs = 2500) {
    const coords = [round.start, ...round.stops.map((s) => ({ lat: s.lat, lon: s.lon }))];
    let order;
    try {
      order = await runInWorker(coords, budgetMs, 20261016);
    } catch (err) {
      order = solveTour(coords, Math.min(budgetMs, 1200), 20261016);
    }
    let ids = order.map((i) => round.stops[i - 1].id);
    const earlyIds = new Set(round.stops.filter((s) => s.flags.early).map((s) => s.id));
    if (earlyIds.size) {
      const positionSum = (list) => list.reduce((sum, id, i) => sum + (earlyIds.has(id) ? i : 0), 0);
      const reversed = ids.slice().reverse();
      if (positionSum(reversed) < positionSum(ids)) ids = reversed;
    }
    round.order = ids;
    round.optimised = true;
    return round;
  }

  return { optimise, solveTour };
})();


/* csv.js — read a delivery-list CSV (Spoke / Client / No. / Street / Code / Notes / Paper …) into stops.
   Tolerant: ; , or tab separators, quoted fields, French or English headers, Excel's Windows-1252 export. */
"use strict";

const CsvImport = (() => {
  const HEADER_ALIASES = {
    seq: ["spoke", "ordre", "order", "seq", "sequence", "tournee", "rang", "#"],
    client: ["client", "nom", "name", "abonne", "destinataire"],
    number: ["no", "n", "num", "numero", "number", "nr", "no."],
    street: ["street", "rue", "voie", "adresse", "address", "addr"],
    code: ["code / complement", "code/complement", "code", "complement", "digicode", "acces"],
    notes: ["notes", "note", "remarque", "remarques", "commentaire", "commentaires", "comment", "info"],
    paper: ["paper", "journal", "titre", "publication", "produit", "papers"],
    status: ["status", "statut", "etat"],
    lat: ["lat", "latitude"],
    lon: ["lon", "lng", "long", "longitude"],
    postcode: ["postcode", "cp", "code postal", "zip"],
    city: ["city", "ville", "commune"],
  };

  /** Decode file bytes: UTF-8 unless that produces replacement characters, then Windows-1252. */
  async function readFileText(file) {
    const buffer = await file.arrayBuffer();
    const utf8 = new TextDecoder("utf-8").decode(buffer);
    if (!utf8.includes("�")) return utf8.replace(/^﻿/, "");
    return new TextDecoder("windows-1252").decode(buffer);
  }

  function detectDelimiter(firstLine) {
    const counts = [";", ",", "\t"].map((d) => [d, firstLine.split(d).length - 1]);
    counts.sort((a, b) => b[1] - a[1]);
    return counts[0][1] > 0 ? counts[0][0] : ",";
  }

  /** RFC 4180-style parser (quotes, escaped quotes, newlines in quotes). */
  function parse(text) {
    const delimiter = detectDelimiter(text.split(/\r?\n/, 1)[0] || "");
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === "\"") {
          if (text[i + 1] === "\"") { field += "\""; i++; } else inQuotes = false;
        } else field += ch;
      } else if (ch === "\"") inQuotes = true;
      else if (ch === delimiter) { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some((cell) => cell.trim() !== "")) rows.push(row);
        row = [];
      } else field += ch;
    }
    row.push(field);
    if (row.some((cell) => cell.trim() !== "")) rows.push(row);
    return rows;
  }

  function normaliseHeader(text) {
    return Util.stripAccents(text).toLowerCase().replace(/[°º]/g, "").replace(/\s+/g, " ").trim();
  }

  function mapHeaders(headerRow) {
    const columns = {};
    headerRow.forEach((raw, index) => {
      const h = normaliseHeader(raw);
      for (const [field, aliases] of Object.entries(HEADER_ALIASES)) {
        if (columns[field] !== undefined) continue;
        if (aliases.includes(h) || aliases.includes(h.replace(/\.$/, ""))) { columns[field] = index; return; }
      }
    });
    // Looser second pass for headers like "Code / complément d'adresse".
    headerRow.forEach((raw, index) => {
      const h = normaliseHeader(raw);
      if (columns.code === undefined && h.startsWith("code")) columns.code = index;
      if (columns.notes === undefined && h.startsWith("note")) columns.notes = index;
    });
    return columns;
  }

  /** "12 RUE DE DOLE" -> ["12", "RUE DE DOLE"] when there is no separate number column. */
  function splitAddress(text) {
    const match = String(text).trim().match(/^(\d+\s?(?:bis|ter|[a-z])?)\b[\s,]+(.*)$/i);
    return match ? [match[1].replace(/\s+/g, "").toUpperCase(), match[2]] : ["", text];
  }

  /** Paper label written after the client's name, e.g. "M PAUL EXEMPLE   Monde". */
  function paperFromName(name) {
    const found = Round.PAPERS.find((p) => p.key !== "est" && p.test.test(name));
    if (!found) return { name, paper: "" };
    const cleaned = name.replace(new RegExp(`\\s*${found.label.replace(/^Le /, "")}\\s*$`, "i"), "")
      .replace(/\s*(paris match|monde|elle|marianne)\s*$/i, "").trim();
    return { name: cleaned || name, paper: found.label };
  }

  /** "Code 1234+entrée, Appt 12" -> { code: "1234+entrée", appt: "12", extra: "" }. */
  function splitCode(text) {
    let rest = String(text || "").trim();
    const apptMatch = rest.match(/\b(?:appt?|apt|appartement)\.?\s*([0-9]+[a-z]?)/i);
    const appt = apptMatch ? apptMatch[1] : "";
    if (apptMatch) rest = rest.replace(apptMatch[0], "");
    rest = rest.replace(/^[\s,;\-·]+|[\s,;\-·]+$/g, "");
    const codeMatch = rest.match(/\b(?:code|digicode)\s*:?\s*#?\s*(.+)$/i);
    if (codeMatch) {
      const [code, ...after] = codeMatch[1].split(/[,;]/);
      const extra = [rest.slice(0, codeMatch.index), ...after].map((x) => x.replace(/^[\s,;]+|[\s,;]+$/g, "")).filter(Boolean).join(", ");
      return { code: code.trim(), appt, extra };
    }
    if (/^#?\d{3,5}[A-Z]?$/i.test(rest)) return { code: rest.replace("#", ""), appt, extra: "" };
    return { code: "", appt, extra: rest };
  }

  /**
   * Turn CSV text into raw stops (one per building) in list order.
   * Returns { stops, rowCount, problems, defaults: {postcode, city} }.
   */
  function toStops(text) {
    const rows = parse(text);
    if (rows.length < 2) throw new Error("The file has no data rows.");
    const columns = mapHeaders(rows[0]);
    if (columns.street === undefined && columns.client === undefined) {
      throw new Error("Could not find a Street/Rue column. Use the sample CSV headers.");
    }
    const cell = (row, field) => (columns[field] === undefined ? "" : String(row[columns[field]] ?? "").trim());
    const byKey = new Map();
    const problems = [];
    let rowCount = 0;
    let defaults = { postcode: "25000", city: "Besançon" };

    rows.slice(1).forEach((row, i) => {
      let number = cell(row, "number");
      let street = cell(row, "street");
      if (!number && street) [number, street] = splitAddress(street);
      const rawName = cell(row, "client");
      if (!street) { if (rawName) problems.push(`Row ${i + 2}: no street for ${rawName}`); return; }
      rowCount += 1;
      if (cell(row, "postcode")) defaults = { postcode: cell(row, "postcode"), city: cell(row, "city") || defaults.city };

      const named = cell(row, "paper") ? { name: rawName, paper: cell(row, "paper") } : paperFromName(rawName);
      const seqText = cell(row, "seq");
      const codeParts = splitCode(cell(row, "code"));
      const notes = [codeParts.extra, cell(row, "notes")].filter(Boolean).join(" · ");
      const client = {
        name: Util.nameCase(named.name || "(no name)"),
        paper: named.paper || "L'Est",
        code: codeParts.code,
        appt: codeParts.appt,
        notes,
        status: cell(row, "status"),
        isNew: /^new$/i.test(seqText),
      };

      const key = Util.addressKey(number, street);
      if (!byKey.has(key)) {
        const lat = parseFloat(cell(row, "lat").replace(",", "."));
        const lon = parseFloat(cell(row, "lon").replace(",", "."));
        byKey.set(key, {
          id: `s${byKey.size + 1}`, key, number, street,
          lat: Number.isFinite(lat) ? lat : NaN, lon: Number.isFinite(lon) ? lon : NaN,
          approx: false, clients: [], listIndex: byKey.size,
        });
      }
      byKey.get(key).clients.push(client);
    });

    if (!byKey.size) throw new Error("No addresses found in the file.");
    return { stops: [...byKey.values()], rowCount, problems, defaults };
  }

  return { readFileText, parse, toStops, splitCode };
})();


/* geocode.js — address -> coordinates with the IGN Géoplateforme geocoder (free, no key),
   cached on the phone so a repeat list needs no network. */
"use strict";

const Geocoder = (() => {
  const ENDPOINT = "https://data.geopf.fr/geocodage/search";
  const CONCURRENCY = 4;
  const GOOD_SCORE = 0.75;

  let cache = Store.loadGeocache();

  function remember(key, entry) {
    cache[key] = entry;
  }

  /** Seed the cache with stops whose coordinates we already know (built-in round). */
  function seed(stops) {
    let added = 0;
    for (const stop of stops) {
      const key = Util.addressKey(stop.number, stop.street);
      if (!cache[key] && Number.isFinite(stop.lat)) { cache[key] = { lat: stop.lat, lon: stop.lon, approx: stop.approx, score: 1 }; added++; }
    }
    if (added) Store.saveGeocache(cache);
  }

  async function query(text, postcode) {
    const params = new URLSearchParams({ q: text, index: "address", limit: "1" });
    if (postcode) params.set("postcode", postcode);
    const response = await fetch(`${ENDPOINT}?${params}`, { headers: { Accept: "application/json" } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    const feature = json.features && json.features[0];
    if (!feature) return null;
    const [lon, lat] = feature.geometry.coordinates;
    return { lat, lon, score: feature.properties.score, type: feature.properties.type, label: feature.properties.label };
  }

  async function locate(stop, defaults) {
    const key = stop.key || Util.addressKey(stop.number, stop.street);
    if (cache[key]) return { ...cache[key], cached: true };
    const full = `${stop.number} ${stop.street} ${defaults.postcode} ${defaults.city}`;
    let hit = await query(full, defaults.postcode);
    if (!hit || hit.score < 0.5) {
      const streetOnly = await query(`${stop.street} ${defaults.postcode} ${defaults.city}`, defaults.postcode);
      if (streetOnly) hit = { ...streetOnly, score: Math.min(streetOnly.score, 0.5) };
    }
    if (!hit) return null;
    const entry = { lat: hit.lat, lon: hit.lon, approx: hit.score < GOOD_SCORE || hit.type !== "housenumber", score: hit.score };
    remember(key, entry);
    return entry;
  }

  /**
   * Fill lat/lon on every stop that lacks them. onProgress(done, total).
   * Returns { located, approx, failed: [stops] }.
   */
  async function locateAll(stops, defaults, onProgress) {
    const todo = stops.filter((s) => !Number.isFinite(s.lat));
    let done = 0, approx = 0;
    const failed = [];
    let cursor = 0;
    async function worker() {
      while (cursor < todo.length) {
        const stop = todo[cursor++];
        try {
          const found = await locate(stop, defaults);
          if (found) { stop.lat = found.lat; stop.lon = found.lon; stop.approx = found.approx; if (found.approx) approx++; }
          else failed.push(stop);
        } catch (err) {
          failed.push(stop);
        }
        done++;
        onProgress(done, todo.length);
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, todo.length) }, worker));
    Store.saveGeocache(cache);
    return { located: todo.length - failed.length, approx, failed };
  }

  return { seed, locateAll };
})();


/* map.js — Leaflet map: base layers, stop pins, route line, my-position marker, camera helpers. */
"use strict";

const MapView = (() => {
  const IGN_WMTS = "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM" +
    "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&STYLE=normal";
  const IGN_ATTRIB = "© <a href=\"https://geoservices.ign.fr\" target=\"_blank\" rel=\"noopener\">IGN</a>";
  const CARTO_ATTRIB = "© <a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OSM</a> © CARTO";
  const MAX_ZOOM = 21;
  const DONE_SHOWN = 3;

  let map;
  let baseLayers = {};
  let activeLayers = [];
  let pinLayer, routeLayer, approachLine, startMarker, meMarker, meAccuracy;
  let callbacks = { stopTap: () => {}, userPan: () => {}, longPress: () => {} };
  let lastRender = null;

  function makeLayers() {
    const common = { maxZoom: MAX_ZOOM, crossOrigin: true, detectRetina: false, keepBuffer: 4, updateWhenIdle: false };
    const satellite = L.tileLayer(`${IGN_WMTS}&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&FORMAT=image/jpeg`,
      { ...common, maxNativeZoom: 19, attribution: IGN_ATTRIB });
    const plan = L.tileLayer(`${IGN_WMTS}&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&FORMAT=image/png`,
      { ...common, maxNativeZoom: 19, attribution: IGN_ATTRIB });
    const labels = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
      { ...common, maxNativeZoom: 20, subdomains: "abcd", attribution: CARTO_ATTRIB, pane: "labels" });
    return {
      satellite: [satellite],
      hybrid: [satellite, labels],
      plan: [plan],
    };
  }

  function init(element, start) {
    map = L.map(element, {
      zoomControl: false, attributionControl: true, maxZoom: MAX_ZOOM, minZoom: 12,
      zoomSnap: 0.25, wheelPxPerZoomLevel: 90, tap: true, inertia: true, bounceAtZoomLimits: false,
    }).setView([start.lat, start.lon], 17);
    map.attributionControl.setPrefix(false);
    map.attributionControl.setPosition("bottomleft");
    const zoomClass = () => element.classList.toggle("z-near", map.getZoom() >= 17.5);
    map.on("zoomend", zoomClass);
    zoomClass();
    map.createPane("labels").style.zIndex = 450;
    map.getPane("labels").style.pointerEvents = "none";
    map.createPane("route").style.zIndex = 460;
    map.createPane("pins").style.zIndex = 620;
    map.createPane("me").style.zIndex = 640;
    baseLayers = makeLayers();
    routeLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    approachLine = L.polyline([], { pane: "route", color: "#2f8cff", weight: 4, opacity: .95, dashArray: "2 9", lineCap: "round", interactive: false }).addTo(map);

    map.on("dragstart", () => callbacks.userPan());
    map.on("zoomstart", (e) => { if (e && e.originalEvent) callbacks.userPan(); });
    map.on("contextmenu", (e) => callbacks.longPress(e.latlng));
    return map;
  }

  function on(name, fn) { callbacks[name] = fn; }

  function setStyle(style) {
    for (const layer of activeLayers) map.removeLayer(layer);
    activeLayers = baseLayers[style] || baseLayers.hybrid;
    for (const layer of activeLayers) layer.addTo(map);
  }

  /** Pixels hidden by floating UI, used to keep targets in the visible part of the map. */
  function insets() {
    const cards = document.getElementById("cards");
    const bottom = cards && !cards.hidden ? cards.getBoundingClientRect().height + 26 : 30;
    return { top: 84, bottom, left: 18, right: 72 };
  }

  function pinIcon(label, classes) {
    return L.divIcon({ className: `pin ${classes}`, html: `<div class="pin-body">${Util.escapeHtml(label)}</div>`, iconSize: [0, 0] });
  }

  function pinClasses(stop, role, selected) {
    const list = [role];
    if (selected && role !== "next") list.push("selected");
    if (!role.includes("done") && (stop.flags.early || stop.flags.must)) list.push("alert");
    return list.join(" ");
  }

  /**
   * Draw pins and the route line.
   * state: { ordered, doneIds:Set, nextIndex, selectedId, mode: "window"|"all", windowSize, start }
   */
  function render(state) {
    lastRender = state;
    pinLayer.clearLayers();
    routeLayer.clearLayers();
    const { ordered, doneIds, nextIndex, selectedId, mode, windowSize } = state;

    const upcoming = ordered.filter((s) => !doneIds.has(s.id));
    const windowStops = upcoming.slice(0, windowSize);
    const recentDone = ordered.filter((s) => doneIds.has(s.id)).slice(-DONE_SHOWN);
    const visible = new Map();

    if (mode === "all") {
      const all = [state.start, ...ordered, state.start].map((p) => [p.lat, p.lon]);
      L.polyline(all, { pane: "route", color: "#ffffff", weight: 5, opacity: .35, interactive: false }).addTo(routeLayer);
      L.polyline(all, { pane: "route", color: "#2f8cff", weight: 2.5, opacity: .8, interactive: false }).addTo(routeLayer);
      for (const stop of ordered) {
        const role = doneIds.has(stop.id) ? "dot done" : (stop.id === upcoming[0]?.id ? "next" : "dot");
        visible.set(stop.id, role);
      }
    } else {
      for (const stop of recentDone) visible.set(stop.id, "done");
      windowStops.forEach((stop, i) => visible.set(stop.id, i === 0 ? "next" : "upcoming"));
      const chain = windowStops.map((s) => [s.lat, s.lon]);
      if (chain.length > 1) {
        L.polyline(chain, { pane: "route", color: "#ffffff", weight: 8, opacity: .9, lineJoin: "round", interactive: false }).addTo(routeLayer);
        L.polyline(chain, { pane: "route", color: "#2f8cff", weight: 5, opacity: 1, lineJoin: "round", interactive: false }).addTo(routeLayer);
      }
      const selected = ordered.find((s) => s.id === selectedId);
      if (selected && !visible.has(selected.id)) visible.set(selected.id, doneIds.has(selected.id) ? "done" : "upcoming");
    }

    for (const stop of ordered) {
      const role = visible.get(stop.id);
      if (!role) continue;
      const label = role.startsWith("dot") ? String(stop.seq) : (role === "done" ? "✓" : String(stop.seq));
      const marker = L.marker([stop.lat, stop.lon], {
        pane: "pins", icon: pinIcon(label, pinClasses(stop, role, stop.id === selectedId)),
        zIndexOffset: role === "next" ? 1000 : (stop.id === selectedId ? 900 : (role.includes("done") ? -500 : -stop.seq)),
        keyboard: false,
      });
      marker.on("click", () => callbacks.stopTap(stop.id));
      marker.addTo(pinLayer);
    }
    drawStart(state.start);
  }

  function drawStart(start) {
    if (startMarker) startMarker.remove();
    startMarker = L.marker([start.lat, start.lon], { pane: "pins", icon: pinIcon("Start", "start"), zIndexOffset: -900, keyboard: false })
      .addTo(map);
  }

  /** Dashed line from my position to the target stop. */
  function setApproach(from, to) {
    approachLine.setLatLngs(from && to ? [[from.lat, from.lon], [to.lat, to.lon]] : []);
  }

  function meIcon(heading, accuracyPx, stale) {
    const cone = Number.isFinite(heading) ? `<div class="me-cone" style="transform: rotate(${heading}deg) translate(-50%, -50%)"></div>` : "";
    const acc = accuracyPx > 24 ? `<div class="me-acc" style="width:${accuracyPx * 2}px;height:${accuracyPx * 2}px"></div>` : "";
    return L.divIcon({ className: `me${stale ? " stale" : ""}`, html: `${acc}${cone}<div class="me-dot"></div>`, iconSize: [0, 0] });
  }

  function metersToPixels(meters, lat) {
    const metersPerPixel = 40075016.686 * Math.abs(Math.cos(lat * Math.PI / 180)) / Math.pow(2, map.getZoom() + 8);
    return meters / metersPerPixel;
  }

  function setMe(position) {
    if (!position) { if (meMarker) { meMarker.remove(); meMarker = null; } return; }
    const accPx = Math.min(metersToPixels(position.accuracy || 0, position.lat), 220);
    const icon = meIcon(position.heading, accPx, position.stale);
    if (!meMarker) {
      meMarker = L.marker([position.lat, position.lon], { pane: "me", icon, interactive: false, keyboard: false }).addTo(map);
    } else {
      meMarker.setLatLng([position.lat, position.lon]);
      meMarker.setIcon(icon);
    }
  }

  /** Point that places `latlng` in the middle of the visible (un-covered) area at `zoom`. */
  function visibleCenterFor(latlng, zoom) {
    const pad = insets();
    const offset = L.point((pad.left - pad.right) / 2, (pad.top - pad.bottom) / 2);
    const projected = map.project(latlng, zoom).subtract(offset);
    return map.unproject(projected, zoom);
  }

  function focus(point, { zoom, animate = true } = {}) {
    const targetZoom = zoom ?? Math.max(map.getZoom(), 17.5);
    const center = visibleCenterFor(L.latLng(point.lat, point.lon), targetZoom);
    if (animate) map.flyTo(center, targetZoom, { duration: 0.6, easeLinearity: 0.3 });
    else map.setView(center, targetZoom, { animate: false });
  }

  function fit(points, { maxZoom = 18.5, animate = true } = {}) {
    const valid = points.filter((p) => p && Number.isFinite(p.lat));
    if (!valid.length) return;
    if (valid.length === 1) { focus(valid[0], { zoom: Math.min(maxZoom, 18), animate }); return; }
    const pad = insets();
    map.flyToBounds(L.latLngBounds(valid.map((p) => [p.lat, p.lon])), {
      paddingTopLeft: [pad.left + 36, pad.top + 30], paddingBottomRight: [pad.right + 24, pad.bottom + 30],
      maxZoom, duration: animate ? 0.7 : 0.01,
    });
  }

  return { init, on, setStyle, render, setMe, setApproach, focus, fit, get map() { return map; }, get last() { return lastRender; } };
})();


/* location.js — live position with heading fusion and stationary-jitter suppression, plus screen wake lock.
   Heading: GPS course when moving (> MOVING_MS), compass when slow or stopped. */
"use strict";

const LiveLocation = (() => {
  const MOVING_MS = 1.8;           // ~6.5 km/h: above this, GPS course is trustworthy
  const STILL_MS = 0.6;            // below this we treat the bike as stopped
  const STALE_AFTER_MS = 20000;
  const EMIT_INTERVAL_MS = 120;
  const HEADING_SMOOTHING = 0.25;  // 0..1, share of the new reading taken each update

  const state = { lat: NaN, lon: NaN, accuracy: Infinity, speed: 0, heading: NaN, stale: true, ts: 0, hasFix: false };
  let gpsHeading = NaN;
  let compassHeading = NaN;
  let lastRaw = null;
  let onUpdate = () => {};
  let onStatus = () => {};
  let lastEmit = 0;
  let emitTimer = 0;
  let watchId = null;
  let wakeLock = null;

  function screenAngle() {
    const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    return Number(angle) || 0;
  }

  function emit() {
    const now = Date.now();
    const wait = EMIT_INTERVAL_MS - (now - lastEmit);
    if (wait > 0) { if (!emitTimer) emitTimer = setTimeout(() => { emitTimer = 0; emit(); }, wait); return; }
    lastEmit = now;
    state.stale = !state.hasFix || now - state.ts > STALE_AFTER_MS;
    onUpdate({ ...state });
  }

  function blendHeading() {
    const moving = state.speed >= MOVING_MS && Number.isFinite(gpsHeading);
    const target = moving ? gpsHeading : compassHeading;
    if (!Number.isFinite(target)) return;
    if (!Number.isFinite(state.heading)) state.heading = target;
    else state.heading = (state.heading + Util.angleDiff(state.heading, target) * HEADING_SMOOTHING + 360) % 360;
  }

  function handlePosition(pos) {
    const c = pos.coords;
    const speed = Number.isFinite(c.speed) && c.speed !== null ? c.speed : estimateSpeed(c, pos.timestamp);
    const fix = { lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, ts: pos.timestamp };

    if (Number.isFinite(c.heading) && c.heading !== null && speed >= MOVING_MS) gpsHeading = c.heading;
    else if (lastRaw && speed >= MOVING_MS) {
      const moved = Util.distanceM(lastRaw.lat, lastRaw.lon, fix.lat, fix.lon);
      if (moved > 8) gpsHeading = Util.bearingDeg(lastRaw.lat, lastRaw.lon, fix.lat, fix.lon);
    }

    // When stopped, ignore small wanders inside the accuracy circle so the dot does not dance.
    const stillJitter = state.hasFix && speed < STILL_MS &&
      Util.distanceM(state.lat, state.lon, fix.lat, fix.lon) < Math.max(4, fix.accuracy * 0.6);
    if (!stillJitter) { state.lat = fix.lat; state.lon = fix.lon; }
    state.accuracy = fix.accuracy;
    state.speed = speed;
    state.ts = Date.now();
    state.hasFix = true;
    lastRaw = fix;
    blendHeading();
    onStatus({ ok: true, accuracy: fix.accuracy });
    emit();
  }

  function estimateSpeed(coords, timestamp) {
    if (!lastRaw) return 0;
    const dt = (timestamp - lastRaw.ts) / 1000;
    if (dt <= 0.3) return state.speed;
    return Util.distanceM(lastRaw.lat, lastRaw.lon, coords.latitude, coords.longitude) / dt;
  }

  function handleError(err) {
    const messages = {
      1: "Location blocked — allow it in the browser's site settings",
      2: "No GPS signal yet",
      3: "GPS is slow to respond…",
    };
    onStatus({ ok: false, code: err.code, message: messages[err.code] || "Location unavailable" });
  }

  function handleOrientation(event) {
    let heading = NaN;
    if (typeof event.webkitCompassHeading === "number") heading = event.webkitCompassHeading;
    else if (event.absolute && typeof event.alpha === "number") heading = 360 - event.alpha;
    if (!Number.isFinite(heading)) return;
    compassHeading = (heading + screenAngle() + 360) % 360;
    blendHeading();
    if (state.hasFix) emit();
  }

  function startCompass() {
    if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", handleOrientation, true);
    else window.addEventListener("deviceorientation", handleOrientation, true);
  }

  /** iOS needs an explicit permission request from a tap; Android just works. */
  async function enableCompassFromGesture() {
    const Orientation = window.DeviceOrientationEvent;
    if (Orientation && typeof Orientation.requestPermission === "function") {
      try {
        if ((await Orientation.requestPermission()) === "granted") startCompass();
      } catch (err) { /* user declined */ }
    }
  }

  function start(updateHandler, statusHandler) {
    onUpdate = updateHandler;
    onStatus = statusHandler;
    if (!("geolocation" in navigator)) { onStatus({ ok: false, message: "This browser has no location support" }); return; }
    if (!window.isSecureContext) onStatus({ ok: false, message: "GPS needs https:// or localhost (see README)" });
    watchId = navigator.geolocation.watchPosition(handlePosition, handleError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    startCompass();
    setInterval(() => { if (state.hasFix) emit(); }, 5000);
  }

  async function keepScreenOn() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (err) { /* battery saver or unsupported */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepScreenOn(); });

  return { start, enableCompassFromGesture, keepScreenOn, get current() { return { ...state }; }, get watching() { return watchId !== null; } };
})();


/* cards.js — horizontal, snap-scrolling stop cards. Swiping selects a stop; buttons mark it delivered. */
"use strict";

const Cards = (() => {
  const ICON_ARROW = "<svg viewBox=\"0 0 24 24\"><path d=\"M12 2 20 21 12 16.5 4 21Z\"/></svg>";
  const ICON_CHECK = "<svg viewBox=\"0 0 24 24\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/></svg>";
  const ICON_INFO = "<svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/></svg>";
  const ICON_UNDO = "<svg viewBox=\"0 0 24 24\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>";

  let container;
  let handlers = { select: () => {}, open: () => {}, done: () => {}, undo: () => {} };
  let programmaticScroll = false;
  let selectedId = null;

  function chipsFor(stop) {
    const chips = [];
    if (stop.flags.early) chips.push("<span class=\"chip alert\">Before 7:00</span>");
    if (stop.flags.must) chips.push("<span class=\"chip warnc\">Not received yesterday</span>");
    const counts = Round.paperCounts([stop]);
    for (const p of Round.PAPERS.slice().reverse()) {
      if (!counts[p.key]) continue;
      const label = p.key === "est" ? "L'Est" : p.label.replace("Paris ", "");
      chips.push(`<span class="chip"><i class="p-${p.key}"></i>${label}${counts[p.key] > 1 ? ` ×${counts[p.key]}` : ""}</span>`);
    }
    const code = stop.clients.find((c) => c.code);
    if (code) chips.push(`<span class="chip code">#${Util.escapeHtml(code.code)}</span>`);
    if (stop.flags.suspended) chips.push("<span class=\"chip\">Suspended client</span>");
    if (stop.flags.isNew) chips.push("<span class=\"chip okc\">New</span>");
    return chips.join("");
  }

  function whoLine(stop) {
    const names = stop.clients.map((c) => c.name);
    const shown = names.slice(0, 2).join(", ");
    return names.length > 2 ? `${shown} +${names.length - 2}` : shown;
  }

  function cardHtml(stop, isDone, isNext) {
    const foot = isDone
      ? `<button class="btn success grow" data-act="open">${ICON_CHECK}Delivered</button><button class="btn" data-act="undo" aria-label="Mark not delivered">${ICON_UNDO}</button>`
      : `<button class="btn primary grow" data-act="done">${ICON_CHECK}Delivered</button><button class="btn" data-act="open" aria-label="Details">${ICON_INFO}</button>`;
    return `
      <article class="card${isDone ? " is-done" : ""}${isNext ? " is-next" : ""}" data-id="${stop.id}" tabindex="0">
        <div class="card-head" data-act="open">
          <div class="seq">${stop.seq}</div>
          <div class="card-title">
            <div class="addr">${Util.escapeHtml(Round.stopAddress(stop))}</div>
            <div class="who">${Util.escapeHtml(whoLine(stop))}</div>
          </div>
          <div class="dir"><div class="dir-arrow">${ICON_ARROW}</div><div class="dir-dist">–</div></div>
        </div>
        <div class="card-mid" data-act="open">${chipsFor(stop)}</div>
        <div class="card-foot">${foot}</div>
      </article>`;
  }

  function nearestCardId() {
    const mid = container.scrollLeft + container.clientWidth / 2;
    let best = null, bestDist = Infinity;
    for (const card of container.children) {
      const center = card.offsetLeft + card.offsetWidth / 2;
      const d = Math.abs(center - mid);
      if (d < bestDist) { bestDist = d; best = card.dataset.id; }
    }
    return best;
  }

  function init(element, eventHandlers) {
    container = element;
    handlers = { ...handlers, ...eventHandlers };
    const settle = Util.debounce(() => {
      if (programmaticScroll) { programmaticScroll = false; return; }
      const id = nearestCardId();
      if (id && id !== selectedId) { selectedId = id; Util.haptic(6); handlers.select(id); }
    }, 140);
    container.addEventListener("scroll", settle, { passive: true });
    container.addEventListener("click", (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      const action = event.target.closest("[data-act]")?.dataset.act || "open";
      const id = card.dataset.id;
      if (action === "done") handlers.done(id);
      else if (action === "undo") handlers.undo(id);
      else handlers.open(id);
    });
    container.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.classList.contains("card")) handlers.open(event.target.dataset.id);
    });
  }

  function render(ordered, doneIds, nextId) {
    container.innerHTML = ordered.map((s) => cardHtml(s, doneIds.has(s.id), s.id === nextId)).join("");
  }

  function scrollTo(id, smooth = true) {
    const card = container.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!card) return;
    selectedId = id;
    const left = card.offsetLeft - (container.clientWidth - card.offsetWidth) / 2;
    if (Math.abs(container.scrollLeft - left) < 2) return;
    programmaticScroll = true;
    container.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
  }

  /** Update distance + arrow on the cards near the current one (cheap, runs on every GPS tick). */
  function updateDirections(me, byId) {
    if (!me || !Number.isFinite(me.lat)) return;
    const cards = [...container.children];
    const index = cards.findIndex((c) => c.dataset.id === selectedId);
    const from = Math.max(0, index - 2), to = Math.min(cards.length, index + 4);
    for (const card of cards.slice(from, to)) {
      const stop = byId.get(card.dataset.id);
      if (!stop) continue;
      const meters = Util.distanceM(me.lat, me.lon, stop.lat, stop.lon) * 1.25;
      const bearing = Util.bearingDeg(me.lat, me.lon, stop.lat, stop.lon);
      const relative = Number.isFinite(me.heading) ? bearing - me.heading : bearing;
      card.querySelector(".dir-dist").textContent = Util.formatDistance(meters);
      card.querySelector(".dir-arrow svg").style.transform = `rotate(${relative}deg)`;
    }
  }

  return { init, render, scrollTo, updateDirections, get selectedId() { return selectedId; } };
})();


/* sheets.js — bottom sheet host (open/close, drag-to-dismiss) and the toast. */
"use strict";

const Sheet = (() => {
  let sheet, body, scrim, grabber;
  let onClose = null;
  let dragStartY = null;
  let dragDelta = 0;

  function init() {
    sheet = Util.$("sheet");
    body = Util.$("sheetBody");
    scrim = Util.$("scrim");
    grabber = Util.$("sheetGrabber");
    scrim.addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheet.hidden) close(); });

    const startDrag = (y) => { dragStartY = y; dragDelta = 0; sheet.style.transition = "none"; };
    const moveDrag = (y) => {
      if (dragStartY === null) return;
      dragDelta = Math.max(0, y - dragStartY);
      sheet.style.transform = `translateY(${dragDelta}px)`;
    };
    const endDrag = () => {
      if (dragStartY === null) return;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (dragDelta > 90) close();
      dragStartY = null;
    };
    grabber.addEventListener("pointerdown", (e) => { grabber.setPointerCapture(e.pointerId); startDrag(e.clientY); });
    grabber.addEventListener("pointermove", (e) => moveDrag(e.clientY));
    grabber.addEventListener("pointerup", endDrag);
    grabber.addEventListener("pointercancel", endDrag);
    // Pull down from the top of the scrolled content also dismisses.
    body.addEventListener("touchstart", (e) => { if (body.scrollTop <= 0) startDrag(e.touches[0].clientY); }, { passive: true });
    body.addEventListener("touchmove", (e) => { if (dragStartY !== null && body.scrollTop <= 0) moveDrag(e.touches[0].clientY); }, { passive: true });
    body.addEventListener("touchend", endDrag);
  }

  function open(html, { onClose: closeHandler, label } = {}) {
    body.innerHTML = html;
    body.scrollTop = 0;
    onClose = closeHandler || null;
    sheet.setAttribute("aria-label", label || "Details");
    scrim.hidden = false;
    sheet.hidden = false;
    sheet.classList.remove("closing");
    sheet.classList.add("opening");
    setTimeout(() => sheet.classList.remove("opening"), 320);
    return body;
  }

  function close() {
    if (sheet.hidden) return;
    sheet.classList.add("closing");
    scrim.hidden = true;
    setTimeout(() => { sheet.hidden = true; sheet.classList.remove("closing"); body.innerHTML = ""; }, 260);
    const handler = onClose;
    onClose = null;
    if (handler) handler();
  }

  return { init, open, close, get isOpen() { return !sheet.hidden; }, get body() { return body; } };
})();

const Toast = (() => {
  let timer = 0;
  function show(text, actionLabel, action, ms = 4500) {
    const el = Util.$("toast");
    const button = Util.$("toastAction");
    Util.$("toastText").textContent = text;
    button.textContent = actionLabel || "";
    button.onclick = () => { hide(); if (action) action(); };
    el.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(hide, ms);
  }
  function hide() { Util.$("toast").hidden = true; }
  return { show, hide };
})();

const Busy = (() => {
  function show(text, fraction) {
    Util.$("busy").hidden = false;
    Util.$("busyText").textContent = text;
    Util.$("busyBar").parentElement.hidden = fraction === undefined;
    if (fraction !== undefined) Util.$("busyBar").style.width = `${Math.round(fraction * 100)}%`;
  }
  function hide() { Util.$("busy").hidden = true; }
  return { show, hide };
})();


/* main.js — app controller: state, wiring between map, cards, sheets, location and import. */
"use strict";

const App = (() => {
  const DEFAULT_START = { label: "Lidl · av. du 60e RI", lat: 47.2409, lon: 6.0060 };
  const FOLLOW_REFRAME_MS = 1500;
  const ICONS = {
    nav: "<svg viewBox=\"0 0 24 24\"><path d=\"M3 11 21 3l-8 18-2-8-8-2Z\"/></svg>",
    check: "<svg viewBox=\"0 0 24 24\"><path d=\"m5 12.5 4.5 4.5L19 7.5\"/></svg>",
    undo: "<svg viewBox=\"0 0 24 24\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>",
    close: "<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>",
  };

  const state = {
    round: null,
    ordered: [],
    byId: new Map(),
    progress: { done: {}, history: [] },
    settings: Store.loadSettings(),
    selectedId: null,
    mode: "window",
    follow: false,
    me: null,
    lastReframe: 0,
  };

  /* ---------- derived state ---------- */
  const doneIds = () => new Set(Object.keys(state.progress.done));
  const nextStop = () => { const d = doneIds(); return state.ordered.find((s) => !d.has(s.id)) || null; };

  function rebuildOrder() {
    state.ordered = Round.orderedStops(state.round);
    state.byId = new Map(state.ordered.map((s) => [s.id, s]));
  }

  function persist() {
    Store.saveRound(state.round);
    Store.saveProgress(state.round.id, state.progress);
  }

  /* ---------- rendering ---------- */
  function renderProgress() {
    if (!state.round) return;
    const done = doneIds();
    const total = state.ordered.length;
    const count = state.ordered.filter((s) => done.has(s.id)).length;
    const remaining = state.ordered.filter((s) => !done.has(s.id));
    let meters = 0;
    let prev = state.me && Number.isFinite(state.me.lat) ? state.me : (remaining.length ? remaining[0] : state.round.start);
    for (const stop of remaining) { meters += Util.distanceM(prev.lat, prev.lon, stop.lat, stop.lon); prev = stop; }
    meters += Util.distanceM(prev.lat, prev.lon, state.round.start.lat, state.round.start.lon);
    meters *= 1.35;
    Util.$("progressTitle").textContent = count === total && total ? "Round complete" : `${count} of ${total} stops`;
    const clientsLeft = remaining.reduce((n, s) => n + s.clients.length, 0);
    Util.$("progressSub").textContent = count === total ? "Head back to start" : `${Util.formatDistance(meters)} left · ${clientsLeft} clients`;
    Util.$("ringFill").style.strokeDashoffset = String(97.4 * (1 - (total ? count / total : 0)));
  }

  function renderMap() {
    if (!state.round) return;
    MapView.render({
      ordered: state.ordered, doneIds: doneIds(), selectedId: state.selectedId, mode: state.mode,
      windowSize: state.settings.windowSize, start: state.round.start,
    });
    updateApproach();
  }

  function updateApproach() {
    const target = state.byId.get(state.selectedId) || nextStop();
    const me = state.me && !state.me.stale ? state.me : null;
    MapView.setApproach(me, target && !doneIds().has(target.id) ? target : null);
  }

  function renderAll({ scrollCards = true } = {}) {
    const next = nextStop();
    Cards.render(state.ordered, doneIds(), next?.id);
    if (!state.selectedId || !state.byId.has(state.selectedId)) state.selectedId = next?.id || state.ordered[0]?.id || null;
    if (scrollCards && state.selectedId) requestAnimationFrame(() => Cards.scrollTo(state.selectedId, false));
    renderProgress();
    renderMap();
    if (state.me) Cards.updateDirections(state.me, state.byId);
  }

  /* ---------- selection & camera ---------- */
  function setFollow(on) {
    state.follow = on;
    Util.$("btnLocate").classList.toggle("on", on);
    if (on) { state.mode = "window"; Util.$("btnOverview").classList.remove("on"); reframeFollow(true); renderMap(); }
  }

  /** Follow mode keeps both me and the next stop on screen. */
  function reframeFollow(force = false) {
    if (!state.follow || !state.me || state.me.stale) return;
    const now = Date.now();
    if (!force && now - state.lastReframe < FOLLOW_REFRAME_MS) return;
    state.lastReframe = now;
    const next = nextStop();
    if (next && Util.distanceM(state.me.lat, state.me.lon, next.lat, next.lon) < 600) MapView.fit([state.me, next], { maxZoom: 19 });
    else MapView.focus(state.me, { zoom: 17.5 });
  }

  function selectStop(id, { fly = true, fromCards = false } = {}) {
    if (!state.byId.has(id)) return;
    state.selectedId = id;
    if (fly) { setFollow(false); MapView.focus(state.byId.get(id), { zoom: Math.max(MapView.map.getZoom(), 18) }); }
    if (!fromCards) Cards.scrollTo(id);
    renderMap();
    if (state.me) Cards.updateDirections(state.me, state.byId);
  }

  function showNext({ fly = true } = {}) {
    const next = nextStop();
    if (!next) return;
    state.selectedId = next.id;
    Cards.scrollTo(next.id);
    if (state.follow) reframeFollow(true);
    else if (fly) MapView.focus(next, { zoom: Math.max(MapView.map.getZoom(), 18) });
  }

  /* ---------- delivery actions ---------- */
  function markDone(id) {
    if (state.progress.done[id]) return;
    state.progress.done[id] = Date.now();
    state.progress.history.push(id);
    persist();
    Util.haptic([14, 40, 14]);
    const stop = state.byId.get(id);
    if (Sheet.isOpen) Sheet.close();
    state.selectedId = null;
    renderAll({ scrollCards: false });
    showNext();
    const next = nextStop();
    Toast.show(next ? `Stop ${stop.seq} delivered · next ${next.seq}` : "Last stop delivered 🎉", "Undo", () => undoDone(id));
  }

  function undoDone(id) {
    const target = id || state.progress.history[state.progress.history.length - 1];
    if (!target || !state.progress.done[target]) return;
    delete state.progress.done[target];
    state.progress.history = state.progress.history.filter((x) => x !== target);
    persist();
    state.selectedId = target;
    if (Sheet.isOpen) Sheet.close();
    renderAll({ scrollCards: false });
    selectStop(target);
    Toast.show(`Stop ${state.byId.get(target).seq} back to do`);
  }

  /* ---------- detail sheet ---------- */
  function navigateUrl(stop) {
    return `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lon}&travelmode=bicycling`;
  }

  function clientHtml(client) {
    const papers = client.papers.map((k) => `<span class="chip"><i class="p-${k}"></i>${Round.paperLabel(k)}</span>`).join("");
    const meta = [
      papers,
      client.code ? `<span class="chip code">Code <span class="code-big">${Util.escapeHtml(client.code)}</span></span>` : "",
      client.appt ? `<span class="chip">Appt ${Util.escapeHtml(client.appt)}</span>` : "",
      client.flags.suspended ? "<span class=\"chip\">Suspended</span>" : "",
      client.flags.isNew ? "<span class=\"chip okc\">New</span>" : "",
      client.flags.must ? "<span class=\"chip warnc\">Not received</span>" : "",
      client.flags.early ? "<span class=\"chip alert\">Before 7:00</span>" : "",
    ].join("");
    const bar = `p-${client.papers[0]}`;
    return `
      <div class="client">
        <div class="client-top"><span class="paper-bar ${bar}"></span>
          <span class="client-name${client.flags.suspended ? " suspended" : ""}">${Util.escapeHtml(client.name)}</span></div>
        <div class="client-meta">${meta}</div>
        ${client.notes ? `<div class="client-note">${Util.escapeHtml(client.notes)}</div>` : ""}
      </div>`;
  }

  function openStop(id) {
    const stop = state.byId.get(id);
    if (!stop) return;
    selectStop(id, { fly: true });
    const isDone = doneIds().has(id);
    const me = state.me && !state.me.stale ? state.me : null;
    const distance = me ? Util.formatDistance(Util.distanceM(me.lat, me.lon, stop.lat, stop.lon) * 1.25) : "";
    const alerts = [
      stop.flags.early ? "<div class=\"alert-row crit\">⏰ Deliver before 7:00</div>" : "",
      stop.flags.must ? "<div class=\"alert-row warn\">⚠️ Reported not received yesterday — make sure it's delivered</div>" : "",
      stop.flags.suspended ? "<div class=\"alert-row info\">A client here is marked suspended — check before delivering</div>" : "",
      stop.approx ? "<div class=\"alert-row info\">📍 Pin position is approximate — long-press the map to report the right spot later</div>" : "",
    ].join("");
    const waiting = state.ordered.filter((s) => !doneIds().has(s.id) && s.seq < stop.seq).length;
    const html = `
      <div class="sh-head">
        <div class="seq" style="${isDone ? "background:var(--ok);color:#fff" : (stop.id === nextStop()?.id ? "background:var(--accent);color:#fff" : "")}">${stop.seq}</div>
        <div class="sh-title">
          <h2 id="sheetTitle">${Util.escapeHtml(Round.stopAddress(stop))}</h2>
          <p>${stop.clients.length} client${stop.clients.length > 1 ? "s" : ""}${distance ? ` · ${distance} away` : ""}${!isDone && waiting ? ` · ${waiting} stop${waiting > 1 ? "s" : ""} before this` : ""}</p>
        </div>
        <button class="close-x" data-act="close" aria-label="Close">${ICONS.close}</button>
      </div>
      ${alerts ? `<div class="alerts">${alerts}</div>` : ""}
      <div class="sh-actions">
        ${isDone
          ? `<button class="btn" data-act="undo">${ICONS.undo}Not delivered</button>`
          : `<button class="btn success" data-act="done">${ICONS.check}Delivered</button>`}
        <a class="btn" href="${navigateUrl(stop)}" target="_blank" rel="noopener">${ICONS.nav}Navigate</a>
      </div>
      <div class="group-label">Papers to leave</div>
      <div class="list">${stop.clients.map(clientHtml).join("")}</div>`;
    const body = Sheet.open(html, { label: Round.stopAddress(stop) });
    body.querySelector("[data-act=close]").onclick = Sheet.close;
    const doneBtn = body.querySelector("[data-act=done]");
    if (doneBtn) doneBtn.onclick = () => markDone(id);
    const undoBtn = body.querySelector("[data-act=undo]");
    if (undoBtn) undoBtn.onclick = () => undoDone(id);
  }

  /* ---------- map style ---------- */
  function applyStyle(style) {
    state.settings.mapStyle = style;
    Store.saveSettings(state.settings);
    MapView.setStyle(style);
  }

  function openLayers() {
    const opts = [["satellite", "Satellite", "sw-sat"], ["hybrid", "Satellite + streets", "sw-hyb"], ["plan", "Street map", "sw-plan"]];
    const html = `
      <div class="settings"><h2>Map style</h2>
        <div class="layer-grid">${opts.map(([key, label, sw]) =>
          `<button class="layer-opt${state.settings.mapStyle === key ? " on" : ""}" data-style="${key}"><span class="layer-swatch ${sw}"></span>${label}</button>`).join("")}
        </div>
        <p class="foot-note">Imagery and street map: IGN (French national mapping agency). Street names: OpenStreetMap / CARTO.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Map style" });
    body.querySelectorAll("[data-style]").forEach((btn) => {
      btn.onclick = () => { applyStyle(btn.dataset.style); Sheet.close(); };
    });
  }

  /* ---------- settings ---------- */
  function paperSummaryHtml() {
    const counts = Round.paperCounts(state.ordered);
    return Round.PAPERS.slice().reverse().filter((p) => counts[p.key])
      .map((p) => `<span class="chip"><i class="p-${p.key}"></i>${p.label} × ${counts[p.key]}</span>`).join(" ");
  }

  function openSettings() {
    if (!state.round) { openWelcomeSheet(); return; }
    const r = state.round;
    const clients = state.ordered.reduce((n, s) => n + s.clients.length, 0);
    const html = `
      <div class="settings">
        <h2>Round</h2>
        <div class="list">
          <div class="row"><span class="r-label">${Util.escapeHtml(r.name)}<small>${state.ordered.length} stops · ${clients} clients · ≈ ${Util.formatDistance(Round.routeLengthM(r))} loop</small></span></div>
          <div class="row"><span class="r-label">Papers to take<small style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${paperSummaryHtml()}</small></span></div>
        </div>

        <div class="group-label">Import</div>
        <div class="list">
          <button class="row" data-act="import"><span class="r-label">Import a CSV list<small>Same columns as your delivery sheet. Addresses are found automatically.</small></span><span class="r-value">›</span></button>
          <button class="row" data-act="sample"><span class="r-label">Download sample CSV<small>Today's list in the expected format</small></span><span class="r-value">↓</span></button>
        </div>

        <div class="group-label">Route order</div>
        <div class="list">
          <button class="row" data-act="optimise"><span class="r-label">Optimise route<small>Shortest loop from the start point, done stops kept</small></span><span class="r-value">${r.optimised ? "On" : "Off"}</span></button>
          <button class="row" data-act="listorder"><span class="r-label">Use the list's own order<small>As written in the CSV (Spoke order)</small></span><span class="r-value">${r.optimised ? "" : "On"}</span></button>
        </div>

        <div class="group-label">Start &amp; finish</div>
        <div class="list">
          <div class="row"><span class="r-label">${Util.escapeHtml(r.start.label)}<small>Long-press anywhere on the map to move it</small></span></div>
          <button class="row" data-act="startHere"><span class="r-label">Use my current position</span><span class="r-value">⌖</span></button>
        </div>

        <div class="group-label">Stops shown on the map</div>
        <div class="seg" role="group" aria-label="Stops shown">${[5, 8, 12].map((n) =>
          `<button data-window="${n}" class="${state.settings.windowSize === n ? "on" : ""}">Next ${n}</button>`).join("")}</div>

        <div class="group-label">Map style</div>
        <div class="seg" role="group" aria-label="Map style">${[["satellite", "Satellite"], ["hybrid", "Hybrid"], ["plan", "Plan"]].map(([k, l]) =>
          `<button data-style="${k}" class="${state.settings.mapStyle === k ? "on" : ""}">${l}</button>`).join("")}</div>

        <div class="group-label">Today</div>
        <div class="list" id="resetBox">
          <button class="row danger" data-act="reset"><span class="r-label">Start a new day<small>Clears every “delivered” tick</small></span></button>
          ${BUILTIN_ROUND ? "<button class=\"row\" data-act=\"builtin\"><span class=\"r-label\">Load the built-in Butte round</span><span class=\"r-value\">›</span></button>" : ""}
        </div>
        <p class="foot-note">Distances are straight-line × 1.35 estimates. Your ticks and imported lists stay on this phone.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Settings" });
    const on = (act, fn) => { const el = body.querySelector(`[data-act=${act}]`); if (el) el.onclick = fn; };
    on("import", () => { Sheet.close(); Util.$("csvInput").click(); });
    on("sample", downloadSample);
    on("optimise", async () => { Sheet.close(); await reoptimise(true); });
    on("listorder", () => { Sheet.close(); useListOrder(); });
    on("startHere", () => {
      if (!state.me || state.me.stale) { Toast.show("No GPS fix yet"); return; }
      Sheet.close(); setStart({ lat: state.me.lat, lon: state.me.lon }, "My position");
    });
    on("reset", () => {
      const box = body.querySelector("#resetBox");
      box.innerHTML = `<div class="row"><span class="r-label">Clear all ticks for this round?</span></div>
        <div class="row" style="gap:8px"><button class="btn danger grow" data-act="confirmReset">Clear ticks</button><button class="btn grow" data-act="cancelReset">Cancel</button></div>`;
      box.querySelector("[data-act=confirmReset]").onclick = () => {
        state.progress = { done: {}, history: [] }; persist(); Sheet.close(); state.selectedId = null; renderAll(); showNext();
        Toast.show("New day started");
      };
      box.querySelector("[data-act=cancelReset]").onclick = openSettings;
    });
    on("builtin", async () => { Sheet.close(); await loadBuiltin(); });
    body.querySelectorAll("[data-window]").forEach((b) => {
      b.onclick = () => { state.settings.windowSize = Number(b.dataset.window); Store.saveSettings(state.settings); renderMap(); openSettings(); };
    });
    body.querySelectorAll("[data-style]").forEach((b) => { b.onclick = () => { applyStyle(b.dataset.style); openSettings(); }; });
  }

  function downloadSample() {
    const blob = new Blob(["﻿" + SAMPLE_CSV], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tournee_sample.csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* ---------- route order ---------- */
  async function reoptimise(keepDone) {
    Busy.show("Optimising route…");
    try {
      const done = doneIds();
      const doneOrder = keepDone ? state.round.order.filter((id) => done.has(id)) : [];
      const remaining = state.round.stops.filter((s) => !doneOrder.includes(s.id));
      const sub = { ...state.round, stops: remaining };
      const startPoint = keepDone && doneOrder.length && state.me && !state.me.stale ? state.me : state.round.start;
      await Optimizer.optimise({ ...sub, start: startPoint, order: [] }).then((r) => { state.round.order = [...doneOrder, ...r.order]; });
      state.round.optimised = true;
      rebuildOrder(); persist();
      state.selectedId = null;
      renderAll(); showNext();
      Toast.show(`Route optimised · ≈ ${Util.formatDistance(Round.routeLengthM(state.round))} loop`);
    } finally {
      Busy.hide();
    }
  }

  function useListOrder() {
    const listed = state.round.stops.slice().sort((a, b) => (a.listIndex ?? 0) - (b.listIndex ?? 0));
    state.round.order = listed.map((s) => s.id);
    state.round.optimised = false;
    rebuildOrder(); persist(); state.selectedId = null; renderAll(); showNext();
    Toast.show(`List order · ≈ ${Util.formatDistance(Round.routeLengthM(state.round))} loop`);
  }

  function setStart(latlng, label) {
    state.round.start = { lat: latlng.lat, lon: latlng.lon ?? latlng.lng, label };
    persist(); renderMap();
    Toast.show("Start point moved", "Re-optimise", () => reoptimise(true), 7000);
  }

  function askStartHere(latlng) {
    const html = `
      <div class="settings"><h2>Move start point here?</h2>
        <p class="foot-note" style="margin:6px 0 14px">The round will begin and end at this spot (e.g. the Lidl entrance / Ginko stop).</p>
        <div class="sh-actions" style="margin-top:0"><button class="btn primary" data-act="yes">Set start here</button><button class="btn" data-act="no">Cancel</button></div>
      </div>`;
    const body = Sheet.open(html, { label: "Start point" });
    body.querySelector("[data-act=yes]").onclick = () => { Sheet.close(); setStart({ lat: latlng.lat, lon: latlng.lng }, "Custom start"); };
    body.querySelector("[data-act=no]").onclick = Sheet.close;
  }

  /* ---------- first run (no round yet) ---------- */
  function showWelcome() {
    Util.$("progressTitle").textContent = "No round loaded";
    Util.$("progressSub").textContent = "Import your delivery list to start";
    Util.$("cards").innerHTML = `
      <article class="card is-next" style="flex-basis:min(92vw,440px)">
        <div class="card-head"><div class="card-title">
          <div class="addr">Import your list</div>
          <div class="who">CSV from your delivery sheet. It stays on this phone.</div></div></div>
        <div class="card-mid"><span class="chip">Client</span><span class="chip">No.</span><span class="chip">Street</span><span class="chip">Code</span><span class="chip">Paper</span></div>
        <div class="card-foot"><button class="btn primary grow" id="welcomeImport">Import CSV</button><button class="btn" id="welcomeSample">Sample</button></div>
      </article>`;
    Util.$("welcomeImport").onclick = () => Util.$("csvInput").click();
    Util.$("welcomeSample").onclick = downloadSample;
  }

  function openWelcomeSheet() {
    const html = `
      <div class="settings"><h2>Get started</h2>
        <div class="list">
          <button class="row" data-act="import"><span class="r-label">Import a CSV list<small>Same columns as your delivery sheet. Addresses are found automatically (needs internet once).</small></span><span class="r-value">›</span></button>
          <button class="row" data-act="sample"><span class="r-label">Download sample CSV<small>Shows the expected columns</small></span><span class="r-value">↓</span></button>
        </div>
        <p class="foot-note">Your list, ticks and address cache are stored only in this browser on this phone.</p>
      </div>`;
    const body = Sheet.open(html, { label: "Get started" });
    body.querySelector("[data-act=import]").onclick = () => { Sheet.close(); Util.$("csvInput").click(); };
    body.querySelector("[data-act=sample]").onclick = downloadSample;
  }

  /* ---------- loading rounds ---------- */
  async function adoptRound(round, { optimise }) {
    if (optimise) {
      Busy.show("Optimising route…");
      try { await Optimizer.optimise(round); } finally { Busy.hide(); }
    }
    state.round = round;
    state.progress = Store.loadProgress(round.id);
    rebuildOrder();
    persist();
    state.selectedId = null;
    renderAll();
    const next = nextStop();
    MapView.fit([round.start, ...state.ordered.filter((s) => !doneIds().has(s.id)).slice(0, 6)], { animate: false });
    if (next) Cards.scrollTo(next.id, false);
  }

  async function loadBuiltin() {
    const stops = BUILTIN_ROUND.stops.map((s, i) => ({ ...s, listIndex: i }));
    const round = Round.create({ name: BUILTIN_ROUND.name, source: "builtin", start: BUILTIN_ROUND.start || DEFAULT_START, stops });
    await adoptRound(round, { optimise: true });
  }

  async function importFile(file) {
    try {
      const text = await CsvImport.readFileText(file);
      const parsed = CsvImport.toStops(text);
      const missing = parsed.stops.filter((s) => !Number.isFinite(s.lat)).length;
      if (missing) {
        Busy.show(`Finding ${missing} addresses…`, 0);
        const result = await Geocoder.locateAll(parsed.stops, parsed.defaults, (done, total) =>
          Busy.show(`Finding addresses… ${done}/${total}`, done / total));
        if (result.failed.length) {
          const fallback = state.round ? state.round.start : DEFAULT_START;
          result.failed.forEach((s, i) => { s.lat = fallback.lat + 0.0003 * (i + 1); s.lon = fallback.lon; s.approx = true; s.clients.forEach((c) => { c.notes = `${c.notes ? c.notes + " · " : ""}ADDRESS NOT FOUND`; }); });
        }
      }
      const name = `${file.name.replace(/\.[^.]+$/, "")}`;
      const start = state.round ? state.round.start : DEFAULT_START;
      const round = Round.create({ name, source: "csv", start, stops: parsed.stops });
      await adoptRound(round, { optimise: true });
      const approx = round.stops.filter((s) => s.approx).length;
      const notFound = round.stops.filter((s) => s.clients.some((c) => /ADDRESS NOT FOUND/.test(c.notes))).length;
      const detail = [notFound ? `${notFound} not found` : "", approx ? `${approx} approximate` : ""].filter(Boolean).join(", ");
      Toast.show(`Imported ${parsed.rowCount} clients · ${round.stops.length} stops${detail ? ` · ${detail}` : ""}`, "", null, 7000);
    } catch (err) {
      Busy.hide();
      const offline = err instanceof TypeError ? " Are you online? Address lookup needs internet the first time." : "";
      Toast.show(`Import failed: ${err.message}.${offline}`, "", null, 9000);
      console.error(err);
    }
  }

  /* ---------- location ---------- */
  function handleLocation(position) {
    const first = !state.me;
    state.me = position;
    MapView.setMe(position);
    Cards.updateDirections(position, state.byId);
    updateApproach();
    if (first && !position.stale) { setFollow(true); }
    else reframeFollow();
    renderProgressThrottled();
  }
  const renderProgressThrottled = Util.debounce(renderProgress, 1000);

  function handleLocationStatus(status) {
    const banner = Util.$("gpsBanner");
    if (status.ok) { banner.hidden = true; return; }
    banner.hidden = false;
    banner.classList.toggle("error", status.code === 1 || !window.isSecureContext);
    Util.$("gpsBannerText").textContent = status.message;
  }

  /* ---------- boot ---------- */
  function wireControls() {
    Util.$("btnSettings").onclick = openSettings;
    Util.$("btnLayers").onclick = openLayers;
    Util.$("btnLocate").onclick = () => {
      LiveLocation.enableCompassFromGesture();
      if (!state.me) { Toast.show("Waiting for GPS…"); return; }
      setFollow(!state.follow);
    };
    Util.$("btnOverview").onclick = () => {
      state.mode = state.mode === "all" ? "window" : "all";
      Util.$("btnOverview").classList.toggle("on", state.mode === "all");
      setFollow(false);
      renderMap();
      if (state.mode === "all") MapView.fit([state.round.start, ...state.ordered], { maxZoom: 17 });
      else { const next = nextStop(); MapView.fit([state.me && !state.me.stale ? state.me : null, ...state.ordered.filter((s) => !doneIds().has(s.id)).slice(0, state.settings.windowSize)].filter(Boolean)); if (next) Cards.scrollTo(next.id); }
    };
    Util.$("csvInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (file) importFile(file);
    });
    document.addEventListener("pointerdown", () => LiveLocation.keepScreenOn(), { once: true });
    MapView.on("stopTap", (id) => { if (state.selectedId === id) openStop(id); else selectStop(id, { fly: false }); });
    MapView.on("userPan", () => { if (state.follow) setFollow(false); });
    MapView.on("longPress", askStartHere);
    MapView.map.on("zoomend", () => { if (state.me) MapView.setMe(state.me); });
  }

  async function boot() {
    Sheet.init();
    const saved = Store.loadRound();
    const start = saved ? saved.start : ((BUILTIN_ROUND && BUILTIN_ROUND.start) || DEFAULT_START);
    MapView.init(Util.$("map"), start);
    MapView.setStyle(state.settings.mapStyle);
    Cards.init(Util.$("cards"), {
      select: (id) => selectStop(id, { fly: true, fromCards: true }),
      open: openStop,
      done: markDone,
      undo: undoDone,
    });
    if (BUILTIN_ROUND) Geocoder.seed(BUILTIN_ROUND.stops);
    wireControls();
    if (saved && saved.stops && saved.stops.length) await adoptRound(saved, { optimise: false });
    else if (BUILTIN_ROUND) await loadBuiltin();
    else showWelcome();
    LiveLocation.start(handleLocation, handleLocationStatus);
  }

  return { boot, state, markDone, undoDone, openStop, importFile };
})();

document.addEventListener("DOMContentLoaded", () => {
  App.boot().catch((err) => {
    console.error(err);
    Toast.show(`Start-up error: ${err.message}`, "", null, 15000);
  });
});
</script>
</body>
</html>
